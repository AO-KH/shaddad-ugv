<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaddad UGV Dashboard</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/effra">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&display=block">
<style>
  /* The MARSAD x Fusion look (NASL): flat hairline-bordered surfaces, square geometry (2px only on small chips),
     navy "marker" labels, the NASL gradient on accent lines and progress bars, Effra display type, a blueprint grid
     behind the page. Colours are "R G B" channels so they take an alpha. Light on :root, dark under the media query
     and [data-theme="dark"]. */
  :root {
    --c-canvas: 255 255 255; --c-card: 255 255 255; --c-subtle: 249 248 252; --c-raised: 243 241 248; --c-raised-2: 233 230 240;
    --c-line: 233 230 240; --c-line-strong: 214 210 225; --c-ink: 13 11 20; --c-ink-2: 76 70 89; --c-ink-3: 122 115 137;
    --c-brand: 95 28 184; --c-brand-soft: 243 236 252; --c-accent: 200 109 215; --c-mark: 23 39 127;
    --c-success: 6 118 71; --c-success-soft: 236 253 243; --c-danger: 180 35 24; --c-danger-soft: 254 243 242;
    --c-warning: 181 71 8; --c-warning-soft: 255 250 235; --c-info: 2 132 199; --c-info-soft: 236 254 255;
    --grad: linear-gradient(90deg, #6722ba, #c86dd7);
    --flow: linear-gradient(90deg, #17277f, #6722ba, #c86dd7);
    --brand-gradient: linear-gradient(135deg, #6722ba, #c86dd7);
    --grid-line: rgba(13, 11, 20, 0.035); --glow-a: rgba(103, 34, 186, 0.06); --glow-b: transparent;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: 'Effra', 'Effra Std', 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --c-canvas: 7 6 12; --c-card: 11 10 18; --c-subtle: 17 15 25; --c-raised: 23 20 31; --c-raised-2: 31 27 42;
      --c-line: 33 28 44; --c-line-strong: 47 42 60; --c-ink: 248 246 252; --c-ink-2: 211 206 221; --c-ink-3: 155 148 173;
      --c-brand: 200 109 215; --c-brand-soft: 30 18 37; --c-accent: 167 123 234; --c-mark: 139 154 238;
      --c-success: 71 205 137; --c-success-soft: 5 51 33; --c-danger: 240 118 139; --c-danger-soft: 60 18 28;
      --c-warning: 232 163 61; --c-warning-soft: 58 36 10; --c-info: 100 210 255; --c-info-soft: 12 42 74;
      --flow: linear-gradient(90deg, #8b9aee, #a77bea, #c86dd7);
      --grid-line: rgba(255, 255, 255, 0.03); --glow-a: rgba(200, 109, 215, 0.09); --glow-b: rgba(23, 39, 127, 0.16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --c-canvas: 7 6 12; --c-card: 11 10 18; --c-subtle: 17 15 25; --c-raised: 23 20 31; --c-raised-2: 31 27 42;
    --c-line: 33 28 44; --c-line-strong: 47 42 60; --c-ink: 248 246 252; --c-ink-2: 211 206 221; --c-ink-3: 155 148 173;
    --c-brand: 200 109 215; --c-brand-soft: 30 18 37; --c-accent: 167 123 234; --c-mark: 139 154 238;
    --c-success: 71 205 137; --c-success-soft: 5 51 33; --c-danger: 240 118 139; --c-danger-soft: 60 18 28;
    --c-warning: 232 163 61; --c-warning-soft: 58 36 10; --c-info: 100 210 255; --c-info-soft: 12 42 74;
    --flow: linear-gradient(90deg, #8b9aee, #a77bea, #c86dd7);
    --grid-line: rgba(255, 255, 255, 0.03); --glow-a: rgba(200, 109, 215, 0.09); --glow-b: rgba(23, 39, 127, 0.16);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: rgb(var(--c-canvas)); color: rgb(var(--c-ink)); font: 14px/1.5 var(--font); }
  h1, h2, h3, p { margin: 0; }
  a { color: rgb(var(--c-brand)); }
  ::selection { background: rgb(var(--c-accent) / .35); }
  :focus-visible { outline: 2px solid rgb(var(--c-brand)); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .grid-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(55% 45% at 85% 0%, var(--glow-a), transparent 62%), radial-gradient(45% 40% at 10% 100%, var(--glow-b), transparent 65%),
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: auto, auto, 40px 40px, 40px 40px; }

  /* Material Symbols: a ligature font, the icon name is the text. Hidden when the font did not load. */
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block; white-space: nowrap; direction: inherit; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; flex: none; }
  .no-icons .ms { display: none; }

  /* Header: brand row, section tabs, a reading-progress line along the bottom edge */
  .hdr { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid rgb(var(--c-line)); background: rgb(var(--c-canvas) / .88);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .hdr-row { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: rgb(var(--c-ink)); }
  .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; background: var(--brand-gradient); color: #fff; }
  .brand-mark .ms { font-size: 22px; }
  .brand-word { font-weight: 700; font-size: 19px; letter-spacing: .12em; text-transform: uppercase; }
  .brand-word b { font-weight: 400; color: rgb(var(--c-ink-3)); letter-spacing: .12em; }
  .sep { color: rgb(var(--c-line-strong)); font-size: 18px; }
  .proj { color: rgb(var(--c-ink-2)); font-size: 14px; }
  .hdr-end { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
  .live { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; color: rgb(var(--c-ink-2)); border: 1px solid rgb(var(--c-line)); background: rgb(var(--c-subtle));
    padding: 6px 10px; border-radius: 2px; font-variant-numeric: tabular-nums; }
  .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgb(var(--c-line)); background: rgb(var(--c-card)); color: rgb(var(--c-ink-2));
    cursor: pointer; border-radius: 0; font: inherit; }
  .icon-btn:hover { border-color: rgb(var(--c-brand)); color: rgb(var(--c-ink)); }
  .sig { position: relative; display: inline-block; width: 7px; height: 7px; flex: none; }
  .sig::before, .sig::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: rgb(var(--c-brand)); }
  .live.stale .sig::before, .live.stale .sig::after { background: rgb(var(--c-warning)); }
  .live.down .sig::before, .live.down .sig::after { background: rgb(var(--c-danger)); }
  @media (prefers-reduced-motion: no-preference) {
    .sig::before { animation: sigFlick 1.05s linear infinite; }
    .sig::after { animation: sigPing 1.05s linear infinite; }
    .live.down .sig::before, .live.down .sig::after { animation: none; }
  }
  @keyframes sigPing { 0% { opacity: .65; transform: scale(1); } to { opacity: 0; transform: scale(3.2); } }
  @keyframes sigFlick { 0%, 75%, to { opacity: 1; } 85% { opacity: .35; } }
  .tabs { border-top: 1px solid rgb(var(--c-line)); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 14.5px; color: rgb(var(--c-ink-2)); white-space: nowrap; }
  .tab .ms { font-size: 18px; color: rgb(var(--c-ink-3)); }
  .tab::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: rgb(var(--c-mark)); transform: scaleX(0);
    transform-origin: left center; transition: transform .35s ease; }
  .tab:hover { color: rgb(var(--c-ink)); }
  .tab:hover::after { transform: scaleX(1); }
  .tab[aria-selected="true"] { color: rgb(var(--c-ink)); font-weight: 600; }
  .tab[aria-selected="true"] .ms { color: rgb(var(--c-brand)); }
  .tab[aria-selected="true"]::after { transform: scaleX(1); background: rgb(var(--c-brand)); }
  .read-progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--flow); pointer-events: none; }

  /* Page */
  .dash-main { position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; display: grid; gap: 22px;
    padding: 28px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .page-head { display: grid; gap: 10px; }
  .crumb { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--c-ink-3)); }
  .crumb b { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: rgb(var(--c-mark)); }
  .crumb b::before { content: ''; width: 5px; height: 5px; background: currentColor; }
  .page-head h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; }
  .page-head h1::after { content: ''; display: block; width: 80px; height: 2px; margin-top: 14px; background: var(--grad); transform-origin: left center; }
  .lede { color: rgb(var(--c-ink-2)); font-size: 15px; max-width: 80ch; }
  @media (prefers-reduced-motion: no-preference) {
    .enter > * { animation: blurIn .55s var(--ease) both; }
    .page-head.enter h1::after { animation: accGrow .7s .25s var(--ease) both; }
  }
  @keyframes blurIn { from { opacity: 0; filter: blur(14px); transform: translateY(8px); } to { opacity: 1; filter: none; transform: none; } }
  @keyframes accGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Marker label: navy text after a small square bullet, caps and tracking */
  .label-k { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--c-mark)); }
  .label-k::before { content: ''; width: 5px; height: 5px; flex: none; background: currentColor; }

  /* 2px seam grid: cells on the card colour, seams in the hairline colour */
  .seam { display: grid; gap: 2px; background: rgb(var(--c-line)); border: 1px solid rgb(var(--c-line)); }
  .seam > * { background: rgb(var(--c-card)); min-width: 0; }
  /* Column counts the items fill: 6 figures in 6, 3, 2 or 1 columns; 8 subsystems in 4, 2 or 1 columns */
  .kpis { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 900px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .kpi { padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
  .kpi .big { font-size: 34px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .big small { font-size: 14px; font-weight: 400; color: rgb(var(--c-ink-3)); }
  .kpi .sub { font-size: 12.5px; color: rgb(var(--c-ink-3)); overflow-wrap: anywhere; }
  .bar { height: 4px; background: rgb(var(--c-raised-2)); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--flow); }
  .bar.split { display: flex; }
  .bar.split > .ok { background: rgb(var(--c-success)); }
  .bar.split > .bad { background: rgb(var(--c-danger)); }

  /* Panels: flat, square, hairline-bordered; hierarchy from borders and surface steps */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 22px; align-items: start; }
  .panel { background: rgb(var(--c-card)); border: 1px solid rgb(var(--c-line)); display: grid; gap: 14px; padding: 20px; min-width: 0; }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel-head > div { display: grid; gap: 6px; min-width: 0; }
  .panel-title { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgb(var(--c-line)); border-radius: 2px; background: rgb(var(--c-subtle));
    padding: 2px 8px; font-size: 11.5px; font-weight: 500; color: rgb(var(--c-brand)); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { font-size: 12.5px; color: rgb(var(--c-ink-3)); }
  .scroll { overflow-x: auto; min-width: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--c-ink-3)); padding: 8px 10px;
    border-bottom: 1px solid rgb(var(--c-line-strong)); white-space: nowrap; background: rgb(var(--c-subtle)); }
  td { padding: 8px 10px; border-bottom: 1px solid rgb(var(--c-line)); vertical-align: top; }
  tbody tr:hover td { background: rgb(var(--c-subtle)); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 2px; font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
  .pill::before { content: ''; width: 6px; height: 6px; background: currentColor; flex: none; }
  .k-ok { color: rgb(var(--c-success)); background: rgb(var(--c-success-soft)); border-color: rgb(var(--c-success) / .25); }
  .k-warn { color: rgb(var(--c-warning)); background: rgb(var(--c-warning-soft)); border-color: rgb(var(--c-warning) / .25); }
  .k-bad { color: rgb(var(--c-danger)); background: rgb(var(--c-danger-soft)); border-color: rgb(var(--c-danger) / .25); }
  .k-run { color: rgb(var(--c-brand)); background: rgb(var(--c-brand-soft)); border-color: rgb(var(--c-brand) / .3); }
  .k-muted { color: rgb(var(--c-ink-3)); background: rgb(var(--c-raised)); border-color: rgb(var(--c-line)); }
  .k-info { color: rgb(var(--c-info)); background: rgb(var(--c-info-soft)); border-color: rgb(var(--c-info) / .25); }
  .k-mark { color: rgb(var(--c-mark)); background: rgb(var(--c-raised)); border-color: rgb(var(--c-mark) / .3); }
  .jl li { grid-template-columns: 8.5rem 7.5rem minmax(0, 1fr); }
  .jl .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .linkish { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; color: rgb(var(--c-brand)); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .day { padding-top: 10px; }
  pre.log { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 72vh; overflow: auto; margin: 0; color: rgb(var(--c-ink-2)); }
  .reader { position: sticky; top: 124px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  .shot { display: grid; gap: 6px; padding: 10px; border: 0; margin: 0; cursor: zoom-in; text-align: left; font: inherit; color: inherit; }
  .shot:hover { background: rgb(var(--c-subtle)); }
  .shot img { width: 100%; height: 170px; object-fit: contain; background: #fff; border: 1px solid rgb(var(--c-line)); }
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgb(var(--c-canvas) / .92); display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .lightbox figure { margin: 0; display: grid; gap: 10px; max-width: 100%; max-height: 100%; }
  .lightbox img { max-width: min(1400px, 96vw); max-height: 84vh; object-fit: contain; background: #fff; border: 1px solid rgb(var(--c-line-strong)); }
  .lightbox figcaption { font-size: 13px; color: rgb(var(--c-ink-2)); }
  .search { font: inherit; font-size: 13px; color: rgb(var(--c-ink)); background: rgb(var(--c-subtle)); border: 1px solid rgb(var(--c-line-strong));
    border-radius: 0; padding: 8px 12px; min-width: 0; flex: 1 1 220px; }
  select.search { flex: 0 1 200px; }
  .search:hover { border-color: rgb(var(--c-ink-3) / .55); }
  .search:focus { outline: none; border-color: rgb(var(--c-brand)); background: rgb(var(--c-card)); }
  @media (max-width: 900px) { .reader { position: static; } }
  @media (max-width: 680px) { .jl li { grid-template-columns: minmax(0, 1fr); } }
  .t-bad { color: rgb(var(--c-danger)); }
  .empty { color: rgb(var(--c-ink-3)); font-size: 13px; padding: 6px 0; }
  .err { color: rgb(var(--c-danger)); font-size: 13px; }

  /* Subsystem cards: a blueprint band with a glowing glyph and a readout, then the figures */
  .subs { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 600px) { .subs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1180px) { .subs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .sub { display: flex; flex-direction: column; border: 0; padding: 0; margin: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; background: rgb(var(--c-card));
    transition: background-color .25s; }
  .sub:hover { background: rgb(var(--c-subtle)); }
  .sub-v { position: relative; height: 118px; display: grid; place-items: center; overflow: hidden; color: rgb(var(--c-brand)); border-bottom: 1px solid rgb(var(--c-line));
    background: radial-gradient(ellipse 50% 62% at 50% 52%, rgb(var(--c-brand) / .12), transparent 72%),
      linear-gradient(rgb(var(--c-ink) / .045) 1px, transparent 1px) -1px -1px / 22px 22px,
      linear-gradient(90deg, rgb(var(--c-ink) / .045) 1px, transparent 1px) -1px -1px / 22px 22px, rgb(var(--c-subtle)); }
  .sub-v::after { content: ''; position: absolute; left: 0; bottom: 0; width: 0; height: 2px; background: var(--grad); transition: width .4s ease; }
  .sub:hover .sub-v::after { width: 100%; }
  .sub-v .ms { font-size: 52px; font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48; filter: drop-shadow(0 0 10px rgb(var(--c-brand) / .35)); transition: transform .45s var(--ease); }
  .sub:hover .sub-v .ms { transform: translateY(-3px); }
  .sub-r { position: absolute; bottom: 10px; right: 12px; font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--c-brand) / .85); }
  .sub-state { position: absolute; top: 10px; left: 12px; }
  .sub-b { display: grid; gap: 10px; padding: 16px 18px 18px; flex: 1; }
  .sub-t { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .sub dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
  .sub dt { color: rgb(var(--c-ink-3)); } .sub dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .cta { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: rgb(var(--c-ink-3)); transition: color .2s, gap .2s; }
  .cta .ms { font-size: 16px; }
  .sub:hover .cta { color: rgb(var(--c-brand)); gap: 10px; }

  .list { display: grid; margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .list li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid rgb(var(--c-line)); }
  .list li:last-child { border-bottom: 0; }
  .when { color: rgb(var(--c-ink-3)); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  .what { overflow-wrap: anywhere; }
  .plan { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid rgb(var(--c-line)); }
  .plan:first-child { padding-top: 0; } .plan:last-child { border-bottom: 0; padding-bottom: 0; }
  .plan-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .plan-name { font-weight: 700; }
  .tasks { display: grid; margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .tasks li { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgb(var(--c-line)); }
  .tasks li:last-child { border-bottom: 0; }
  .tasks .n { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: rgb(var(--c-mark)); font-variant-numeric: tabular-nums; }
  .ledger { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
  .ledger li { border-left: 2px solid rgb(var(--c-line-strong)); padding: 2px 0 2px 12px; overflow-wrap: anywhere; color: rgb(var(--c-ink-2)); }
  .ledger li:first-child { border-left-color: rgb(var(--c-brand)); color: rgb(var(--c-ink)); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: rgb(var(--c-line)); border: 1px solid rgb(var(--c-line)); }

<body>
<div class="grid-bg" aria-hidden="true"></div>
<header class="hdr">
  <div class="hdr-row">
    <a class="brand" href="#overview" aria-label="Shaddad UGV, overview"><span class="brand-mark" aria-hidden="true"><span class="ms">agriculture</span></span><span class="brand-word">Shaddad <b>UGV</b></span></a>
    <span class="sep" aria-hidden="true">/</span><span class="proj">Project dashboard</span>
    <div class="hdr-end">
      <span class="live" id="live" role="status"><span class="sig" aria-hidden="true"></span><span id="live-text">Connecting…</span></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch theme"><span class="ms" id="theme-icon">contrast</span></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <span class="read-progress" id="progress" aria-hidden="true"></span>
</header>

<main class="dash-main">
  <div class="page-head" id="page-head">
    <nav class="crumb" aria-label="Breadcrumb"><span>Shaddad UGV</span><span aria-hidden="true">/</span><b id="crumb-here">Overview</b></nav>
    <h1 id="page-title">Overview</h1>
    <p class="lede" id="page-lede"></p>
  </div>
  <section class="seam kpis" id="strip" aria-label="Summary"></section>
  <div id="view"></div>
</main>

<script>
  const TABS = [
    ['overview', 'Overview', 'space_dashboard', 'The whole project at a glance, read live from the files on this computer.'],
    ['project', 'Project', 'flag', 'The task cards under the R&D life-cycle gates: what is done, what is under way and what is left until the project is done.'],
    ['agents', 'Team', 'groups', 'The team at work: who is working on what, the steps of each task, and every pass with its time.'],
    ['subsystems', 'Subsystems', 'deployed_code', 'Each part of the robot: its models, tests, open problems and build tasks.'],
    ['work', 'Plans and work', 'checklist', 'The plans in docs/superpowers/plans, every task’s state, and the work logs behind them.'],
    ['journal', 'Journal', 'history_edu', 'Everything that happened, newest first: work started and done, results, rulings, your decisions, and what the dashboard noticed by itself.'],
    ['reports', 'Reports', 'summarize', 'Task reports and decisions, layout reports, STATUS.md and the HTML test reports, with a reader.'],
    ['tests', 'Tests', 'science', 'The latest logged run of every test class, next to the Oct 23 acceptance.'],
    ['models', 'Models', 'account_tree', 'Every model, subsystem and bench file, by folder.'],
    ['scenarios', 'Scenarios', 'route', 'Saved scenario results and the documented acceptance results.'],
    ['plots', 'Plots', 'monitoring', 'The plots earlier runs saved: live-drive logs, row tests and other figures. Select one to open it full size.'],
    ['problems', 'Open problems', 'report', 'Open problems from STATUS.md and the open items Claude keeps.'],
    ['docs', 'Docs', 'description', 'The project documents, newest first, with a reader for STATUS.md.'],
    ['computer', 'Computer', 'memory', 'Memory, disk, sleeps, MATLAB runs and the toolchain on this computer.'],
  ];
  const DOMAIN_ICON = { structure: 'agriculture', power: 'battery_charging_full', drive: 'settings', rc: 'settings_remote',
    electronics: 'memory', sensors: 'sensors', gnc: 'route', integration: 'hub' };
  let DATA = null, lastOk = 0, failing = false, focusDomain = null, shownTab = null;
  let journalFilter = 'all', readerPath = null;
  const READER = { path: null, text: null, error: null };
  const JKIND = { start: ['Started', 'run'], done: ['Done', 'ok'], result: ['Result', 'info'], ruling: ['Ruling', 'mark'],
    decision: ['Your decision', 'mark'], 'needs-you': ['Needs you', 'bad'], resolved: ['Resolved', 'ok'], issue: ['Issue', 'bad'],
    note: ['Note', 'muted'], run: ['MATLAB run', 'run'], report: ['Report', 'info'], change: ['Change', 'muted'], sleep: ['Sleep', 'warn'] };
  const JFILTERS = [['all', 'All', () => true], ['needs-you', 'Needs you', (e) => e.kind === 'needs-you' || e.kind === 'resolved'],
    ['results', 'Results', (e) => e.kind === 'result'], ['work', 'Started and done', (e) => e.kind === 'start' || e.kind === 'done'],
    ['rulings', 'Rulings and decisions', (e) => e.kind === 'ruling' || e.kind === 'decision'], ['issues', 'Issues', (e) => e.kind === 'issue'],
    ['auto', 'Noticed by the dashboard', (e) => e.by === 'dashboard']];
  function needsYou(d) {
    const items = ((d.notes && d.notes.items) || []).filter((i) => i.kind === 'you' || /your word|needs you/i.test(i.state || ''));
    const j = d.journal || [];
    const open = j.filter((e) => e.kind === 'needs-you' && !j.some((r) => r.kind === 'resolved' && r.task === e.task && r.at > e.at));
    return { items, open, count: items.length + open.length };
  }
  function openReport(path) {
    readerPath = path;
    if (location.hash !== '#reports') location.hash = 'reports'; else draw();
  }

  // ---- helpers: every value goes in as text, never as HTML
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }
  const icon = (name) => h('span', { class: 'ms', 'aria-hidden': 'true' }, name);
  const fmtN = (n) => (n === null || n === undefined ? '' : Number(n).toLocaleString('en-US'));
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function when(s, withTime = true) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return String(s);
    const t = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    return `${MON[d.getMonth()]} ${d.getDate()}` + (withTime ? `, ${t}` : '');
  }
  function ago(s) {
    if (!s) return '';
    const sec = (Date.now() - new Date(s).getTime()) / 1000;
    if (sec < 60) return 'just now';
    if (sec < 3600) return `${Math.round(sec / 60)} min ago`;
    if (sec < 86400) return `${Math.round(sec / 3600)} h ago`;
    return `${Math.round(sec / 86400)} d ago`;
  }
  const pill = (text, kind) => h('span', { class: `pill k-${kind || 'muted'}` }, text);
  const bar = (frac) => h('div', { class: 'bar', role: 'img', 'aria-label': `${Math.round(frac * 100)}%` },
    h('span', { style: `width:${Math.max(0, Math.min(1, frac)) * 100}%` }));
  function panel(label, title, readout, ...body) {
    return h('section', { class: 'panel' },
      h('div', { class: 'panel-head' }, h('div', {}, label ? h('span', { class: 'label-k' }, label) : null, h('h2', { class: 'panel-title' }, title)),
        readout ? h('span', { class: 'chip' }, readout) : null), ...body);
  }
  const empty = (t) => h('p', { class: 'empty' }, t);
  function table(cols, rows) {
    return h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, cols.map((c) => h('th', { class: [c.num ? 'num' : '', c.narrow ? 'hide-narrow' : ''].join(' ').trim() || null }, c.label)))),
      h('tbody', {}, rows.map((r) => h('tr', {}, cols.map((c) =>
        h('td', { class: [c.num ? 'num' : '', c.nowrap ? 'nowrap' : '', c.mono ? 'mono' : '', c.narrow ? 'hide-narrow' : ''].join(' ').trim() || null }, c.get(r))))))));
  }
  const STATUS_KIND = { done: 'ok', running: 'run', waiting: 'muted' };

  // ---- summary strip
  function kpi(label, value, sub, extra) {
    return h('div', { class: 'kpi' }, h('span', { class: 'label-k' }, label), h('span', { class: 'big' }, value), sub ? h('span', { class: 'sub' }, sub) : null, extra || null);
  }
  function drawStrip(d) {
    const m = d.machine || {};
    const runs = (m.matlab || []).filter((p) => p.kind === 'batch');
    const desk = (m.matlab || []).filter((p) => p.kind === 'desktop');
    const active = (d.plans || []).find((p) => p.state === 'In progress');
    const cls = (d.tests && d.tests.classes) || [];
    let tp = 0, tt = 0, tf = 0;
    cls.forEach((c) => { const r = c.latest || (c.documented && { total: c.documented.tests, ...c.documented }); if (r) { tp += r.passed; tt += r.total; tf += r.failed; } });
    const probs = ((d.status && d.status.problems) || []).length;
    const open = ((d.notes && d.notes.items) || []).filter((i) => i.kind === 'wait').length;
    const ny = needsYou(d);
    const first = ny.open[0] ? ny.open[0].text : ny.items[0] ? ny.items[0].item : '';
    document.getElementById('strip').replaceChildren(
      kpi('Needs you', h('span', { class: ny.count ? 't-bad' : null }, `${ny.count}`), ny.count ? first : 'Nothing to decide right now'),
      kpi('MATLAB now', runs.length ? h('span', {}, `${runs.length}`, h('small', {}, ` batch run${runs.length > 1 ? 's' : ''}`)) : (desk.length ? 'Desktop' : 'Idle'),
        runs.length ? runs[0].command : (m.asleep_since ? `Asleep since ${when(m.asleep_since)}` : 'No batch run')),
      kpi('Active plan', active ? h('span', {}, `${active.done}`, h('small', {}, ` / ${active.total} tasks`)) : 'None',
        active ? `${active.title}${active.current ? ' · Task ' + active.current.n : ''}` : 'No plan in progress', active ? bar(active.done / Math.max(1, active.total)) : null),
      kpi('Tests passed', h('span', {}, fmtN(tp), h('small', {}, ` / ${fmtN(tt)}`)), `${fmtN(tf)} failing in ${cls.length} test classes`, tt ? bar(tp / tt) : null),
      kpi('Open problems', h('span', {}, `${probs}`), `in STATUS.md · ${open} waiting on you or blocked`),
      kpi('Memory free', h('span', {}, `${m.ram_free_gb ?? '–'}`, h('small', {}, ` / ${m.ram_total_gb ?? '–'} GB`)), `Disk free ${m.disk_free_gb ?? '–'} GB`,
        m.ram_total_gb ? bar(m.ram_free_gb / m.ram_total_gb) : null),
    );
  }

  // ---- tabs and page head
  function currentTab() {
    const t = location.hash.slice(1);
    return TABS.some(([id]) => id === t) ? t : 'overview';
  }
  function drawTabs() {
    const cur = currentTab();
    document.getElementById('tabs').replaceChildren(...TABS.map(([id, label, ic]) =>
      h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(id === cur), on: { click: () => { location.hash = id; } } }, icon(ic), label)));
    const [, label, , lede] = TABS.find(([id]) => id === cur);
    document.getElementById('page-title').textContent = label;
    document.getElementById('crumb-here').textContent = label;
    document.getElementById('page-lede').textContent = lede;
  }

  // ---- views
  function viewOverview(d) {
    const m = d.machine || {};
    const runs = m.matlab || [];
    const active = (d.plans || []).find((p) => p.state === 'In progress');
    return h('div', { style: 'display:grid;gap:22px' },
      h('div', { class: 'cols' },
        panel('Live', 'Running now', m.boot ? `on since ${when(m.boot)}` : null,
          runs.length ? table([
            { label: 'Run', get: (p) => p.kind === 'batch' ? pill('batch', 'run') : pill('desktop', 'warn') },
            { label: 'Command', get: (p) => h('span', { class: 'mono' }, p.command) },
            { label: 'Started', get: (p) => when(p.started), nowrap: true },
            { label: 'Memory', get: (p) => `${p.mem_gb} GB`, num: true },
          ], runs) : empty(m.asleep_since ? `The computer is asleep since ${when(m.asleep_since)}.` : 'No MATLAB is running.'),
          latestLogs(d, 5)),
        panel('Upcoming', 'Up next', 'plans and open items', upNext(d, 8))),
      h('div', { class: 'cols' },
        panel('Journal', 'Latest entries', 'all entries in Journal', journalList((d.journal || []).slice(0, 8)),
          h('button', { class: 'linkish', type: 'button', on: { click: () => { location.hash = 'journal'; } } }, 'Open the journal')),
        panel('Plans', 'Plans in progress', 'docs/superpowers/plans', plansSummary(d))),
      h('div', { style: 'display:grid;gap:12px' }, h('div', { class: 'panel-head' }, h('div', {}, h('span', { class: 'label-k' }, 'The robot'), h('h2', { class: 'panel-title' }, 'Subsystems')),

  }
  function viewAgents() {
    if (!AG) return panel('tools/dashboard/agents.jsonl', 'Agents', null, empty('Reading the agents\u2026'));
    const team = AG.team || [], tasks = AG.tasks || [], runs = AG.runs || [];
    const working = runs.filter((r) => r.status === 'working').length;
    const tokens = runs.reduce((sum, r) => sum + (r.tokens || 0), 0);
    const members = team.filter((a) => a.name !== 'lead');
    const taskTitle = (id) => (tasks.find((t) => t.id === id) || {}).title || id;
    return h('div', { style: 'display:grid;gap:22px' },
      panel('tools/dashboard/agents.jsonl', 'The work now', `${members.length} agents · ${working} working · ${runs.length} runs · ${fmtTok(tokens) || 0} tokens`,
        kanban(AG)),
      panel('.claude/agents', 'The team', `${members.length} agents · ${members.filter((a) => a.group === 'subsystem').length} subsystem engineers · ${members.filter((a) => a.group === 'specialist').length} specialists`,
        teamList(AG)),
      panel('Timeline', 'Runs today, with handoffs', `${tasks.length} task${tasks.length === 1 ? '' : 's'}`, timeline(AG)),
      panel('tools/dashboard/agents.jsonl', 'Every run', `${runs.length} runs`, runs.length ? table([
        { label: 'Start', get: (r) => when(r.start), nowrap: true },
        { label: 'Agent', get: (r) => shortName(r.agent), nowrap: true },
        { label: 'Task', get: (r) => taskTitle(r.task), narrow: true },
        { label: 'Work', get: (r) => r.what },
        { label: 'State', get: (r) => pill(AG_LABEL[r.status] || r.status, AG_KIND[r.status] || 'muted') },
        { label: 'Time', get: (r) => fmtDur(runSeconds(r)), num: true, nowrap: true },
        { label: 'Tokens', get: (r) => fmtTok(r.tokens), num: true },
        { label: 'Result', get: (r) => r.summary, narrow: true },
      ], runs.slice().reverse()) : empty('No runs yet.')));
  }
  // ---- Project tab: the task cards under the tailored life-cycle gates (docs/lifecycle.md, tools/dashboard/project_cards.json)
  let projGate = 'all', projState = 'all';
  const projOpen = new Set();   // the cards the user opened stay open across the refreshes
  const projCrit = new Set();   // the gates whose criteria list is open
  const GATE_ST = { open: ['Open', 'muted'], 'in review': ['In review', 'warn'], passed: ['Passed', 'ok'],
    'passed with actions': ['Passed with actions', 'ok'], 'delta review': ['Delta review', 'bad'], 'no-go': ['No-go', 'bad'] };
  const SCORE_KIND = { met: 'ok', waived: 'info', partly: 'warn', 'not met': 'bad', 'n/a': 'muted', 'not assessed': 'muted' };
  const CARD_KIND = { done: 'ok', 'in progress': 'run', 'needs you': 'bad', todo: 'muted' };
  const CARD_LABEL = { done: 'Done', 'in progress': 'In progress', 'needs you': 'Needs you', todo: 'To do' };
  const CARD_ORDER = ['needs you', 'in progress', 'todo', 'done'];
  const gateLabel = (g) => (g.id === 'BUILD' ? 'Build' : g.id);
  const rawLink = (path, text) => h('a', { href: '/raw/' + path.split('/').map(encodeURIComponent).join('/'), target: '_blank', rel: 'noopener' },
    text || path.split('/').pop());
  const PRIO = { now: 'Now', next: 'Next', later: 'Later', done: 'Done' };
  const SIZE = { S: 'S, one engineer, one pass', M: 'M, two or three engineers or two passes', L: 'L, several engineers and system runs',
    XL: 'XL, every subsystem or several safety chains' };
  const LVL = { L: 'low', M: 'medium', H: 'high' };
  function cardItem(c, byId) {
    const list = (xs) => (xs && xs.length ? h('ul', { class: 'pj-ul' }, xs.map((x) => h('li', {}, x))) : null);
    const ref = (id) => h('span', {}, h('b', {}, id), byId[id] ? ` ${byId[id].title}` : '');
    const gate = (g) => (g ? h('div', {}, h('b', {}, g.gate || ''), list(g.criteria)) : null);
    const rows = [
      ['Lead', c.lead ? h('b', {}, c.lead) : null], ['Support', list(c.support)], ['Purpose', c.purpose],
      ['Entry gate', gate(c.entry)], ['Exit gate', gate(c.exit)],
      ['Predecessors', list((c.predecessors || []).map(ref)) || 'None'], ['Successors', list((c.successors || []).map(ref)) || 'None'],
      ['Inputs', list(c.inputs)], ['Outputs', list(c.outputs)], ['Verification', c.verification],
      ['Risks', list((c.risks || []).map((r) => `${r.risk} (likelihood ${LVL[r.likelihood] || r.likelihood}, impact ${LVL[r.impact] || r.impact}). Mitigation: ${r.mitigation}`))],
      ['Escalation', list((c.escalation || []).map((e) => `${e.when}: to ${e.to}`))],
      ['Your decisions', (c.decisions || []).length ? c.decisions.join(', ') : null], ['Effort', c.effort],
    ];
    const foot = [c.report ? ['Report: ', rawLink(c.report)] : null, c.report && c.task ? ' · ' : null, c.task ? `Work log: ${c.task}` : null];
    const meta = [c.wbs ? `WBS ${c.wbs}` : null, c.size ? `size ${SIZE[c.size] || c.size}` : null,
      c.priority && c.priority !== 'done' ? `priority ${(PRIO[c.priority] || c.priority).toLowerCase()}` : null]
      .filter(Boolean).join(' · ');
    return h('li', {}, h('details', { open: projOpen.has(c.id),
      on: { toggle: (e) => { if (e.target.open) projOpen.add(c.id); else projOpen.delete(c.id); } } },
      h('summary', {}, h('span', { class: 'chip mono' }, c.id), h('span', { class: 'what' }, c.title),
        h('span', { class: 'pj-tags' }, c.priority === 'next' ? pill('Next', 'info') : null, pill(CARD_LABEL[c.status] || c.status, CARD_KIND[c.status]))),
      h('div', { class: 'pj-body' },
        meta ? h('p', { class: 'note' }, meta) : null,
        c.description ? h('div', { class: 'pj-desc' }, c.description.split('\n\n').map((blk) => {
          const ls = blk.split('\n').filter((x) => x.trim());
          const items = ls.filter((x) => x.startsWith('- ')).map((x) => x.slice(2));
          const text = ls.filter((x) => !x.startsWith('- ')).join(' ');
          return [text ? h('p', {}, text) : null, items.length ? h('ul', { class: 'pj-ul' }, items.map((x) => h('li', {}, x))) : null];
        }).flat()) : null,
        h('dl', { class: 'facts' }, rows.filter(([, v]) => v !== null && v !== undefined && v !== '').map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]).flat()),
        c.note ? h('p', { class: 'note' }, c.note) : null,
        (c.links || []).length ? h('div', { class: 'pj-links', 'aria-label': 'Linked items' }, c.links.map((l) => h('span', { class: 'chip' }, l))) : null,
        c.report || c.task ? h('p', { class: 'note' }, foot.flat()) : null)));
  }
  function viewProject(d) {
    const p = d.project;
    if (!p) return empty('No project cards: tools/dashboard/project_cards.json is missing.');
    const cards = p.cards || [], gates = p.gates || [], n = p.counts || {};
    const byId = Object.fromEntries(cards.map((c) => [c.id, c]));
    const total = p.total || cards.length, done = n.done || 0;
    const passed = gates.filter((g) => g.status === 'passed').length;
    const match = (c) => projState === 'all' || c.status === projState;
    const shown = gates.filter((g) => (projGate === 'all' || g.id === projGate) && (projState === 'all' || cards.some((c) => c.gate === g.id && match(c))));
    const gateBtn = (g) => h('button', { type: 'button', 'aria-pressed': String(projGate === g.id),
      on: { click: () => { projGate = projGate === g.id ? 'all' : g.id; draw(); } } },
      h('span', { class: 'label-k' }, gateLabel(g)), h('span', { class: 'pj-gname' }, g.name),
      h('span', { class: 'pj-gsub' }, `${g.counts.done} / ${g.cards} cards done`), bar(g.cards ? g.counts.done / g.cards : 0),
      g.readiness && g.readiness.mandatory ? h('span', { class: 'pj-gsub' }, `readiness ${g.readiness.ok} / ${g.readiness.mandatory}`) : null,
      pill(GATE_ST[g.status] ? GATE_ST[g.status][0] : 'Open', GATE_ST[g.status] ? GATE_ST[g.status][1] : 'muted'));
    const stateBtn = ([k, t]) => h('button', { type: 'button', 'aria-pressed': String(projState === k), on: { click: () => { projState = k; draw(); } } }, t);
    return h('div', { style: 'display:grid;gap:22px' },
      panel('Life cycle', 'Project progress', `${done} / ${total} cards done · ${passed} / ${gates.length} gates passed`,
        h('p', { class: 'note' }, p.complete ? 'Every card is done and every gate is passed: the project is done.'
          : 'The project is done when every card is done and every gate is passed (docs/lifecycle.md). Select a gate to show only its cards; select a card to open it.'),
        bar(total ? done / total : 0),
        h('div', { class: 'pj-gates', role: 'group', 'aria-label': 'Gates' }, gates.map(gateBtn)),
        h('div', { class: 'seg', role: 'group', 'aria-label': 'Card status' },
          [['all', `All ${total}`], ...CARD_ORDER.map((s) => [s, `${CARD_LABEL[s]} ${n[s] || 0}`])].map(stateBtn)),
        h('p', { class: 'note' }, p.pdf ? ['Every card defined in full (entry and exit gates, inputs, outputs, risks, escalation) as a PDF: ',
          rawLink(p.pdf)] : 'Build the PDF of the cards with python tools/reports/build_task_cards.py.'),
        h('span', { class: 'note mono' }, `${p.path} · updated ${when(p.updated || p.file_updated)}`)),
      shown.length ? h('div', { class: 'cols' }, shown.map((g) => {
        const cs = cards.filter((c) => c.gate === g.id && match(c));
        return panel(`${gateLabel(g)} · ${g.name} · ${g.scope}`, g.title, `${g.counts.done} / ${g.cards} done`,
          bar(g.cards ? g.counts.done / g.cards : 0),
          h('dl', { class: 'facts' }, h('dt', {}, 'Question'), h('dd', {}, g.question), h('dt', {}, 'Locks'), h('dd', {}, g.locks),
            h('dt', {}, 'Status'), h('dd', {}, pill(GATE_ST[g.status] ? GATE_ST[g.status][0] : 'Open', GATE_ST[g.status] ? GATE_ST[g.status][1] : 'muted'),
              g.decision ? ` ${g.decision.outcome || ''} · ${g.decision.date || ''}` : ''),
            h('dt', {}, 'Where it stands'), h('dd', {}, g.assessment || '')),
          (g.criteria || []).length ? h('details', { class: 'pj-crit', open: projCrit.has(g.id) || null,
            on: { toggle: (e) => { if (e.target.open) projCrit.add(g.id); else projCrit.delete(g.id); } } },
            h('summary', {}, `Success criteria · readiness ${g.readiness.ok} / ${g.readiness.mandatory} mandatory`),
            table([
              { label: 'ID', get: (k) => h('span', { class: 'mono' }, k.id), nowrap: true },
              { label: 'Criterion', get: (k) => k.criterion },
              { label: 'Class', get: (k) => k['class'], nowrap: true },
              { label: 'Score', get: (k) => pill(k.score || 'not assessed', SCORE_KIND[k.score] || 'muted'), nowrap: true },
              { label: 'Evidence or note', get: (k) => k.note || k.evidence, narrow: true },
            ], g.criteria)) : null,
          cs.length ? h('ul', { class: 'pj-cards' }, cs.map((c) => cardItem(c, byId))) : empty('No cards.'));
      })) : empty('No cards match this filter.'));
  }
  const VIEWS = { overview: viewOverview, project: viewProject, agents: viewAgents, subsystems: viewSubsystems, work: viewWork, journal: viewJournal, reports: viewReports,
    tests: viewTests, models: viewModels, scenarios: viewScenarios, plots: viewPlots, problems: viewProblems, docs: viewDocs,
    computer: viewComputer };
  function draw() {
    drawTabs();
    if (!DATA) return;
    drawStrip(DATA);
    const view = document.getElementById('view');
    const head = document.getElementById('page-head');
    const tab = currentTab();
    const fresh = tab !== shownTab;   // the enter animation plays on a tab change, not on a refresh
    shownTab = tab;
    const y = window.scrollY;
    // keep the focus and the caret of a field across a redraw (a refresh must not interrupt typing)
    const act = document.activeElement;
    const actId = act && act.id && view.contains(act) ? act.id : null;
    const caret = actId && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const parts = [VIEWS[tab](DATA)];
    if ((DATA.errors || []).length) parts.push(h('p', { class: 'err' }, 'Some parts could not be read: ' + DATA.errors.join('; ')));
    view.replaceChildren(...parts);
    view.classList.toggle('enter', fresh);
    head.classList.toggle('enter', fresh);
    if (!fresh) window.scrollTo(0, y);
    if (actId) {
      const el = document.getElementById(actId);
      if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange) el.setSelectionRange(caret[0], caret[1]); }
    }
  }
  function drawLive() {
    const live = document.getElementById('live');
    const text = document.getElementById('live-text');
    if (failing) { live.className = 'live down'; text.textContent = 'Dashboard server not answering'; return; }
    if (!DATA) return;
    const age = (Date.now() - lastOk) / 1000;
    live.className = 'live' + (age > 120 ? ' stale' : '');
    text.textContent = `Live · read ${ago(DATA.meta.generated)} · checked ${age < 60 ? Math.round(age) + ' s' : Math.round(age / 60) + ' min'} ago`;
  }
  async function poll(force) {
    try {
      const r = await fetch('/api/status' + (force ? '?refresh=1' : ''), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      DATA = await r.json();
      lastOk = Date.now();
      failing = false;
      draw();
    } catch (e) {
      failing = true;
    }
    drawLive();
  }
  const THEMES = ['auto', 'light', 'dark'];
  const THEME_ICON = { auto: 'contrast', light: 'light_mode', dark: 'dark_mode' };
  function applyTheme(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme-icon').textContent = THEME_ICON[t];
    document.getElementById('theme').setAttribute('aria-label', `Theme: ${t}. Switch theme`);
  }
  let theme = 'auto';
  try { theme = localStorage.getItem('shaddad-theme') || 'auto'; } catch (e) { /* storage blocked */ }
  applyTheme(theme);
  document.getElementById('theme').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(theme);
    try { localStorage.setItem('shaddad-theme', theme); } catch (e) { /* storage blocked */ }
  });
  const progress = document.getElementById('progress');
  window.addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = `${max > 0 ? Math.min(100, window.scrollY / max * 100) : 0}%`;
  }, { passive: true });
  if (document.fonts && document.fonts.load) {
    document.fonts.load('20px "Material Symbols Outlined"').then((f) => { if (!f.length) document.documentElement.classList.add('no-icons'); })
      .catch(() => document.documentElement.classList.add('no-icons'));
  }
  window.addEventListener('hashchange', draw);
  drawTabs();
  poll(false);
  setInterval(() => poll(false), 20000);
  setInterval(drawLive, 1000);
  pollAgents();
  setInterval(pollAgents, 4000);
</script>
</body>
