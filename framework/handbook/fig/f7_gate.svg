ill="none" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="30" y="464" width="230" height="60" rx="8" fill="#5F6070" stroke="#2B2F7E" stroke-width="2"/><text x="145.0" y="501.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">No-go</text><rect x="270" y="464" width="560" height="60" rx="8" fill="#ffffff" stroke="#5F6070" stroke-width="2"/><text x="550.0" y="489.6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5F6070">a basic problem: stay in the phase</text><text x="550.0" y="510.3" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5F6070">and re-plan</text><rect x="860" y="560" width="420" height="66" rx="8" fill="#2B2F7E" stroke="#2B2F7E" stroke-width="2"/><text x="1070.0" y="588.6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">5 Record: the gate report (PDF), the decision</text><text x="1070.0" y="609.3" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">record, the gate status, the baseline locked</text></svg>