<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="570" viewBox="0 0 1300 570"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6D8A"/></marker></defs><rect width="1300" height="570" fill="#ffffff"/><rect x="20" y="240" width="230" height="100" rx="8" fill="#2B2F7E" stroke="#2B2F7E" stroke-width="2"/><text x="135.0" y="284.3" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">A request</text><text x="135.0" y="311.1" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">from the owner</text><line x1="250" y1="290" x2="318" y2="290" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><polygon points="410,225.0 500.0,290 410,355.0 320.0,290" fill="#ffffff" stroke="#A64B9C" stroke-width="2.5"/><text x="410.0" y="284.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#A64B9C">What</text><text x="410.0" y="310.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#A64B9C">is it?</text><path d="M500,290 C540,290 540,85 590,85" fill="none" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="594" y="40" width="200" height="90" rx="8" fill="#EEEAF6" stroke="#2B2F7E" stroke-width="2"/><text x="694.0" y="92.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F7E">Question</text><line x1="794" y1="85" x2="850" y2="85" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="854" y="40" width="420" height="90" rx="8" fill="#ffffff" stroke="#2B2F7E" stroke-width="2"/><text x="1064.0" y="91.7" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">Answer it. No card.</text><path d="M500,290 C540,290 540,215 590,215" fill="none" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="594" y="170" width="200" height="90" rx="8" fill="#EEEAF6" stroke="#2B2F7E" stroke-width="2"/><text x="694.0" y="222.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F7E">New work</text><line x1="794" y1="215" x2="850" y2="215" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="854" y="170" width="420" height="90" rx="8" fill="#ffffff" stroke="#2B2F7E" stroke-width="2"/><text x="1064.0" y="210.1" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">New card(s): WBS element, gate,</text><text x="1064.0" y="233.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">lead, entry and exit, size; owner approves</text><path d="M500,290 C540,290 540,345 590,345" fill="none" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="594" y="300" width="200" height="90" rx="8" fill="#EEEAF6" stroke="#2B2F7E" stroke-width="2"/><text x="694.0" y="339.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F7E">Change to</text><text x="694.0" y="364.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F7E">a baseline</text><line x1="794" y1="345" x2="850" y2="345" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="854" y="300" width="420" height="90" rx="8" fill="#ffffff" stroke="#2B2F7E" stroke-width="2"/><text x="1064.0" y="340.1" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">Change request: impact analysis,</text><text x="1064.0" y="363.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">the change board decides; then card(s)</text><path d="M500,290 C540,290 540,475 590,475" fill="none" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="594" y="430" width="200" height="90" rx="8" fill="#EEEAF6" stroke="#2B2F7E" stroke-width="2"/><text x="694.0" y="469.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F7E">Defect or</text><text x="694.0" y="494.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2F7E">nonconformance</text><line x1="794" y1="475" x2="850" y2="475" stroke="#6E6D8A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="854" y="430" width="420" height="90" rx="8" fill="#ffffff" stroke="#2B2F7E" stroke-width="2"/><text x="1064.0" y="470.1" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">Issue or NCR: disposition (fix, waive,</text><text x="1064.0" y="493.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#2B2F7E">change the requirement); then a card</text></svg>