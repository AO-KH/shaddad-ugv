        in the verification (DRV, Table 4)
      - >-
        2026-11-18: part 2, step 19: the 0.2 s persistence on both terms, as the design gives it, with the margin
        after it (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
