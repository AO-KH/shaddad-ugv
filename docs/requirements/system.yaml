  - id: REQ-SYS-128
    kind: performance
    function: F-05
    text: >-
      The robot shall develop at its sprockets a tractive force of at least 1.4 kN continuously at 1.0 m/s, and at
      least 1.7 kN for 30 s.
    rationale: >-
      N-08: the 20 deg design slope (REQ-SYS-089, -097; CR-001). The duty is 316 kg on 20 deg on farm soil (f
      0.107): 1372 N, and 1669 N with 0.8 m/s^2 and the reflected inertia (the drive engineer, step 9, TD-2; drive
      spec 2.1). Capability today: the 1 kW units give 2.54 kN continuous through the gears (a margin of 1.8), the
      750 W motors 1.91 kN (1.4) and about 1.72 kN at 45 deg C (1.2); both are limited by adhesion near 2.1 kN (mu
      0.7 [EST]).
    source: [N-08, CR-001, D95]
    parent: none
    allocation: [DRV, STR]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_drive testT03_climb and T4; S2; the sizing of drive spec 2.1
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the drive (P.drive.motor, P.drive.gear; drive spec 2.1, 2.2)
      note: >-
        The 1 kW default meets it by design (D95); the as-built 750 W motors meet it with less margin, 1.2 at 45 deg
        C. The motors' data are estimates until their datasheets (card G1-04).
    status: agreed
    cards: [G2-DRV, G1-04]
    history:
      - "2026-11-18: part 2, step 13: added from the drive engineer's TD-2 (step 9, Table 5)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-129
    kind: performance
    function: F-05
    text: >-
      The robot shall climb, descend, stop and park on longitudinal slopes of up to 20 deg with no implement or the
      mower (deck down) and of up to 18.5 deg with the full-tank sprayer (CR-001), on farm soil, dry sand, the
      greenhouse floor and concrete, and of up to 18 deg on wet loam.
    rationale: >-
      N-08: the slope envelope by soil (CR-001, D75). The traction limits are the structure engineer's (step 10,
      section 6; structure spec 2.11, descent step 2): on wet loam a 20 deg climb slips past 30 % above about 18
      deg. The tiller, a later phase (card G2-TIL), descends forward only: raised and facing uphill it tips backward
      at 16.4 deg static and 11.8 deg with the sharp-edge track end (the climbing torque lowers it further, not yet
      quantified) (structure spec 6.3).
    source: [N-08, CR-001, D75]
    parent: none
    allocation: [STR, DRV, MCU, GNC]
    safety: false
    tbd: none
    verification:
      method: Test
