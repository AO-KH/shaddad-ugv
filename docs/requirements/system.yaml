  - id: REQ-SYS-103
    function: F-09
    text: >-
      If its bus does not charge up when it switches on its high voltage, then the robot shall keep its pack
      disconnected from the bus, with at most 200 J into its precharge resistor over all its attempts (D98), and
      report a precharge fault.
    rationale: >-
      SG-10: closing the main contactor onto a shorted or failed bus would short the pack. REQ-SYS-055 covers the
      normal precharge; this one covers the failed one. D98 sets at most 200 J into the precharge resistor over the
      whole sequence of attempts; the time-out and the number of attempts are design values bounded by the energy:
      two attempts at 7.5 Ohm with the 0.2 s early short check (the BMS and power engineer, step 7). Margin: the
      twin's D98 design takes about 80 J per 0.2 s check, so two attempts (159 J) stay 20 % below the 200 J, and
      three would need a check of about 0.17 s. It is safe because K1 stays open, so the pack never closes onto a
      short (SG-10), and the energy limit keeps the resistor from overheating. Provisional (D96).
    source: [N-12, N-13, SG-10, D96, D98]
    parent: SG-10
    allocation: [BMS, PWR]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_power_plant precharge_fail_T03b (a shorted bus: K1 never closes, three attempts, then FAULT with the
        precharge-fail bit), judged on the energy over the whole sequence (D98) on card G2-PWR (today 200 J per
        attempt); t_pack_bms mode_manager_table
      campaign: simulation
    as_built:
      state: partly
      where: >-
        BMS PRECHARGE to PRE_FAIL after t_pre_max, three attempts, then FAULT with Fault_PrechargeFail (power spec
        4.1; subsystems/power/bms_mode_manager.m)
      note: >-
        The tests pass on the twin's BMS. The robot's BMS, contactors and precharge circuit are not in the as-built
        record (R-15, card G1-04); the delivered BMS is the baseline, provisionally (D96). Decided, pending: the
        twin's sequence changes to D98's design on card G2-PWR (today 22 Ohm, 1.5 s and three attempts, about 580 J
        over the sequence; T-PWR-03b checks 200 J per attempt only).
    status: agreed
    cards: [G1-04, G2-PWR]
    history:
      - "2026-11-17: added in step 9 from the BMS and power engineer's P6-1 (step 6)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the energy limit of 200 J over the attempts (BMS, section 3; D98)"
      - >-
        2026-11-18: part 2, step 19: T-PWR-03b judged on the energy over the sequence, pending on card G2-PWR, and
        the state partly (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-104
    function: F-09
    text: >-
      When it runs a greenhouse or palm-grove mowing mission of phase 2, the robot shall complete the mission within
      the energy of one charge, from SOC 0.95, ending with an SOC of at least 0.275 at the pack's end of life (SOH
      0.80): the 0.20 reserve plus 10 % of the usable window (D101).
    rationale: >-
      N-02 and charter goal 4: finish a mowing mission on one charge. D101 sets the energy requirement per implement
      and phase in place of a fixed shift (it supersedes D45 and D46): each greenhouse and palm-grove mowing mission
      of phase 2 ends at SOC 0.275 or above at end of life, from 0.95, which is the 0.20 reserve plus 10 % of the
      0.75 usable window, the 1592 Wh stored in that window at end of life, about 1544 Wh at the pack terminals with
      the discharge efficiency of 0.97 (P.power.pack.E_Wh 2948.4 Wh, P.power.budget.soh_eol 0.8, eta_dis 0.97,
      params/param_power.m:45, 259-263; the BMS and power engineer, step 7; the pack's energy is REQ-SYS-136). D101
      notes 3.7 to 4.3 kWh for 3 h of palm mowing, so a mission at end of life lasts about 1.1 to 1.25 h, which the
      planner sizes its missions to (card G2-GNC). The return on a low charge is REQ-SYS-056 and -057. Not a safety
      value.
    source: [N-02, D101]
    parent: none
    allocation: [GNC, BMS, PWR, DRV]
    safety: false
    tbd: >-
      the energy per hour of each design mission, from a phase-2 mowing energy run after D94 and D95 (D101); owner
      the BMS and power engineer with the GNC engineer; by G1-05 (a RID)
    verification:
      method: Analysis
      level: system
      reference: >-
        planned: card G1-02 (the energy budget of the design missions, with the row-test energy, R-19); S3 once it
        runs (R-20)
      campaign: simulation
    as_built:
      state: unknown
      where: >-
        the pack's capacity and the BMS's SOC (power spec 2.9); the GNC's energy per metre (gnc spec 2.8)
      note: >-
        No analysis or scenario shows a full mission on one charge: the GNC's energy per metre and the row-test
        energy disagree, and the end SOC at end of life is about 0.19 (R-19); S3 has never run (R-20). D101 sets the
        margin per mission in place of the shift; the energy per hour of each design mission comes from a phase-2
        mowing energy run (the TBD), and P.power.budget is still the sprayer's 3 h shift, which card G2-PWR
        replaces.
    status: agreed
    cards: [G1-02, G2-PWR]
    history:
      - "2026-11-17: added in step 9 for N-02 (the independent reviewer's RID-G1F-07)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the charge margin and the design missions of D101 (BMS, section 3); the step-12 draft on
        the mission energy merged here, with its TBD on the energy per hour
      - >-
        2026-11-18: part 2, step 19: about 1544 Wh at the pack terminals, 1592 Wh stored in the window (re-check
        14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
