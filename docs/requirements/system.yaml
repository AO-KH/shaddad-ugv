      world_scn_greenhouse and param_world.m (structure spec 6.9), estimates until a site survey. The 0.15 m
      irrigation berms of the palm basins and the 0.25 m greenhouse beds (D54) are higher than the 0.12 m ground
      clearance (REQ-SYS-156), so the missions keep the robot off them (REQ-SYS-207).
