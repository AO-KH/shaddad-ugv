      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the protective zone of REQ-SYS-046 (FSE, Table 1)"
      - >-
        2026-11-18: part 2, step 19: the zone of REQ-SYS-046 on the one stop model (re-check 14b; the lead systems engineer's ruling
        5a); GNC and MCU removed (the lead systems engineer's ruling 1 of step 19)
      - >-
        2026-11-18: part 2, step 19c: the 0.35 s to the start of the blade stop bound in the text, today's 0.40 s
        chain pending on card G2-FSC (the lead systems engineer's point 8); one zone for both modes (point 6)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
