  # ---- F-02 Drive by remote control ----
  - id: REQ-SYS-008
    function: F-02
    text: >-
      While in RC driving, the robot shall command its tracks only as the operator's sticks command, within 65 ms of
      the sticks at the ESC speed reference (D37): in their direction, and with no more speed or turn rate than they
      command beyond an overshoot of 5 % of the commanded speed, a steady error of 0.03 m/s and 10 % of the
      commanded turn rate.
    rationale: >-
      SG-11: in RC driving the robot moves only as the operator commands. The safety content is the bound; how
      closely the robot tracks the sticks is the performance requirement REQ-SYS-120. The tracking tolerance is S1's
      (architecture section 12: overshoot at most 5 %, steady error at most 0.03 m/s, yaw rate within 10 % after 2
      s) and the latency D37's 65 ms (a budget of 38 to 62 ms) (the MCU firmware engineer, step 4). Margin: the
      bound applies to the references that the MCU commands to the tracks, as in REQ-SYS-012, and D37's 65 ms is
      measured to the ESC speed reference; the closest trip is D74's descent trip at 1.44 m/s at every pitch, level
      ground included (the top-speed entry of 1.41 m/s plus dv_top 0.03 m/s), 0.04 m/s above the 1.40 m/s RC limit,
      so a reference more than about 3 % over the limit parks the robot; the 1.70 m/s overspeed trip and the
      speed-follow trip at 0.2 m/s above the command (REQ-SYS-109) follow; 65 ms is 9 cm of travel at 1.40 m/s,
      which the stop distance of REQ-SYS-009 includes. It is safe because a motion beyond the tolerance meets the
      trips before it can grow.
    source: [N-04, SG-11, D37]
    parent: SG-11
    allocation: [MCU, COM, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S1 (speed rise, overshoot, steady error, yaw rate); t_mcu_control testTEL24_ThrottleAndLatency,
        testTEL25_PivotAndMixer; t_drive testT01_ramp, testT22_stopProfile (the drive's part)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        RC link (subsystems/rc); MCU SBUS decode, RC mapping, shaper and mixer (electronics spec 2.6, 2.7.2 to
        2.7.6)
      note: >-
        S1 passes. The RC chain is not safety-rated (PL b at most, card G2-FSC); the robot's RC transmitter and
        receiver are not in the as-built record (card G1-04); the results are for the 1 kW default (D95); the 750 W
        option is selectable, and every result records its motor.
    status: agreed
    cards: [G1-04, G2-FSC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: the bound of SG-11 in place of the tracking, with the tolerance as a part-2 value
        (FSE-22, RID-G1F-02)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the tracking tolerance and the 65 ms latency (MCU, Table 1)"
      - "2026-11-18: part 2: the D95 wording of the note and the drive tests in the verification (DRV, Table 4)"
      - >-
        2026-11-18: part 2, step 19: the bound on the commanded references, D37's 65 ms to the ESC speed reference,
        the overshoot and the steady error as two tolerances, and the closest trip of 1.44 m/s in the margin
        (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-009
    function: F-02
    text: >-
      When the operator lets go of the sticks, the robot shall come to a stop within 0.95 m from 1.2 m/s
      (architecture section 12, S1), and within 1.25 m from its RC speed limit of 1.40 m/s.
    rationale: >-
      SG-11: the robot stops when the operator lets go. S1's limit is 0.95 m from 1.2 m/s (architecture section 12);
      D33's replay gave 0.88 m, 60 ms of latency included. RC driving runs up to the RC speed limit (REQ-SYS-010),
      above 1.2 m/s, so the stop from that speed needs its own distance. The stop distance from the RC speed limit
      is 1.25 m: a replay of the MANUAL shaper law (electronics spec 2.7.5: K_v 4, a_dec_man 1.2 m/s^2, j_max 5
      m/s^3; the ESC's first order of 40 ms; 60 ms of latency) reproduces D33's 0.88 m from 1.2 m/s and gives 1.14 m
      from 1.40 m/s (the MCU firmware engineer, step 4). Margin: 0.11 m (9 %) over the replay, as S1's own margin at
      1.2 m/s (0.95 m against 0.88 m), on level ground; on a descent the cap and its stop-go parks govern (D74). It
      is safe because the replay of the documented law reproduces the stop that S1 measures.
    source: [N-04, SG-11, D33]
    parent: SG-11
    allocation: [MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S1 (the stop distance after the throttle release from 1.2 m/s); planned: card G1-02 for the stop from the RC
        speed limit (S1 or a bench run at 1.40 m/s, to confirm the replay's 1.14 m)
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        MCU reference shaper, the MANUAL deceleration (electronics spec 2.7.5; D33)
      note: >-
        S1 passes. On a descent with a pack that cannot take charge, the stop rests on the descent cap and its
        stop-go parks (D74).
    status: agreed
    cards: []
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: 0.95 m cited from S1's limit in architecture section 12; the stop from the RC speed
        limit added (RID-G1F-08, FSE-23)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the stop distance of 1.25 m from 1.40 m/s (MCU, Table 1)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-010
    function: F-02
    text: >-
      While in RC driving, the robot shall keep its speed within the RC speed limit of 1.40 m/s.
    rationale: >-
      SG-11 asks for the speed limit of RC driving. The RC speed limit is 1.40 m/s (P.electronics.lim.v_max_man,
      params/param_electronics.m:41; the MCU firmware engineer, step 4). Margin: the closest trip is D74's descent
      trip at 1.44 m/s at every pitch, level ground included (the top-speed entry of 1.41 m/s plus dv_top 0.03 m/s),
      0.04 m/s above the limit, so a speed more than about 3 % over the limit latches OVERSPEED and parks the robot;
      the overspeed trip at 1.70 m/s is 0.30 m/s above it, the speed-follow trip 0.2 m/s above the command, and the
      stop from it takes 1.25 m (REQ-SYS-009). It is safe because the stop from the limit stays within the RC stop
      distance.
    source: [N-04, SG-11]
    parent: SG-11
    allocation: [MCU]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S1; t_mcu_control testTEL24_ThrottleAndLatency
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        MCU speed limits and reference shaper (electronics spec 2.7.5)
      note: >-
        At full stick on the 20 deg ramp the top-speed trip fires at the slope entry: a safe but nuisance park
        (STATUS 29, card G2-MCU). The top-speed trip is at 1.44 m/s at every pitch, level ground included (D74).
    status: agreed
    cards: [G2-MCU]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the RC speed limit of 1.40 m/s (MCU, Table 1)"
      - "2026-11-18: part 2, step 19: the closest trip, D74's 1.44 m/s, in the margin and the note (re-check 14b)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-011
    function: F-02
    text: >-
      The robot shall take the operator's mode, arm, reset, remote-stop and mission commands only from valid RC
      frames from the operator's transmitter, never from its receiver's failsafe output.
    rationale: >-
      A receiver failsafe or a lost frame must not arm, reset, stop or start the robot as if the operator had (D34,
      SG-08). D84 makes it matter for the mission commands too: a move-off after a person stop must be the
      operator's.
    source: [N-04, N-11, SG-08, D34]
    parent: SG-08
    allocation: [MCU, COM]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL26_Failsafe; t_mcu_platform testRemoteEstopValidFramesOnly (the remote stop); t_rc_link
        failsafe_modes
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU RC mapping and the REMOTE_ESTOP evaluation (D34; electronics spec 2.7.2)
      note: >-
        The remote stop is taken only from valid frames (D34). Arm, reset and the mission commands (START and PAUSE
        on CH13, RTH on CH14) are not: with another failsafe preset on the mode switch, the robot can re-enter
        manual by itself after a link loss, and a preset can send a start, a pause or a return to the dock (R-35,
        card G2-MCU). One corrupted frame that passes the checks can also give a reset or return-home edge, as the
        2-position switches have no debounce (REQ-SYS-115; finding F1, card G2-MCU).
    status: agreed
    cards: [G2-MCU]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: the mission commands, and never from the receiver's failsafe output (MCU-7, FSE-20)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
