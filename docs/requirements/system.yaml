  - id: REQ-SYS-041
    function: F-07
    text: >-
      If an obstacle hold lasts longer than the hold limit of 120 s, then the robot shall pause the mission and
      alert the operator.
    rationale: >-
      N-05: the operator must learn of a hold that the robot cannot clear by itself. The hold limit is 120 s
      (P.gnc.obs.t_hold_max, params/param_gnc.m:104; T11's hold_timeout check; the GNC engineer, step 5). With D99
      the mower never bypasses, so a blocked lane in a greenhouse waits 120 s before the alert; a shorter limit is
      the owner's choice.
