  # ---- technical requirements: environment ----
  - id: REQ-SYS-162
    kind: environment
    function: F-09
    text: >-
      While it works at 45 deg C ambient in full sun, the robot shall keep its hottest cell at or below 55 deg C.
    rationale: >-
      N-13: the pack's label limits it to 55 deg C, the supplier's limit (D94), and S3 checks T_cell_max at most
      328.15 K at 45 deg C (architecture section 12). The BMS cut-off above it stays the safety function (SF-17,
      D94), so this limit is a working one.
    source: [N-13, D94]
    parent: none
    allocation: [PWR, BMS]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S3 (architecture section 12)
      campaign: simulation
    as_built:
      state: unknown
      where: >-
        the pack thermal model (power spec 2.3)
      note: >-
        No S3 run on the sealed default pack of D94 is on file; the sealed run of 2026-11-15 charged in full sun at
        45 deg C. The power spec's hand check of the sealed pack in full sun settles the box about 12 K above
        ambient, near 57 deg C at 45 deg C, above the 55 deg C: a known risk. The interim measure is the operating
        rule that the project owner adopted on 2026-11-18 (step 22), beside D94's charging procedure: in full sun,
        one mission from a cool start, then park in the shade, until the S3 run on the sealed pack (G2-INT). A sun
        shield is raised only if the run confirms the shortfall (the lead systems engineer's point 5; cards G2-PWR,
        G2-INT).
    status: agreed
    cards: [G2-PWR, G2-INT]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-138"
      - "2026-11-18: part 2, step 19: the hand check's predicted shortfall in the note (re-check 14b)"
      - >-
        2026-11-18: part 2, step 19c: the operating rule as the interim measure, for the owner at step 22 (the
        lead systems engineer's point 5)
      - "2026-11-18: part 2, step 22: the full-sun operating rule in the note (D112, adopted by the project owner)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-163
    kind: environment
    function: F-09
    text: >-
      While it is stored with its key switch off, the robot shall keep every cell at or above 3.0 V for at least 90
      days from a storage charge of 40 to 60 %, in the shade (D94, D105).
    rationale: >-
      SG-10 and N-13: the pack stays safe in storage, as a cell drawn deep below its cut-off can short on recharge
      (the BMS and power engineer, step 7, T7-8). D105 sets the values: every cell at or above 3.0 V for at least 90
      days from a storage charge of 40 to 60 %, in the shade (D94). Margin: 3.0 V is 0.5 V above the cells' 2.50 V
      absolute minimum. It is safe with D105's fallback until the bought BMS's sleep draw is shown to meet the value
      (card G1-04): storage beyond 30 days with the main connector (SB120) unplugged and a monthly check. The twin's
      2 W BMS supply, drawn upstream of K1, would empty a pack stored at half charge in about 31 days; a draw of 0.5
      W or less would give about 110 days to 3.0 V from 0.5.
    source: [N-13, SG-10, D94, D105]
    parent: SG-10
    allocation: [BMS, PWR]
    safety: true
    tbd: none
    verification:
      method: Analysis
      level: system
      reference: >-
        the storage draw against the energy from SOC 0.4 to 3.0 V per cell; the inspection of the storage procedure
        (D105, with the charging procedure of D94; card G2-PWR)
      campaign: simulation
    as_built:
      state: unknown
      where: >-
        the bought BMS's sleep draw and the storage procedure
      note: >-
        The bought BMS's draw is not recorded (card G1-04), and the twin's 2 W draw would not meet the value (about
        31 days from half charge). Until the draw is shown, D105's fallback applies: the main connector (SB120)
        unplugged for storage beyond 30 days, with a monthly check (the storage procedure, card G2-PWR).
    status: agreed
    cards: [G1-04, G2-PWR]
    history:
      - >-
        2026-11-18: part 2, step 13: added from the BMS and power engineer's T7-8 (step 7, section 6), with the
        values of D105
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-164
    kind: environment
    function: none
    text: >-
      The robot shall work in ambient temperatures from its lower ambient limit up to 45 deg C, and
      up to 50 deg C in its hot case, in full sun of 1000 W/m^2.
    rationale: >-
      N-13: the sites are in the Al-Kharj summer, 29 to 47 deg C over the day ((E3) of the integration spec). The
      design ambient is 45 deg C (P.world.env.T_amb = 318.15 K, params/param_world.m:41) with a hot case of 50 deg C
      (P.scen.T_amb_hot = 323.15 K) and full sun (P.world.env.G_solar = 1000 W/m^2), as S3 runs them (architecture
      section 12). The structure engineer's ambient (step 10, section 6: up to the 45 deg C design ambient with 1000
      W/m^2, and the twin's daily range of 302 to 320 K) lies within this one; the hot case of 50 deg C, which the
      electronics and the drive proposals use (REQ-SYS-165, REQ-SYS-166), is kept as the stricter.
    source: [N-13]
    parent: none
    allocation: [PWR, BMS, ELC, DRV]
    safety: false
    tbd: >-
      [TBD] the lower ambient limit (the row test runs down to -10 deg C); owner the drive engineer, with
      the BMS and power engineer for the pack; by G1-05 (a RID)
    verification:
      method: Test
      level: system
      reference: >-
        S3 at 45 deg C and its hot case at 50 deg C (architecture section 12); the thermal benches of the power and
        drive specs
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the thermal models of the pack, the drive and the enclosure (power spec 2.3, drive spec 2.6, electronics
        spec 2.9.4)
      note: >-
        The twin models the heat. S3 has not run on the current robot with the sealed pack of D94. The lower ambient
        limit is the drive engineer's TBD (step 9, open point 3). The power spec's hand check of the sealed pack in
        full sun gives about 62 deg C at the 50 deg C hot case, above the BMS's over-temperature cut of 60 deg C
        (P.power.bms.T_ot): a known risk. The interim measure is the operating rule that the project owner adopted
        on 2026-11-18 (step 22), as for REQ-SYS-162: in full sun, one mission from a cool start, then park in the
        shade, until the S3 run on the sealed pack (G2-INT). The rule is the lead systems engineer's point 5 (cards
        G2-PWR, G2-INT).
    status: agreed
    cards: [G2-INT, G2-PWR]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-137; the lower ambient limit added as a non-safety TBD
        (the drive engineer, step 9, open point 3), and the structure engineer's ambient merged (step 10, section 6)
      - "2026-11-18: part 2, step 19: the hand check's predicted shortfall in the note (re-check 14b)"
      - "2026-11-18: part 2, step 19c: the operating rule as the interim measure (the lead systems engineer's point 5)"
      - "2026-11-18: part 2, step 22: the full-sun operating rule in the note (D112, adopted by the project owner)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-165
    kind: environment
    function: none
    text: >-
      The robot shall keep its electronics working with no thermal stop at an ambient temperature of up to 50 deg C
      with 1000 W/m^2 of sun on the enclosure, through a whole mowing mission.
    rationale: >-
      N-13: the hot case of REQ-SYS-164 (the electronics and comms engineer, step 8, TR-5):
      P.power.thermal.T_amb_max 323.15 K; T-EL-17. The twin gives 55.3 deg C of box air with the fans, against the
      80 deg C stop of REQ-SYS-114 (P.electronics.safety.T_encl_crit), 24.7 K below it, and 71.3 deg C with the fans
      failed; on the stricter plain-box reading 56.5 deg C and 76 deg C, 4 K below the stop (electronics spec 2.9.4;
      the box's area is settled on card G2-VAL with the robot's box from G1-04).
    source: [N-13]
    parent: none
    allocation: [ELC]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        T-EL-17 (the enclosure at 50 deg C and 1000 W/m^2); the robot's box tested on cards G1-04 and G2-VAL
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the development target's enclosure model (electronics spec 2.9.4)
      note: >-
        Shown in the twin for the development target's box (D96); the robot's box is to test (cards G1-04, G2-VAL).
        With a typical 55 deg C safety relay in the box, REQ-SYS-165, -114 and -205 cannot all hold (about -0.3 K on
        the twin's box air, -1.5 K on the plain-box reading): an open safety value for the owner, decided on card
        G1-04 once the delivered relay's rating and place are known; the lead systems engineer recommends parts rated for the 80 deg
        C stop or the relay and the STO interface placed outside the box, as both keep the mission in the heat (the
        lead systems engineer's point 1).
    status: agreed
    cards: [G1-04, G2-VAL]
    history:
      - "2026-11-18: part 2, step 13: added from the electronics and comms engineer's TR-5 (step 8, section 6)"
      - >-
        2026-11-18: part 2, step 19c: the plain-box figures (the lead systems engineer's point 13) and the open mark for the owner
        (point 1)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-166
    kind: environment
    function: none
    text: >-
      The robot shall deliver the continuous tractive force of REQ-SYS-128 in ambient air of up to 50 deg C in full
      sun with its motor windings at or below 140 deg C and its ESC heat sinks at or below 85 deg C.
    rationale: >-
      N-13: the drive in the hot case (the drive engineer, step 9, TD-4): P.power.thermal.T_amb_max 323.15 K,
      P.drive.thermal.dT_solar 10 K, and the derating starts P.drive.esc.T_mot_derate and T_esc_derate
      (params/param_drive.m:79-80), on class-H windings. Estimated at the rated point at 50 deg C plus 10 K of sun:
      the winding at 120 deg C and the ESC at about 64 deg C with the 1 kW unit, and the winding at 114 deg C with
      the 750 W motor.
    source: [N-13, D95]
    parent: none
    allocation: [DRV]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_drive T5 re-baselined at the motors' rating (card G2-DRV, R-57); the hot row test (up to 55 deg C)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the drive's thermal network (drive spec 2.6)
      note: >-
        T5 has not run at the right rating (R-57, card G2-DRV). The as-built record's 2.15 N m at 45 deg C for the
        750 W motor disagrees with the thermal model, which keeps a 109 deg C winding at 2.39 N m (the drive
        engineer's open point 4), until the Movematic datasheet arrives (card G1-04).
    status: agreed
    cards: [G2-DRV, G1-04]
    history:
      - "2026-11-18: part 2, step 13: added from the drive engineer's TD-4 (step 9, Table 5)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-167
    kind: environment
    function: none
    text: >-
      The robot shall drive, turn and mow on farm soil, dry sand, wet loam, a compacted greenhouse floor and dry
      concrete or asphalt, with a peak traction of 0.50 to 0.90 and a rolling resistance of 0.035 to 0.12 [EST].
    rationale: >-
      N-01 and N-08: the soils of the sites (the soil table of the structure spec 6.6, P.world.soilTable,
      params/param_world.m): dry sand, farm soil (sandy loam, the default), wet or irrigated loam in the palm
      basins, the greenhouse floor, and the concrete or asphalt paths. The traction and the rolling resistance are
      the soil table's (P.world.soilTable, params/param_world.m:48-54; Wong), estimates that card T-04 calibrates
      (the structure engineer, step 10, section 6).
    source: [N-01, N-08]
    parent: none
    allocation: [STR, DRV]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        the structure benches per soil; S7 on wet loam (architecture section 12); the field turning test (card
        G2-VAL); T4 per soil; card T-04 on the robot
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the track-soil contact (P.structure.contact, P.world.soilTable; structure spec 6.4 to 6.6)
      note: >-
        The twin models the five soils; the turning model is checked against Wong's theory on farm soil only, with a
        known gap (T10, D100), until the field turning test.
    status: agreed
    cards: [G2-STR, G2-VAL]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-139 and merged with the structure engineer's soils
        (step 10, section 6): the traction and the rolling resistance
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-168
