  - id: REQ-SYS-087
    function: F-13
    text: >-
      When it plans a greenhouse mission, the robot shall place its lanes so that its body and its implement keep at
      least 0.275 m from the post lines (D106).
    rationale: >-
      The clearance keeps the body and the implement off the posts and walls, with room for the cross-track error,
      while the robot covers the floor (D54); a planning measure for HAZ-004 and HAZ-009 (SG-01). D106 widens the
      inset to 0.50 m, so that the deck keeps about 0.125 m of clearance at D100's tracking maximum of 0.15 m: the
      body and the implement are planned at least 0.275 m from the post lines, 0.475 m from the wall line (the GNC
      engineer, step 5b, section 4). The unmowed strip along each wall is 0.10 m wider than with the 0.40 m inset,
      and D106 replaces D54's 0.45 m. Not a safety value.
    source: [N-01, SG-01, D54, D106]
    parent: none
    allocation: [CMP]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S4 (coverage of at least 95 % of the inset floor; the clearance judged during the run with the deck (D87,
        D100): at least 0.125 m to the posts, D106's margin at D100's 0.15 m tracking maximum, in place of today's
        0.15 m, on card G2-INT); t_gnc_tracking testCompilerGreenhouse (the planned body and deck at least 0.275 m
        from the post lines, in place of today's cov.clear_min 0.15 m, on card G2-GNC)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        gnc_compileMission: the inset c_in = 0.20 + 0.15 + 0.05 + max(0, W/2 - w_tool/2) (gnc spec 2.7; D54), and
        the validation of the footprint with the fitted implement against cov.clear_min 0.15 m
      note: >-
        testCompilerGreenhouse passes. With today's parameters (W 0.78 m, the mower's swath 1.00 m) the inset is
        0.40 m, not D54's 0.45 m (scripts/gnc_compileMission.m:132; params/param_gnc.m:148, param_structure.m:30 and
        :65). S4's own clearance of 0.259 m excludes the mower deck, which reaches beyond the body (R-06). Decided,
        pending: D106's inset of 0.50 m (gh_c_xte 0.15 m) puts the deck 0.275 m from the post envelope, about 0.125
        m at the 0.15 m tracking maximum; the twin's compiler changes on card G2-GNC (today 0.40 m, with the deck
        0.175 m from the posts).
    status: agreed
    cards: [G2-GNC, G2-INT]
    history:
