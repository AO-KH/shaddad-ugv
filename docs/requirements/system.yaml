        engineer's finding 2), so D95's upgrade may need new ESCs; the ratings are on the supplier request (card
        G1-04).
    status: agreed
    cards: [G1-04, G2-DRV]
    history:
      - "2026-11-18: part 2, step 13: added from the drive engineer's TD-6b (step 9, Table 5)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-161
    kind: physical
    function: none
    text: >-
      The robot shall have gearboxes that each carry at their output at least 120 N m continuously, 180 N m in
      acceleration and 240 N m in an emergency stop.
    rationale: >-
      N-08 and D95: D51's rule, the gearbox's T2B at least the motor's peak through the gear (172 N m with the 1 kW
      unit) (the drive engineer, step 9, TD-6). T23 measures 343 N m per side, carried by the two gearboxes of a
      side.
    source: [N-08, D51, D95]
