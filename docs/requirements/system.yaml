  - id: REQ-SYS-138
    kind: performance
    function: F-10
    text: >-
      When it charges from its 0.20 reserve, the robot shall reach the full level of REQ-SYS-059 within 3.5 h,
      inside the charge window of REQ-SYS-060.
    rationale: >-
      N-02 and N-03: a pack charged overnight from the reserve (D94, D97). 50.4 Ah at the charger's 20 A is 2.5 h of
      CC plus about 0.4 h of CV, about 3 h, with about 20 % margin (P.power.charger.I_max, P.power.pack.Q_Ah) (the
      BMS and power engineer, step 7, T7-6); provisional under D96, since the charger's own CV end is unknown.
    source: [N-02, N-03, D94, D96, D97]
    parent: none
    allocation: [PWR, BMS]
    safety: false
    tbd: none
