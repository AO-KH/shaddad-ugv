  - id: REQ-SYS-179
    kind: interface
    function: F-12
    text: >-
      The robot shall show the operator on its console its mode, its mission state and progress, the reason of each
      hold or pause, its active faults, its charge and the alert of D93, refreshed at least every 0.5 s.
    rationale: >-
      N-05: the operator answers the robot's holds and faults (charter section 5). The content is that of
      REQ-SYS-082, -085 and -105, and the refresh a design target of 0.5 s, 2.5 times the GNC status period of 0.2 s
      (Bus_GncStatus; P.gnc.Ts_status, params/param_gnc.m:17), with MCU_STATUS every 50 ms (ICD section 5) (the
      electronics and comms engineer, step 8, TR-4). The draft of step 12 asked for 0.2 s, the status period itself;
      the owner's 0.5 s is taken.
    source: [N-05, D93]
    parent: none
    allocation: [COM, GNC, MCU]
