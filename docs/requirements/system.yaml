      where: >-
        the greenhouse world (P.world, world 4) and the site's survey
      note: >-
        The S4 house's headland is not checked yet (cards G2-GNC and G2-INT).
    status: agreed
    cards: [G2-GNC, G2-INT]
    history:
      - "2026-11-18: part 2, step 13: added from the GNC engineer's TR-G6 (step 5, Table 6)"
      - "2026-11-18: part 2, step 19c: the headland restated on the 1.1 m turn clearance (the lead systems engineer's point 29)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
