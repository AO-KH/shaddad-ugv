  - id: REQ-SYS-139
    kind: performance
    function: F-11
    text: >-
      When the operator presses an E-stop button on the robot while it drives at 1.2 m/s on flat farm soil, the
      robot shall come to rest within 0.6 m.
    rationale: >-
      SG-06 and N-06: the E-stop removes the traction torque (STO) and engages the spring brakes (stop category 0,
      D86). The bound is S8a's (architecture section 12). Margin: S8a stops in 0.20 m (2026-11-15), a third of the
      bound, which leaves room for the robot's own STO and brake times, still unknown (REQ-SYS-063, card G1-04). It
      is safe because the stop starts within REQ-SYS-063's 50 ms of the button and needs no software.
    source: [N-06, SG-06, D86]
    parent: SG-06
    allocation: [PWR, DRV, ELC]
