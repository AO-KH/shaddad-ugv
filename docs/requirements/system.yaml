    rationale: >-
      N-02 and D101: the energy that the mission of REQ-SYS-104 uses: 2948.4 Wh x 0.80 x 0.675 = 1592 Wh stored in
      the window, 1544 Wh at the terminals with the discharge efficiency of 0.97 (P.power.pack.E_Wh 2948.4 Wh,
      P.power.budget.soh_eol 0.8, eta_dis 0.97, params/param_power.m:45, 259-263) (the BMS and power engineer, step
      7, T7-5; the register's re-check, step 14b, found the former 1590 Wh below the 1592 Wh it served, and the 1592
      Wh stored rather than delivered).
