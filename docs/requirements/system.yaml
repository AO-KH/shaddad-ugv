      - "2026-11-18: part 2, step 19c: the tiller's 11.8 deg with the sharp-edge track end (the lead systems engineer's point 30)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-130
    kind: performance
    function: F-05
    text: >-
      The robot shall traverse and park on cross-slopes of up to 15 deg on farm soil with any implement, without
      sliding more than 0.1 m in a turn of 2 m radius, and creeping no more than 0.02 m in 600 s when parked.
    rationale: >-
      N-08: the cross-slope part of the envelope (the structure engineer, step 10, section 6). The GNC's roll
      governor limits the speed to 0.3 m/s at 15 deg and to 0 at 18 deg; T7b slides 0.000 m at 15 deg (a margin of
      0.25) and T8 drifts 0.08 mm on the side slope. The parked drift takes REQ-SYS-145's bound. T7b cannot fail
      (R-54), so the 0.1 m slide is verified by a test that can fail: R-54's fix, or T11 automated (card T-04).
    source: [N-08]
    parent: none
    allocation: [STR, GNC, DRV]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_structure T7b_turn_on_slopes (it cannot fail, R-54: its fix or T11 automated on card T-04), T8_parking
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the roll governor (gnc spec 2.5) and the track-soil contact (structure spec 2.11)
      note: >-
        T7b and T8 pass in the twin; T7b cannot fail (R-54), and the contact data are estimates until the slope
        brake test (T-04). Decided, pending: a slide test that can fail (R-54, T11; card T-04).
    status: agreed
