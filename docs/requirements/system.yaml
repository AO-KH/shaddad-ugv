  - id: REQ-SYS-029
    function: F-05
    text: >-
      While it runs autonomously, the robot shall keep its speed within the autonomous speed limit of 1.2 m/s.
    rationale: >-
      SG-01 asks the robot to keep its speed within what its detection zone can stop; the limit of the mode is the
      top of that envelope (D43). The autonomous speed limit is 1.2 m/s (P.electronics.lim.v_max_auto,
      params/param_electronics.m:41; P.gnc.spd.v_max = min(2.0, v_max_auto), params/param_gnc.m:31; the GNC
      engineer, step 5, checked by the MCU firmware engineer). The stop model (the lead systems engineer's ruling 5a of step 19),
      which every margin on the robot's stop from a speed uses (REQ-SYS-035, -046, -058, -068, -098, -131 and -132
      cite it): from a person entering the protective field, REQ-SYS-132's detection time of 0.25 s, one GNC step of
      0.05 s and about 0.06 s from the GNC to the ESC (D41), 0.36 s at the speed held; then the stop that the robot
      makes, by a replay of the MCU's shaper law with the ESC's 40 ms lag (electronics spec 2.7.5): the AUTO stop
      when the MCU's target steps to zero (P.electronics.shaper.a_dec_auto 1.0 m/s^2, j_max 5 m/s^3, K_v 4 1/s)
      takes 0.90 m from 1.2 m/s, 0.65 m from 1.0 m/s, 0.22 m from 0.5 m/s and 0.07 m from 0.2 m/s, at rest within
      1.9 s, and a controlled stop (D33's law, a_ctrlstop 1.0 m/s^2, j_stop 10 m/s^3) 0.81 m from 1.2 m/s and 1.09 m
      from 1.40 m/s. The GNC's own check (d_stop_req, gnc spec 2.5) uses t_lat 0.35 s and an ideal stop, 1.14 m from
      1.2 m/s. Margin: from 1.2 m/s the stop ends 0.43 + 0.90 = 1.33 m beyond the implement's front, against the
      protective field's 0.5 + 0.8 x 1.2 = 1.46 m (D72). It is safe because the stop ends 0.13 m inside the zone
      that the robot can see.
    source: [N-07, SG-01, D43]
    parent: SG-01
    allocation: [GNC, MCU]
    safety: true
    tbd: none
    verification:
      method: Test
