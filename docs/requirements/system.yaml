      the height of 570 mm [DATA], the body length of 1.00 m [EST]). The greenhouse plan places its lanes from this
      width (c_in = 0.40 m today, 0.50 m by D106, pending on card G2-GNC; REQ-SYS-087), and the collision footprint
      is the same box (P.structure.geom.L_overall, W_overall, H_body, params/param_structure.m:30). With the
      implements (the structure engineer, step 10, section 6; the implement boxes, S.impl): 1.70 m long and 1.05 m
      wide with the mower, 1.63 m long with the tiller; the sensor mast is 1.05 m [EST].
