  # ---- F-04 Know where the robot is ----
  - id: REQ-SYS-020
    function: F-04
    text: >-
      While it runs a mission, the robot shall keep the error of its position estimate within the accuracy of its
      kind of path: across the path at most 0.045 m RMS and 0.10 m in a greenhouse or 0.15 m in the open; along it
      at most 0.10 m RMS and 0.25 m; at most 0.25 m at the end of a GNSS outage of the outage time, and within the
      open-field values again 5 s after the RTK fix returns; and in the dock approach at most 0.03 m RMS and 0.08 m
      across the path.
    rationale: >-
      N-09 and SG-03: the robot must know where it is to stay in its zone and near its path. Part 2 sets the
      accuracy as one error budget with REQ-SYS-021, -022, -026 and -027: the sensors and navigation engineer's
      values (step 6, Table 1) with the guidance shares of the GNC engineer's combined budget (step 5b, Table 1), by
      the lead systems engineer's ruling 8 (ruling 9, rows on a slope, withdrawn by the lead systems engineer's ruling 4 of step 19). The across RMS
      is 0.045 m, so that with the 0.02 m guidance RMS the true cross-track RMS is sqrt(0.02^2 + 0.045^2) = 0.049 m,
      within REQ-SYS-027's 0.05 m; rows on a slope meet the row value: T-NAV-11's horizontal RMS is 0.039 m
      (2026-11-08; its 0.049 m is the 3-D RMS, the vertical error included), so the true cross-track RMS there is
      sqrt(0.02^2 + 0.039^2) = 0.044 m. Margin: the measured errors sit below the values: T-NAV-07 0.022 m RMS and
      0.065 m at most (2026-11-14), T-NAV-04 0.023 m and 0.104 m (2026-11-15), S4 0.030 to 0.037 m RMS, T-NAV-05
      0.108 m after 30 s (2026-11-14). It is safe because each value plus the guidance share stays inside the bound
      it serves: in a greenhouse 0.10 + 0.05 = 0.15 m, the maximum of REQ-SYS-027 (D100), within D106's planned
      0.275 m from the deck to the posts; in the open 0.15 + 0.05 = 0.20 m, inside the path bounds of REQ-SYS-026.
    source: [N-01, N-09, SG-03, D89, D100, D106]
