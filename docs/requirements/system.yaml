      where: >-
        the coverage planner and the greenhouse mission (P.gnc.cov; scripts/missions/greenhouse_std.json)
      note: >-
        The last full S4 run (2026-11-14) covered 97.1 % in 13.7 min with the 0.40 m inset, passing both values; T8
        took 13.2 min (2026-11-16). Since D72 the run with the mower holds at the lane-end walls and reaches no row
