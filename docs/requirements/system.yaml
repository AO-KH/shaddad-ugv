  - id: REQ-SYS-035
    function: F-06
    text: >-
      If its person detection cannot see its zone for longer than the detection time of 0.3 s, because its scans are
      lost or have stopped updating, then the robot shall stop and hold as for a person.
    rationale: >-
      SG-01: a lost detection must not read as a clear zone (D72, R-02). As for a person, the hold ends only on the
      operator's resume (D84), because the robot cannot tell whether a person is in the zone it cannot see. The
      detection time is 0.3 s, three scan periods: P.sensors.per.protNStale 2 at 10 Hz plus the scan in progress
      (the sensors and navigation engineer, step 6); today protectiveStop comes from the third invalid scan and the
      GNC's SENSOR_LOST at about 0.3 s (D72). Margin, on the stop model of REQ-SYS-029: at 1.2 m/s with the mower,
      for a person who stood at the field's far end when the scans were lost: 0.3 s blind, one 0.05 s GNC step and
      about 0.06 s to the ESC (0.49 m), then the 0.90 m AUTO stop, 1.39 m in all, 0.07 m inside the 1.46 m field. It
      is safe because the robot stops inside the zone that it last saw clear.
    source: [N-07, N-10, SG-01, D72, D84]
    parent: SG-01
    allocation: [PER, SNS, GNC, MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_perception tPER07_ScanLost; t_gnc_mission testScanLostOnRow, testScanLostInHold, testScanLostFsm
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Perception, protectiveStop after protNStale invalid scans; the GNC SENSOR_LOST hold (D72); the MCU's
        CTRL_STOP and park on the GNC's stop request, or the ESCs' park at zero command (D66, D71)
      note: >-
        The tests pass. After a lost scan the GNC resumes by itself on valid, clear scans (H1), not on the
        operator's command (D84, card G2-GNC, size M with D92 and D93). On the robot, a frozen but re-published
        LiDAR cloud stays valid (STATUS 28); the simulated LiDAR can only black out.
    status: agreed
    cards: [G2-NAV, G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: the resume of D84 added to the rationale (G1-03)"
      - >-
        2026-11-17: step 9: scans that stop updating, and a detection time; MCU and DRV added (FSE-10, RID-G1F-04,
        MCU-9, FSE-27)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the detection time of 0.3 s (SNS, Table 1)"
      - >-
        2026-11-18: part 2, step 19: the margin restated on the one stop model of REQ-SYS-029, 0.07 m (the lead systems engineer's
        ruling 5a; re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-036
    function: F-06
    text: >-
      While it runs autonomously, the robot shall detect a static obstacle of 0.30 m or larger in width and height
      in its path, at 3.0 m or more ahead of its front.
    rationale: >-
      N-01 and N-03: rows and transits have posts, boxes and trees that the robot must not hit. The smallest
      obstacle is 0.30 m in width and height, from T10's piles (radius 0.15 m) and tPER01's box (0.3 x 0.3 x 0.5 m);
      the robot holds at 1.5 m (P.gnc.obs.d_stop) and needs the obstacle seen at 3.0 m for full speed
      (P.gnc.spd.obs_d, obs_v; the GNC engineer, step 5). With the deck's 0.7 m reach ahead of the body's front the
      hold leaves 0.8 m to the obstacle, more than D100's 0.5 m. The 0.30 m height has no test yet (tPER01's box is
      0.5 m tall): a planned case on card G1-02, with the LiDAR's mounting height (card G1-04). Not a safety value.
    source: [N-01, N-03, D100]
    parent: none
    allocation: [PER, SNS, GNC]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S5 and S5b (the criteria of D100: the slow-down from the obstacle distance, the hold as in T6, at least 0.5
        m to the box); t_perception tPER01_Obstacle; t_gnc_mission testT6StaticBox; planned: card G1-02 (an obstacle
        0.30 m wide and 0.30 m tall)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Perception obstacles and occupancy; the GNC obstacle corridor (gnc spec 2.6)
      note: >-
        S5b passes 13 of 13 (STATUS 5.3). S5 cannot pass by design of its criteria (R-63). The obstacle stop is off
        in a bypass, its rejoin and the dock approach (gnc_missionFSM.m:158-159); in the dock approach only a person
        or a lost scan stops the robot (R-10, card G2-GNC).
    status: agreed
    cards: [G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: the smallest obstacle; partly, as the stop is off in a bypass and the dock approach
        (GNC-11, SNS-16)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the smallest obstacle of 0.30 m, seen at 3.0 m (GNC, Table 1); D100 in the verification
      - >-
        2026-11-18: part 2, step 19: width and height in the text, the sources of the 0.30 m corrected, its height
        untested (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-098
    function: F-06
    text: >-
      While its blades run, in any mode, the robot shall detect a person who comes within the blades' protective
      zone of REQ-SYS-046 on any side and start the blade stop within 0.35 s of the person's entry.
    rationale: >-
      SG-09: the blades stop for a person near. REQ-SYS-046 stops them when a person is detected, but REQ-SYS-033
      asks for detection only in the zone the robot is about to occupy, in the autonomous modes: a person at the
      side of the deck, or near it in RC driving, is not seen (HAZ-006, HAZ-020; hazard log E-06). The protective
      zone is REQ-SYS-046's: 5.0 m from the outer edge of the deck housing on every side and, while the robot moves,
      6.5 m ahead and on the side toward which its deck sweeps, in every mode, with RC driving held at 1.2 m/s while
      the blades run (REQ-SYS-210), set by risk assessment (D103) and not yet confirmed against the standards (the
      functional safety engineer, step 11, Table 1, and step 19). The text binds the 0.35 s from a person entering
      the zone to the start of the blade stop, on which the zone rests, as REQ-SYS-132 binds the person field's 0.25
      s (the lead systems engineer's point 8); today's chain through the GNC and the next IMPL_CMD frame takes up to 0.40 s, which
      does not meet it (decided, pending on card G2-FSC). The margin and why it is safe are REQ-SYS-046's.
    source: [N-07, N-15, SG-09, D103]
    parent: SG-09
    allocation: [PER, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        planned: card G1-02 (a person beside the deck while mowing; a person near the deck in RC driving; the blade
        stop started within 0.35 s of the entry)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        none: the protective fields look to the front and the rear, and the person stop runs only in the autonomous
        modes (sensors spec 3.7; D72)
      note: >-
        Hazard log HAZ-006 and HAZ-020; E-06 (class 1), which the safety concept answers (card G2-FSC). No LiDAR is
        in the as-built record (card G1-04). The chain to the blade stop takes up to 0.40 s today, against the 0.35
        s (card G2-FSC).
    status: agreed
    cards: [G2-FSC, G1-02, G1-04]
    history:
