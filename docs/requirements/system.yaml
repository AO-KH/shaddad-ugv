        the speed governor and the plan's turn speed (gnc spec 2.5, 2.7)
      note: >-
        T9 passes its criterion (the commanded turn speed and the true speed over the middle half of each turn at
        0.764 m/s or less, 2026-11-16), but the true speed peaks at 0.821 m/s at a turn's entry, above the palm
