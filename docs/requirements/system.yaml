  - id: REQ-SYS-068
    function: F-14
    text: >-
      If the companion's commands stop arriving, or arrive stale or corrupted, for longer than the command time-out
      of 0.20 s during autonomous operation, then the robot shall make a controlled stop and park on its brakes.
    rationale: >-
      SG-07: on the loss of the companion's commands the robot stops and parks. The command time-out is 0.20 s
      (P.electronics.safety.comp_timeout: the COMP_CMD sequence number unchanged in AUTO_START and AUTO, bit 4, ICD
      section 6; the MCU firmware engineer, step 4), 4 COMP_CMD periods of 50 ms (20 Hz), robust to jitter. Margin:
      from 1.2 m/s the robot moves 0.24 m during it, then about 0.81 m in the controlled stop at 1.0 m/s^2 (jerk 10
      m/s^3; the replay of the stop model of REQ-SYS-029, with the ESC's lag), about 1.05 m in all, inside the
      protective field's 1.46 m at 1.2 m/s (D72), which goes blind with the companion. It is safe because the robot
      stops inside the zone that it last saw.
    source: [N-10, SG-07]
    parent: SG-07
    allocation: [MCU, CMP, COM, DRV]
    safety: true
