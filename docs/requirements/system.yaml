  - id: REQ-SYS-190
    kind: constraint
    function: none
    text: >-
      The robot shall implement each safety function to the performance level of its safety goal, rated and shown
      with ISO 13849-1:2023 and validated with ISO 13849-2:2012.
    rationale: >-
      N-15 and D103: ISO 13849-1:2023 stays the rating method. The performance levels are those of the safety goals
      SG-01 to SG-11 (hazard log NASL-SHD-HAZ-001 v1.2). The texts of the standards are not bought now, so
      REQ-SYS-033, -046, -048 and -098 are set by risk assessment and marked as not yet confirmed against the
      standards (D103). The requirement constrains the method; the levels themselves sit in the safety goals. The
      validation is ISO 13849-2:2012 (STD-11, STD-12; the functional safety engineer, step 11, C-08); parent none,
      as the requirement spans every goal, and each goal's PL binds through the goal; it applies to all the safety
      goals, so a trace from any goal includes it (kept unmarked as a constraint across the goals by the lead systems engineer's
      point 19, as the functional safety engineer, step 17, has it; the review's RID-G1T-08 asked for the safety
      mark).
    source: [N-15, D80, D103]
    parent: none
    allocation: [MCU, PWR, DRV, PER, SNS, GNC, BMS, ELC, COM, NAV]
    safety: false
    tbd: none
    verification:
      method: Analysis
      level: system
