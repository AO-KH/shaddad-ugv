  - id: REQ-SYS-143
    kind: performance
    function: F-14
    text: >-
      If the operator's RC link is lost while the robot drives at 1.0 m/s in RC driving on flat farm soil, then the
      robot shall come to rest within 0.8 m of the loss, with a mean deceleration of 1.0 +/- 0.1 m/s^2, and park on
      both brakes.
    rationale: >-
      SG-07 and N-10: on a lost link the robot stops under control (category 2, D33) and parks (D71). D100 sets S6's
      criteria: the controlled stop judged as S8b (the mean over the constant phase 1.0 +/- 0.1 m/s^2, the 100 ms
      peak at most 1.2 m/s^2), the standstill in the MCU's terms, parked on both brakes, and stopped within 0.8 m of
      the loss; REQ-SYS-067 holds the 0.13 s to the controlled stop. Margin: D33's replay stops from 1.0 m/s in 0.71
      m, 128 ms of detection included, 0.09 m (11 %) within the bound. It is safe because this is the designed
      category-2 stop of SG-07 and the person protection (SG-01) does not rest on it; the lower deceleration bound
      keeps the stop from being softer than 0.9 m/s^2.
    source: [N-10, SG-07, D100, D33]
    parent: SG-07
    allocation: [MCU, COM, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S6a and S6b (architecture section 12; the criteria of D100 in the script on card G2-INT)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the MCU's RC failsafe and controlled stop (fw_mode_manager, the shaper; electronics spec 2.7)
      note: >-
        S6a and S6b (2026-11-15): CTRL_STOP after 0.12 s, and the 100 ms peak of 1.099 m/s^2 passes D100's 1.2. The
        mean and the stop distance are not scored yet, and the scripts still judge 1.05 m/s^2 and a 1.5 s standstill
        (card G2-INT).
    status: agreed
    cards: [G2-INT]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-121"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-144
    kind: performance
    function: F-15
    text: >-
      While it stands on its spring brakes with no power on a slope of up to 20 deg with its heaviest implement
      load, the robot shall hold with a brake torque of at least twice the torque that the slope demands.
    rationale: >-
      SG-05 (every stop ends held on the brakes) and N-08; D86's category-0 stop rests on these brakes. The case is
      the full-tank sprayer (316 kg) on 20 deg, the steepest slope of the envelope with the heaviest load (the drive
      engineer, step 9, TD-3): the demand is m g sin(20 deg) = 1060 N, or 95 N m at the 0.090 m sprockets and 1.19 N
      m at each of the four motors through the 20:1 gearboxes; the four spring brakes give 5 N m each
      (P.drive.motor_unit.brake_T, params/param_motor_unit.m:45, [EST]): a margin of 4.2. Margin: the bound of 2
      covers the spread of the friction coefficient (mu_s 0.40 [EST]), wear and fade between inspections, and the
      brakes' estimated rating, so half the rated torque still holds. It is safe because the robot then holds the
      heaviest case with half its brake torque. Set by risk assessment and not yet confirmed against the standards
      (D103).
    source: [N-08, SG-05, CR-001, D86, D103]
    parent: SG-05
    allocation: [DRV]
    safety: true
    tbd: none
    verification:
      method: Analysis
      level: system
      reference: >-
        the holding torque against the demand at 316 kg on 20 deg (drive spec 2.7); t_drive testT08_brakeHold; S2
        and S2b (the hold); the slope brake test on the robot (card T-04); the brake datasheet (card G1-04)
      campaign: simulation
    as_built:
      state: hardware
      where: >-
        the spring brakes, 5 N m per motor (P.drive.motor_unit.brake_T; drive spec 2.7)
      note: >-
        The twin's brakes are estimates (a margin of 4.2), and S2 and S2b hold within 0.05 m. The robot's brake data
        are still to come (as-built record open item 3, card G1-04).
    status: agreed
    cards: [G1-04, G2-DRV, T-04]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-119 and merged with the first part of the drive
        engineer's TD-3 (step 9, Table 5): no power, the heaviest implement load on 20 deg
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-145
    kind: performance
    function: F-15
    text: >-
      While it stands on its spring brakes with no power on a slope of up to 20 deg, the robot shall creep by no
      more than 0.02 m in 600 s, counted from 5 s after both brakes engage.
    rationale: >-
      SG-05 and N-08: the second part of the drive engineer's TD-3 (step 9, Table 5), split so that each stays
      singular. 0.02 m is the creep limit of S2c and S2d (architecture section 12), and 600 s the drive's T8 hold
      (drive spec 8). Counting from 5 s after both brakes engage leaves out the elastic settle (21.5 mm on 20 deg
      and 37.3 mm on the 15 deg side slope in the structure's T8_parking, which holds 70 s and measures the drift
      from 5 to 65 s: 0.000 and 0.079 mm). Margin: the drive's 600 s T8 has been incomplete since D64, whose run
      gave 0.0004 m/h, and the structure's 60 s window shows under 0.1 mm, 200 times inside the bound. It is safe
      because a held robot that creeps no more than the park criterion allows stays where its stop left it.
    source: [N-08, SG-05, D64, D100]
    parent: SG-05
    allocation: [DRV, STR]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_drive testT08_brakeHold (a Long test: T06_LONG=1, card G2-DRV); t_structure T8_parking; S2c, S2d (held
        within 0.02 m)
      campaign: simulation
    as_built:
      state: hardware
      where: >-
        the spring brakes and the ESCs' park (drive spec 2.7, 2.9)
      note: >-
        T8 holds with under 0.1 mm of drift in the twin; testT08_brakeHold has not run since D64 (a Long test, card
        G2-DRV). The robot's brakes are estimates until their data (card G1-04).
    status: agreed
    cards: [G2-DRV, G1-04, T-04]
    history:
      - "2026-11-18: part 2, step 13: split from the drive engineer's TD-3 (step 9, Table 5)"
      - >-
