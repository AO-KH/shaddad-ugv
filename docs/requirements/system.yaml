  - id: REQ-SYS-117
    function: F-10
    text: >-
      If the dock does not report contact, with the robot within 0.03 m and 2 deg of its dock pose, within 2.0 s of
      the end of its dock segment, then the robot shall stop, hold and report a failed docking.
    rationale: >-
      N-03: a robot that ends its dock approach short of the contacts, or pushes against the dock body, must not
      wait or push for ever (R-10). The GNC engineer splits the docked check from the docking speed of REQ-SYS-058
      (step 5, Table 1): the contact within 2.0 s of the end of the dock segment, within 0.03 m and 2 deg
      (P.gnc.fsm.t_docked, dock_tol_xy, dock_tol_yaw; T12's tolerances). Under D97 the dock is the twin's, so the
      check is verified in the twin. Not a safety value: a person between the robot and the dock is in the
      protective field, which stops the robot in the dock approach (REQ-SYS-033, -058), so the check bounds a push
      against the dock body, an equipment risk (R-10); REQ-SYS-058 keeps the safety (for the functional safety
      engineer to confirm).
    source: [N-03, D97]
    parent: none
    allocation: [GNC, MCU]
    safety: false
