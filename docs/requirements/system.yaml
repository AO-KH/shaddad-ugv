  - id: REQ-SYS-012
    function: F-02
    text: >-
      If an RC frame arrives corrupted, then the robot shall keep the resulting error of the speed and the turn rate
      that it commands to its tracks within the glitch limit of 0.02 m/s and 0.02 rad/s.
    rationale: >-
      SG-11: a corrupted frame must not command a motion that the operator did not give. SBUS has no checksum, so
      the robot can discard only the frames that fail their parity, framing, header, footer or range checks; a
      sustained loss is the lost link of REQ-SYS-067. The glitch limit binds the speed and turn-rate references
      after the shaper, which the drives follow, not the target: one corrupted frame that passes the decoder's
      checks (even-bit errors pass parity; SBUS has no CRC) can put any in-range value on a channel for one 14 ms
      frame (P.rc.frame_period, params/param_rc.m:6), which the 10 ms control task sees in at most two samples; the
      shaper's jerk limits (shaper.j_max 5 m/s^3, jw_max 8 rad/s^3, params/param_electronics.m:48) bound the change
      to 0.002 m/s and 0.0032 rad/s (the electronics and comms engineer, step 8). Margin: 10 times in speed and 6
      times in turn rate for one frame, and 4.4 and 2.8 times for two corrupted frames in a row (about 4e-8 per
      frame pair at a bit error rate of 1e-3). It is safe because 0.02 m/s over the 0.1 s that the shaper needs to
      recover moves the robot about 2 mm, and 0.02 rad/s turns it about 0.002 rad, far below D100's hold and
      clearance distances. The discrete commands on a corrupted frame are REQ-SYS-115 (the lead systems engineer's ruling 5).
    source: [N-04, SG-11]
    parent: SG-11
    allocation: [MCU, COM]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S6c (today: no command glitch above 2 % of full scale on the targets; card G2-COM judges it on the
        references telem.v_ref and telem.w_ref and adds errors that parity cannot catch, R-47); t_mcu_platform
        testTEL03_ByteErrors; t_rc_link byte_errors
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU SBUS frame sync and decoder: a frame with a UART error, a bad header or footer, or a channel out of
        range is discarded (sbus_frame_sync, fw_sbus_decoder; electronics spec 2.6.3, 4.1)
      note: >-
        testTEL03_ByteErrors passes. An even number of bit errors in a byte passes parity and is not detected. S6c
        injects only errors that parity catches, so it cannot fail (R-47, card G2-COM).
    status: agreed
    cards: [G2-COM]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: only what SBUS allows: the command error within a glitch limit (MCU-2, L-1)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the glitch limit of 0.02 m/s and 0.02 rad/s on the commanded references (ELC, section
        3); the discrete commands split to REQ-SYS-115 (L-5)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-115
    function: F-02
    text: >-
      If an RC frame arrives corrupted, then the robot shall not change its mode, arm, reset, remote-stop,
      implement, lift or mission commands on that frame.
    rationale: >-
      SG-08 and N-04, split from REQ-SYS-012 so that each stays singular (the lead systems engineer's ruling 5 of step 13, on the
      electronics and comms engineer's text of step 8). Its content is that no corrupted frame gives an arm, a
      reset, a mission start or an implement start: an unexpected start-up (SG-08, with REQ-SYS-011), not the stick
      motion of SG-11, which stays in the source; ruling 5's same parent is amended for this requirement (the
      functional safety engineer, step 17, section 4; the lead systems engineer's point 18). One corrupted frame that passes the
      decoder's checks can put any in-range value on a channel for one frame (14 ms). The 3-position switches need 4
      agreeing samples at 10 ms, a debounce of 30 ms (3 delays and the current sample;
      P.electronics.rcmap.debounce_n, params/param_electronics.m:30), the remote stop the 5 samples of fault bit 1's
      persistence (40 ms, P.electronics.safety.t_persist, :99) and the AUTO override 0.2 s (rcmap.override_t, :31).
      Margin: against one 14 ms frame, about 16 ms on the 3-position switches and 26 ms on the remote stop. Not
      shown when rejected frames follow: the decoder keeps the last accepted channels while rc_ok holds (up to 0.10
      s without a valid frame), so a corrupted frame that passes the checks, followed by two rejected frames, keeps
      its values for about 42 ms, which passes the debounce (the register's re-check, step 14b). It is safe once
      card G2-MCU debounces on new accepted frames and debounces the 2-position switches: no single corrupted frame
      can then arm the robot, reset a stop, start a mission or turn on its implement.
    source: [N-04, SG-08, SG-11]
    parent: SG-08
    allocation: [MCU, COM]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G2-MCU (single corrupted frames injected on CH5, CH6, CH8, CH9, CH11, CH13 and CH14, alone and
        followed by rejected frames: no mode change, arm, reset, implement, lift, mission or return-home edge);
        t_rc_link byte_errors
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU RC mapping: the 3-position switches debounced over 4 samples (rcmap.debounce_n), the remote stop's 40 ms
        persistence, the 2-position switches decoded as x > sw2_thresh with no debounce
        (scripts/build/build_fw_platform.m:209-213)
      note: >-
        The mode, implement, lift and mission switches are debounced over 30 ms (4 samples at 10 ms); the 2-position
        switches (arm CH6, reset CH9, lights CH10, return home CH14) are not, so today one corrupted frame that
        passes the checks can give an arm, reset or return-home edge (the electronics and comms engineer's finding
        F1, card G2-MCU). A corrupted frame that passes the checks and is followed by rejected frames is held by the
        decoder for up to 0.10 s, longer than the debounce (card G2-MCU).
    status: agreed
    cards: [G2-MCU, G2-COM]
    history:
      - >-
        2026-11-18: part 2: split from REQ-SYS-012 by the lead systems engineer's ruling 5 (step 13), on the electronics and comms
        engineer's text (step 8, section 3)
      - >-
        2026-11-18: part 2, step 19: parent SG-08 with SG-11 in the source (FSE step 17, section 4); the implement
        and lift commands added and the margin restated, with the decoder's hold-over (re-check 14b)
      - "2026-11-18: part 2, step 19c: ruling 5's same parent amended for this requirement (the lead systems engineer's point 18)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  # ---- F-03 Run missions ----
  - id: REQ-SYS-013
    function: F-03
    text: >-
      When the operator commands a mission start, the robot shall start the mission only with a valid position
      within the accuracy bound of REQ-SYS-022, a valid plan, its drives ready and its charge above the start
      threshold of SOC 0.35.
    rationale: >-
      A mission that starts without a position, a plan, its drives or the energy to finish would stop part way
      (N-02, N-05). The start threshold is SOC 0.35 (P.gnc.fsm.soc_start_min, params/param_gnc.m:121; the GNC
      engineer, step 5): the return threshold at 500 m is 0.237 (T12, 2026-11-16), so 0.35 leaves charge for work
      above the return. A start check on the mission's own energy (the plan's estimate plus the reserve plus D101's
      10 %) is a design item for card G2-GNC.
    source: [N-02, N-05]
    parent: none
    allocation: [GNC, MCU, NAV, BMS]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_gnc_mission testReadyAndStartGating
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC mission manager, transition T1 (subsystems/gnc/gnc_missionFSM.m; gnc spec 4.1)
      note: >-
        The test passes. The start (T1, T2) checks only the 2 m health flag (nav_ok), not the accuracy gate, so the
        robot can start above the gate and pause again 2 s later; NOT nav_degraded in T1, T2, P1 and P3 is card
        G2-GNC (size S). The charge behind the gate is the BMS's estimate; T-PWR-11 (t_pack_bms soc_estimation_T11)
        fails in the baseline on the former pack's expectations (R-29).
    status: agreed
    cards: [G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: the position within the accuracy bound; NAV and BMS added (SNS-O1, BMS-7)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the start threshold of SOC 0.35 (GNC, Table 1)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
