  - id: REQ-SYS-076
    function: F-15
    text: >-
      If its tilt passes its stop limit of 28 deg for 0.5 s, then the robot shall make a controlled stop and park on
      its brakes.
    rationale: >-
      SG-04: the robot shall not pass its tilt limits. The tilt stop limit is 28 deg for 0.5 s
      (P.electronics.safety.tilt_stop, t_tilt, params/param_electronics.m:94; the MCU firmware engineer, step 4).
      Margin: 8 deg above the 20 deg design slope, with the warning at 25 deg (REQ-SYS-147, D47). The stop acts on
      the larger of roll and pitch. In roll it lies 20 deg below the static tip-over with no implement, about 48 deg
      (atan(0.30/0.267), P.structure.geom.B, P.structure.lofi.h_cg), and 10.7 deg below the full-tank sprayer's
      lateral tip at 38.7 deg (structure spec 6.3). In pitch it holds for every configuration whose pitch tip angle
      lies above 28 deg; three lie below it, each near an end contact (structure spec 6.3, on the model geometry
      and, in brackets, the sharp-edge track end): the raised tiller facing uphill tips backward at 16.4 deg (11.8
      deg; the climbing torque lowers it further, not yet quantified), which the tiller's climb limit on card G2-TIL
      keeps out (a later phase, D76); the raised mower deck facing downhill at 23.7 deg (19.2 deg), which D81's rule
      (deck down whenever the robot moves) and D74's raised-deck rows keep out, the MCU's backstop waiting for the
      twin's lift-sense fix (REQ-SYS-044); and the deck-down mower with its gauge wheels lifted at 25.4 deg (20.7
      deg), which rests only on the gauge wheels staying down, with no rule yet that keeps them down (card G2-STR).
      It is safe because a stop at 28 deg leaves the robot short of its tip-over angle in every configuration that
      may move under those rules; for the deck-down mower with a lifted gauge wheel it is not shown (card G2-STR).
    source: [N-08, SG-04, D47, D74, D76, D81]
    parent: SG-04
    allocation: [MCU, SNS, DRV]
