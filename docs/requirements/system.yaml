  - id: REQ-SYS-050
    function: F-08
    text: >-
      When its blades have stopped for an emergency stop, a person or a zone it could not see, any other hold or
      pause, a tilt stop, a fault or a raised deck, the robot shall restart them only on the operator's deliberate
      command (D92).
    rationale: >-
      SG-09: the blades shall not restart without a deliberate command. D92: during a hold a person can reach the
      deck unseen, since the near zone and the deck's sides are not watched, so after any protective stop the
      restart is the operator's. The planned starts within a mission, on the rows and turns after a transit, stay
      automatic: the operator's mission start covers them (REQ-SYS-045).
    source: [N-11, SG-09, D84, D92]
    parent: SG-09
    allocation: [GNC, MCU]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G1-02 (a restart after an E-stop, a person, an obstacle hold, a pause, a tilt stop, a fault
        and a raised deck, in a mission and in RC driving)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        RC driving: the implement switch, the rotor running in MANUAL whenever the switch is on (electronics spec
        2.7.12); a mission: the GNC restarts the blades on ROW or TURN after H1 (gnc spec 2.9)
      note: >-
        In a mission the blades restart without an operator command when a hold clears (H1) or when P2 resumes after
        a navigation pause, and after a hold with a person only once the latch ends (D72), not on the operator's
        resume (D84). Card G2-GNC makes it D92 (with D84 and D93, size M), and chooses between waiting for the
        operator and moving on with the blades off. In RC driving the blades restart with the arm command if the
        implement switch was left on; requiring an off-to-on edge of the switch after every stop would make it a
        deliberate command (S work, card G2-MCU). The implement ECU restarts the blades by itself when its command
        frames return with the enable still set (REQ-SYS-101).
    status: agreed
    cards: [G2-GNC, G2-MCU, G2-FSC]
    history:
