      where: >-
        MCU fault bit 9 BMS_TIMEOUT: any BMS frame older than 0.5 s, class B, latched (ICD section 6)
      note: >-
        The tests pass with the twin's BMS frames. The robot's bought BMS, its frames and their rates are unknown
        (R-15, card G1-04). The BMS in turn opens the main contactor when the MCU's commands stop (t_pack_bms
        mcu_cmd_timeout).
    status: agreed
