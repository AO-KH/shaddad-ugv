  - id: REQ-SYS-114
    function: F-15
    text: >-
      If its electronics pass their temperature stop limit of 80 deg C in their enclosure for 5 s, then the robot
      shall make a controlled stop and park on its brakes.
    rationale: >-
      SG-06 and N-13: the robot works in heat up to 45 to 50 deg C (N-13), and REQ-SYS-205 relies on this stop to
      keep the E-stop chain's parts within their rating, so it is a safety requirement under SG-06 (the functional
      safety engineer, step 17, section 3, point 8). A controller that overheats can fail while the robot drives, so
      the robot stops first; before the stop limit it derates at a warning limit. The stop limit is 80 deg C of
      enclosure air for 5 s (P.electronics.safety.T_encl_crit 353.15 K, params/param_electronics.m:98; t_persist 5
      s, bit 21), with the warning at 70 deg C (REQ-SYS-148), 5 K below the STM32H743's 85 deg C maximum ambient
      (the MCU firmware engineer, step 4), provisional under D96; the electronics and comms engineer, the second
      owner, keeps the final value open until card G1-04's data on the robot's board and box (step 8, section 5.1).
      Margin: 5 K below the H743's 85 deg C; at 50 deg C ambient and 1000 W/m^2 the twin's box air is 24.7 K below
      the stop with the fans and 8.7 K with the fans failed, and on the stricter plain-box reading it is 56.5 deg C
      with the fans and 76 deg C without, 4 K below the stop (electronics spec 2.9.4; the box's area is settled on
      card G2-VAL with the robot's box from G1-04). It is safe for the controller, which stops before its limit. For
      the safety relay it is not shown: the stop lies 25 K above a typical 55 deg C safety relay, the conflict of
      REQ-SYS-205 and -165, an open safety value for the owner, decided on card G1-04 once the delivered relay's
      rating and place are known; the lead systems engineer recommends parts rated for the 80 deg C stop or the relay and the STO
      interface placed outside the box, as both keep the mission in the heat (the lead systems engineer's point 1). The final value
      comes with card G1-04, as a RID, not a TBD.
    source: [N-10, N-13, SG-06]
    parent: SG-06
    allocation: [MCU, ELC, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
