  - id: REQ-SYS-112
    function: F-15
    text: >-
      When it moves off on a slope of its envelope, the robot shall roll back by no more than 0.05 m, from the
      release of its brakes until it moves forward.
    rationale: >-
      SG-05 (HAZ-027, PL a): since D66 every restart on a slope unparks with no holding torque, about 0.1 m of
      roll-back at every hill start on 20 deg after a stop of 2 s or more (R-37). The roll-back limit is 0.05 m, on
      every slope of the envelope (20 deg; 18.5 deg with the full sprayer) and with either motor (the drive
      engineer, step 9, Table 1): S2 and S2b already allow 0.05 m of roll-back in a hold, and D100 extends S2's
      roll-back check over the hill start. Margin: half the 0.1 m that HAZ-027 rates S1 (a bruise); it bounds what
      gravity can put into the motion to 316 kg x g x sin 20 deg x 0.05 m = 53 J, half of HAZ-027's case, and it is
      a twentieth of the 1.0 m kept to a person (S5, D100). It is safe because a restart then moves the robot no
      further than a hold already may, and the limit needs no new detection; HAZ-027's PL a is within reach of one
      MCU.
    source: [N-08, SG-05, D100]
    parent: SG-05
    allocation: [MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S2 (the restart after the hold, with S2's window extended to the restart + 3 s and the hill-start roll-back
        checked: the criteria of D100, card G2-INT); t_mcu_control testTEL61_HillStartRollback (it expects the
        roll-back today; its expected values change by decision 14's route, T-03); planned: a t_drive bench case of
        the hill start (card G2-DRV)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the D71 park and the ESC's unpark (drive spec 2.7, 2.9)
      note: >-
        About 0.1 m of roll-back at every hill start on 20 deg (R-37, DRV-05: 0.07 to 0.12 m; S2spray rolls back at
        0.061 m/s after the release): not met. The fix is pending on card G2-MCU with G2-DRV: keep the speed
        integrator through PARKED, or preload the stored holding torque before the brakes release (the drive
        engineer, step 9). The MCU's hill-start window is lim.descent.t_release 0.5 s (STATUS 30).
    status: agreed
    cards: [G2-MCU, G2-DRV, G2-INT, T-03]
    history:
      - "2026-11-17: added in step 9 from the functional safety engineer's S05 (step 7)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the roll-back limit of 0.05 m (DRV, Table 1); the note, the cards and the verification
        corrected (DRV, Table 4; D100)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-113
    function: F-15
    text: >-
      If the robot moves at less than 0.05 m/s for 5 s while it is commanded at 0.15 m/s or more in autonomous
      operation, then the robot shall stop, hold on its brakes and end the mission.
    rationale: >-
      N-10: a robot that pushes against something it cannot see (in its blind near zone, a post beside its deck, the
      dock body of R-10), or that digs its tracks in, must not go on pushing; N-05: the stop names its cause. The
      stuck time is 5 s, with a command of at least 0.15 m/s and a measured speed under 0.05 m/s (fsm.t_stuck,
      v_stuck_meas, params/param_gnc.m:119-120; the GNC engineer, step 5): the lower command threshold also covers
      the 0.2 m/s dock approach (R-10). Not a safety value.
    source: [N-10, N-05]
    parent: none
    allocation: [GNC, NAV, MCU, DRV]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_gnc_mission testT17Stuck
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        GNC mission manager, G1: stuck (fsm.t_stuck, v_stuck_cmd, v_stuck_meas) into FAULT with fault bit 4, in a
        mission and a return to the dock (subsystems/gnc/gnc_missionFSM.m; gnc spec 4.1)
      note: >-
        testT17Stuck passes: FAULT 5.0 s after the plant is held. The check needs a command of at least 0.3 m/s, so
        it misses a blocked pivot (REQ-SYS-092) and a push at the 0.2 m/s docking speed (R-10, card G2-GNC).
        Decided, pending: the twin changes on card G2-GNC (today the command threshold is 0.3 m/s, fsm.v_stuck_cmd).
    status: agreed
