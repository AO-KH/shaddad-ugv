  - id: REQ-SYS-005
    function: F-01
    text: >-
      When the operator moves the mode switch to manual, or moves a stick beyond 30 % of its travel, during
      autonomous operation, the robot shall pass to RC driving within the takeover time of 0.3 s, counted from the
      switch or from the stick passing 30 %.
    rationale: >-
      The operator is the final authority over the robot's motion: the RC commands win over the companion's
      (architecture section 1). The takeover time is 0.3 s: a stick override acts once a stick passes 30 % of its
      travel (rcmap.override_tol 0.30) and stays there for rcmap.override_t 0.20 s, plus D37's stick-to-ESC latency
      of at most 62 ms (0.26 s), and the mode switch its debounce, which accepts a held change within 40 ms (4
      agreeing samples at 10 ms, spanning 30 ms), plus 62 ms (0.10 s) (P.electronics.rcmap,
      params/param_electronics.m; the MCU firmware engineer, step 4).
    source: [N-04, N-05, D37]
    parent: none
    allocation: [MCU, GNC, COM]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL30_31_AutoStartOverride; t_gnc_mission testT11ModeLogic
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        MCU mode manager, AUTO_START and AUTO to MANUAL on the mode switch or a stick override (electronics spec
        2.7.3); the GNC mission manager, transition G2 (gnc spec 4.1)
      note: >-
        The tests pass in the baseline. The GNC follows the mode switch only: after a stick override it does not
        pause; when the sticks are let go with the switch still at AUTO, the MCU stays in MANUAL, since it enters
        AUTO_START from MANUAL only on a change of the switch to AUTO (mcu_mode_manager.m; corrected by the MCU
        firmware engineer, step 4, section 8).
    status: agreed
    cards: []
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: a takeover time in place of at once; the note on the stick override (RID-G1F-03, GNC-18)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the takeover time of 0.3 s, and the note on the return to AUTO corrected (MCU, Table 1
        and section 8)
      - >-
        2026-11-18: part 2, step 19: the stick override from 30 % of the stick's travel, with the 0.3 s counted from
        that point (re-check 14b)
      - "2026-11-18: part 2, step 19c: the debounce's two times named (consistency check 19b, contradiction 17)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
