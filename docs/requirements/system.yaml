  - id: REQ-SYS-021
    function: F-04
    text: >-
      If GNSS is lost during a mission in the open, then the robot shall continue its mission on its other sensors
      for the outage time of 30 s.
    rationale: >-
      N-10: a lost GNSS must not end every mission in a palm grove; the operating concept lists it as an abnormal
      case (charter section 6). The outage time is 30 s, S7's outage, then 10 s of float (the charter's palm-grove
      case, section 6); T-NAV-05 (2026-11-14) gives 0.108 m of error and 0.33 deg of yaw drift after 30 s with a 90
      deg turn (the sensors and navigation engineer, step 6; kept in the GNC engineer's budget of step 5b). It holds
      within the palm-grove gate of 0.15 m and the path bound of 0.50 m (REQ-SYS-022, -026) with an honest
      covariance.
    source: [N-09, N-10]
    parent: none
    allocation: [NAV, SNS, PER, GNC]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S7 (farm, wet, temp); t_nav tNAV05_GnssOutageTurn, tS7OutageWetSoil
      campaign: simulation
    as_built:
      state: partly
      where: >-
        NavFusion dead reckoning; the GNC navigation-degraded rule (T7, D69)
      note: >-
        S7 fails in the baseline in all three variants; a GNSS outage gives a NAV pause about 4 s after RTK is lost
        (STATUS 4), and the covariance is optimistic (STATUS 5). The pause comes from the GNC's gate: it pauses on
        the quality term (q_good, D69) 2 s after the RTK fix is lost in the open, and faults at a sigma of 0.30 m,
        so the outage time needs the gate changed as well as an honest covariance (card G2-GNC). As drafted in part
        1, the outage time and the bounds of REQ-SYS-022 cannot both pass S7; part 2 sets them as one budget.
        Decided, pending: it holds only with three changes: the quality term out of the gate's pause (card G2-GNC),
        the dead-reckoning limit of REQ-SYS-023 at 35 s (card G2-NAV; 10 s today, P.sensors.nav.tAbsMax), and an
        honest covariance (REQ-SYS-124, card G2-NAV). Until then S7 fails, as recorded.
    status: agreed
    cards: [G2-NAV, G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: continue the mission, not only keep to the path; PER added; the gate's part in the
        pause; one error budget (SNS-1 to SNS-3, GNC-6, L-1)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the outage time of 30 s (SNS, Table 1; GNC step 5b)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-022
    function: F-04
    text: >-
      When its position uncertainty stays at or above the bound of its kind of path for 2.0 s, the robot shall pause
      the mission: across the lane 0.10 m on greenhouse rows and turns, 0.15 m on palm-grove rows and turns and on
      transits, and 0.04 m on the dock approach; along it 0.25 m, and 0.04 m on the dock approach.
    rationale: >-
      SG-03: the robot keeps within a bounded distance of its path only while it knows its position well enough. D89
      makes this the second layer, the accuracy that the path needs; the first layer, the health flag, is
      REQ-SYS-023. The bounds are the GNC engineer's combined budget (step 5b, Table 1 and section 4; L-8), on the
      filter's own 1-sigma: the gate clears at 0.07 m across in a greenhouse, 0.10 m in the open and 0.03 m on the
      dock approach, and at 0.20 m along (0.03 m on the dock approach). Margin: at the gate the guidance share plus
      3 sigma equals the path bound of REQ-SYS-026 for each kind of path, so the true deviation in normal running
      stays within the bound at 99.7 %, and the normal sigma sits 1.4 times (greenhouse turns) to 5.8 times (palm
      rows) below the gate, so normal running does not pause; the 3-sigma margin holds only with an honest
      covariance (REQ-SYS-124; S7: 0.41 in bound against 0.90). It is safe because the pause comes before a
      navigation error that the path bound cannot see carries the robot past it. Rows on a slope take the row bounds
      (the lead systems engineer's ruling 4 of step 19).
    source: [N-09, SG-03, D69, D89]
    parent: SG-03
    allocation: [NAV, GNC]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        t_gnc_mission testT7NavSigmaRule, testT7NavSigmaPause; S4 (no NAV_DEGRADED pause on the rows: D69's margins
        of 0.094 m across and 0.157 m along are to today's 0.15 m and 0.25 m gate; to the decided 0.10 m greenhouse
        gate the margin across is about 0.04 m, 1.6 times S4's sigma of at most 0.061 m); S7 (the pause after the
        RTK loss)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC input conditioning, nav_degraded with the cross- and along-track sigma relays (D69), and T7 into PAUSE
        (gnc spec 4.1)
      note: >-
        The tests pass. The rule uses the filter's own covariance, which is optimistic (STATUS 5; REQ-SYS-095).
        Above 0.30 m the mission faults instead of pausing (REQ-SYS-023). The gate also pauses on the quality term
        and an odometry mismatch (D69), and P2 resumes by itself after fsm.t_nav_rec 5 s of good navigation
        (fsm.auto_resume_nav); whether the robot may resume by itself is for the safety concept (G2-FSC). In S7 the
        gate pauses well before the outage time of REQ-SYS-021 today, through its quality term; the budget takes the
        quality term out of the pause on card G2-GNC. Card G2-GNC. Decided, pending: the twin changes on card
        G2-GNC, with the kind of path from the plan's mission type; today 0.15 m across and 0.25 m along on every
        path, clear at 0.10 and 0.20 m (P.gnc.fsm.sigma_pause, sigma_degr, sigma_along, sigma_along_off), and 2 s
        (fsm.t_nav_degr).
    status: agreed
    cards: [G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: the second layer of D89, the owner's decision 18 (G1-03)"
      - >-
        2026-11-17: step 9: bounds per kind of path as D89 allows; S4 and S7 added; partly (SNS-1, SNS-4, SNS-5,
        GNC-7, L-1)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the bounds per kind of path and the degraded time of 2.0 s (GNC step 5b, section 4; L-8)
      - >-
        2026-11-18: part 2, step 19: D69's S4 margins marked as today's gate, about 0.04 m to the decided greenhouse
        gate (re-check 14b); the margin rests on REQ-SYS-124's honest covariance (FSE step 17); rows on a slope (the
        lead systems engineer's ruling 4)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-023
    function: F-04
    text: >-
      If its position becomes invalid during autonomous operation, through a failed position estimate, an IMU loss,
      35 s or more without an absolute position fix, or a position uncertainty of 2 m or more (D89), then the robot
      shall start a controlled stop within 0.5 s and hold on its brakes.
    rationale: >-
      SG-03: the robot stops when it cannot show where it is. D89 makes this the first of two layers: the validity
      flag is a health flag (the filter runs, and the uncertainty is under 2 m); the accuracy that the path needs is
      the second layer, the guidance's gate of REQ-SYS-022. The dead-reckoning limit bounds how long the robot
      trusts an uncertainty that nothing checks (STATUS 5). The dead-reckoning limit is 35 s and the reaction time
      0.5 s (the sensors and navigation engineer, step 6; L-3), provisional until the field data on card G2-NAV and
      checked by the functional safety engineer in step 17: 35 s is the outage time of REQ-SYS-021 plus 5 s for the
      receiver to re-acquire. Margin: at 35 s the twin's error is about 0.15 m (T-NAV-05's 0.108 m at 30 s, its
      lateral part growing with the square of the time), 3.4 times inside the 0.5 m path bound, so a robot three
      times worse than the twin stays inside it; the 0.5 s leaves 0.15 s over today's 0.35 s (fsm.t_nav_lost 0.3 s
      plus one 0.05 s GNC step), during which the filter keeps dead reckoning and the robot travels at most 0.6 m
      along its path at 1.2 m/s. It is safe because the stop starts while the position error is still inside the
      path bound.
    source: [N-09, SG-03, D73, D89]
    parent: SG-03
    allocation: [NAV, SNS, GNC, MCU]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_gnc_mission testT14NavInvalid; t_nav tModeUnit, tModeUnitImuLoss, tNAV13_ImuLoss; planned: card G1-02, a
        tModeUnit case: navValid false at a position sigma of 2 m and after the dead-reckoning limit without an
        absolute update (35 s; 10 s until card G2-NAV), and true below them
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        The navigation mode manager's flag navValid (subsystems/sensors/sens_nav_mode.m): true while the filter is
        aligned and running, the IMU is valid, an absolute update came within 10 s, and the larger of the East and
        North position sigmas is under 2 m (P.sensors.navmode.sigPosValid, params/param_sensors.m). The GNC mission
        manager, G1: navigation lost for 0.3 s in motion goes to FAULT with v = 0 (gnc spec 4.1); the GNC's nav_ok
        also needs the position sigma under fsm.sigma_lost 0.30 m (InputConditioning). The MCU's CTRL_STOP and park
        on the GNC's stop request, or the ESCs' park at zero command (D66, D71)
      note: >-
        The tests pass, and the twin's 2 m flag is the one D89 decides; the sensors spec's 0.15 m is the alignment
        threshold, written as the validity threshold, and part 2 corrects it. Design deviation: the GNC's 0.30 m
        FAULT is a third layer that D89 does not have, so the mission faults at 0.30 m instead of pausing between
        D69's bounds and the 2 m flag (card G2-GNC, size S; the value in part 2). No test checks the 2 m bound or
        the dead-reckoning limit. Nothing checks for a false RTK fix (R-43; REQ-SYS-095), and the position path is
        companion software (PL b at most, hazard log E-08, card G2-FSC); the re-alignment without RTK is REQ-SYS-096
        (card G2-NAV, R-44). Decided, pending: the twin changes on card G2-NAV (P.sensors.nav.tAbsMax 10 s today,
        params/param_sensors.m:170); the GNC's 0.30 m FAULT layer (fsm.sigma_lost) must not end an outage earlier
        (card G2-GNC).
    status: agreed
    cards: [G2-NAV, G2-FSC, G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: written to D89, the owner's decision 18 (G1-03)"
      - >-
        2026-11-17: step 9: the dead-reckoning cause and a reaction time; navValid in the record; the GNC's 0.30 m
        FAULT recorded as a design deviation (SNS-6 to SNS-8, GNC-2, MCU-15, RID-G1F-04, FSE-27, L-7)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the dead-reckoning limit of 35 s and the reaction time of 0.5 s to the start of a
        controlled stop (SNS, Table 1; L-3)
      - "2026-11-18: part 2, step 19: SNS added (the lead systems engineer's ruling 1 of step 19)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-024
    function: F-04
    text: >-
      If its IMU fails during an autonomous function, then the robot shall make a controlled stop, park on its
      brakes and end the mission.
    rationale: >-
      The heading and the attitude come from the IMU; without it the robot cannot show where it is (SG-03) or keep
      its tilt limits (SG-04). D85 makes the IMU fault class B in every autonomous function.
    source: [N-10, SG-03, SG-04, D73, D85]
    parent: SG-04
    allocation: [MCU, SNS, NAV, GNC, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_nav tNAV13_ImuLoss, tModeUnitImuLoss; t_sensors tImuFaults; t_mcu_control testTEL47_StuckImuFault;
        planned: card G1-02 for the class-B reaction of D85
      campaign: simulation
    as_built:
      state: partly
      where: >-
        sens_acq_imu, the frozen-IMU check; the navigation mode manager (invalid after 0.1 s, FAULT after 1 s;
        D73); the GNC FAULT on lost navigation; the MCU fault bit 24 IMU_FAULT
      note: >-
        In a mission the navigation goes invalid and the GNC faults with a standstill command, so the robot stops
        and the mission ends; but the MCU still treats IMU_FAULT as class C (derate 0.25), not as the class-B
        controlled stop and park of D85 (card G2-MCU, size S). A frozen IMU is caught; a wrong but plausible IMU is
        not (R-05, hazard log F-03).
    status: agreed
    cards: [G2-MCU, G2-NAV, G2-FSC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: written to D85, the owner's decision 5 (G1-03)"
      - >-
        2026-11-17: step 9: parent SG-04, the goal that D85 governs, with SG-03 kept in the source (FSE-14,
        RID-G1F-06)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: DRV added: the stop ends parked on the spring brakes, which the drive applies (DRV,
        Table 4)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-025
    function: F-04
    text: >-
      The robot shall stop and hold on its brakes before it or its implement passes the boundary of its permitted
