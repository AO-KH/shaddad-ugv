      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-088
    function: F-13
    text: >-
      When it plans its lane-end turns, the robot shall keep its body and its implement clear of the walls and posts
      by 0.5 m + 0.8 m per m/s of its turn speed + 0.10 m for guidance + 0.10 m for navigation (1.1 m at 0.5 m/s).
    rationale: >-
      R-06: the deck is invisible to the collision checks; STATUS 18: the protective field sees the end walls in the
      lane-end turns, so the mower holds there. D87's footprint per implement serves the planner too; the resume
      pivots are REQ-SYS-091 to -093. The turn clearance must also keep the walls and posts out of the zone where
      the robot detects people, or each turn near a wall becomes a person hold that waits for the operator (D84;
      STATUS 18, R-06). The turn clearance is the protective field's reach (0.5 m + 0.8 s x v, D72) plus the turn's
      tracking share of 0.10 m (the GNC engineer, step 5 and step 5b; L-6) and the navigation error of a greenhouse
      turn, up to 0.10 m more (step 5b, open point 3; the lead systems engineer's ruling 3 of step 19, the stricter reading): 1.1 m
      at the 0.5 m/s turn speed, 0.9 m at 0.25 m/s.
    source: [N-01, N-07, SG-01, D72, D81, D87]
    parent: none
    allocation: [CMP, GNC, STR]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S4 (with the mower); t_gnc_tracking testCompilerGreenhouse; planned: card G1-02
      campaign: simulation
    as_built:
      state: partly
      where: >-
        gnc_compileMission validation: the footprint of the body with the fitted implement kept cov.clear_min (0.15
        m) from the posts and walls on every segment, turns included
      note: >-
        testCompilerGreenhouse passes. The online replanner, bypass, corridor and pivot use the body only (R-06).
        With the mower, S4 holds at the end walls because the protective field reaches them in the turns, not the
        deck (STATUS 18); the turn clearance of part 2 must cover the field's reach. Card G2-GNC (D87, size M, and M
        for the rest of R-06). By the lead systems engineer's ruling 3 of step 19 the formula adds the navigation share, and choosing
        the turn speed or the field's shape in the turns so that the S4 house fits is card G2-GNC's design (gnc spec
        9, question 12: a slower turn, 0.9 m at 0.25 m/s, or a field shaped for the turns). Decided, pending: the
        twin's compiler changes on card G2-GNC (today cov.clear_min 0.15 m).
    status: agreed
    cards: [G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: the resume pivots moved to REQ-SYS-091 to -093 after D87 (G1-03)"
      - >-
        2026-11-17: step 9: partly: the compiler checks the body with its implement; the detection zone in the
        clearance; SG-01 in the source (GNC-4, SNS-O5, FSE-28)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the turn clearance of 0.5 m + 0.8 m per m/s + 0.10 m (GNC, Table 1; L-6)"
      - >-
        2026-11-18: part 2, step 19: the navigation share of 0.10 m added, 1.1 m at 0.5 m/s (the lead systems engineer's ruling 3 of
        step 19)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-089
    function: F-13
    text: >-
      The robot shall plan its missions only over ground within the slope envelope of its fitted implement: 20 deg,
      and 18.5 deg with the sprayer (CR-001), on farm soil, dry sand, the greenhouse floor and concrete; 18 deg on
      wet loam (REQ-SYS-129); and 15 deg across.
    rationale: >-
      SG-04 and the envelope of CR-001: the full-tank sprayer descends slopes up to 18.5 deg, and the robot cannot
      tell a full tank from an empty one (D75, D81); the others work to the 20 deg design slope. The cross-slope of
      15 deg is the envelope that REQ-SYS-130 and -149 rest on, so it binds the planning too (HAZ-038; the
      functional safety engineer, step 17, Table 1). On wet loam a climb slips past 30 % above about 18 deg
      (REQ-SYS-129; the structure engineer, step 10, section 6), so the planning keeps to 18 deg there, as the
      project owner approved on 2026-11-18 (step 22).
    source: [N-08, SG-04, CR-001, D75]
    parent: SG-04
    allocation: [CMP, GNC, STR]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G1-02 (the slope check of card G2-GNC)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        none: the mission planner has no slope limit per implement (STATUS 34)
      note: >-
        The planner has no slope limit per implement (STATUS 34). Until card G2-GNC adds it, the descent cap stops
        the sprayer at the top of steeper ground (its forward cap is 0 from 22 deg, its reverse cap from 21.5 deg).
        The text names the soils and the 18 deg on wet loam of REQ-SYS-129, as the project owner approved on
        2026-11-18 (step 22; the lead systems engineer's point 3). The tiller descends forward only (REQ-SYS-075),
        which the planning of its missions takes on card G2-TIL.
    status: agreed
    cards: [G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: the envelope of every implement; 18.5 deg without about (FSE-28, RID-G1F-03, GNC-25)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2, step 19: the cross-slope of 15 deg (FSE step 17, Table 1)"
      - "2026-11-18: part 2, step 19c: REQ-SYS-129's 18 deg on wet loam in the note (the lead systems engineer's point 3)"
      - >-
        2026-11-18: part 2, step 22: the text narrowed by D111, the project owner's approval: the soils of
        REQ-SYS-129 and 18 deg on wet loam
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
