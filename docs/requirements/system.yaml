  - id: REQ-SYS-119
    kind: performance
    function: F-02
    text: >-
      The robot shall drive at its RC speed limit of 1.40 m/s on level firm ground with its heaviest implement load,
      from a full pack down to the 0.20 reserve.
    rationale: >-
      N-03 and N-04: the transits and RC driving need the top speed of the platform as built: 5 km/h at the motors'
      rated 3000 rpm with the 20:1 gearboxes and the 0.090 m sprockets, 1.41 m/s (as-built record section 1;
      P.electronics.lim.v_track_max = 1.414 m/s, params/param_electronics.m:40), at the RC speed limit of
      REQ-SYS-010 (P.electronics.lim.v_max_man 1.4, :41) and down to the reserve of D101 (the drive engineer, step
      9, TD-1). On level ground the motors need about 40 V at that speed, mostly back-EMF (drive spec 2.3); at the
      0.20 reserve the pack's open-circuit voltage is 46.2 V (13 x 3.55 V, P.power.cell.OCV25), which leaves about 6
      V for the sag.
    source: [N-03, N-04, D101]
    parent: none
    allocation: [DRV, MCU, PWR]
    safety: false
    tbd: none
