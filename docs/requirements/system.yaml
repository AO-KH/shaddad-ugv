  - id: REQ-SYS-031
    function: F-05
    text: >-
      If its speed passes the descent cap of its pitch and fitted implement, then the robot shall park on its brakes
      within the trip reaction time of 0.09 s and stay parked until the operator resets it.
    rationale: >-
      SG-05: the robot shall not gain speed downhill; the owner keeps the latch (D74). The trip reaction time is
      0.09 s (the functional safety engineer, step 17, Table 1, in place of the 0.08 s of step 13): the trip in its
      10 ms sample (bit 16 (b) has no persistence), the park request in the next DRV_CMD frame, then the brake: T19b
      applies it 70 ms after the park request (60 ms after DISABLING, one 10 ms frame later; P.drive.brake.t_engage
      0.06 s), 80 ms with the trip's sample, and 81 ms in the drive engineer's worst case (10 + 10 + 1 + 60 ms; step
      9, Table 2). Margin: 9 ms over that worst case; the trip fires on the speed predicted ahead
      (lim.descent.t_pred), which card G2-MCU raises from 0.08 s to 0.09 s so that the prediction covers the
      reaction; the 10 ms costs about 0.034 m/s on the 20 deg descent, inside the cap's 0.10 m/s margin
      (descent.dv), and the table's own margins (v_tip/1.3, with the speed gained before the brakes engage) add to
      it. It is safe because the brakes hold before the speed reaches the tip speed. Provisional (D96, card G1-04):
      if the delivered ESC needs its stated share of up to 0.10 s, the value becomes 0.12 s, with t_pred to match
      and the descent table's margins checked again (cards G2-MCU, G2-DRV).
    source: [N-08, SG-05, D74, D96]
    parent: SG-05
    allocation: [MCU, DRV, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S2c; t_mcu_control testTEL55_DescentCapTrip, testTEL58_CclZeroSprayerDescent, testTEL61_HillStartRollback;
        t_drive testT19b_parkOnDescent (the drive's park)
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        MCU Descent_trip: OVERSPEED, bit 16, latched; a CTRL_STOP with bit 16 set parks at once (D71, D74)
      note: >-
        S2c passes with the sprayer and with no implement. The reverse trip after an uphill hill start is low
        (STATUS 30, card G2-MCU). Decided, pending: lim.descent.t_pred 0.09 s on card G2-MCU (0.08 s today).
    status: agreed
    cards: [G2-MCU, G2-DRV, G1-04]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: a reaction time in place of at once; SNS added (RID-G1F-03, SNS-O4)"
