  - id: REQ-SYS-042
    function: F-08
    text: >-
      The robot shall apply the limits of the implement that is actually fitted.
    rationale: >-
      HAZ-039: the descent limits of the wrong implement can tip the robot (SG-04, D74).
    source: [N-08, N-12, SG-04, D74]
    parent: SG-04
    allocation: [MCU, ELC, COM, GNC, PER]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL54_DescentCapPerImplement
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU: the DI IMPL_ID coding plug and IMPL_FB, an unknown implement taking the smallest entry of all rows
        (D74); GNC: the plan's implement_type (gnc spec 2.5)
      note: >-
        The MCU reads the fitted implement; the GNC takes the plan's and the perception the build setting, and
        nothing compares them (STATUS 25). The MCU's cap binds every command, so the gap is in the GNC's limits and
        the protective field. A plug that reads 0 while an implement is fitted is not detected unless the implement
        reports on IMPL_FB; the cap then takes the no-implement row (HAZ-039). The MCU reports the fitted implement
        in MCU_STATUS (implement_type), which the GNC and the perception could take instead of the plan's and the
        build setting (STATUS 25).
    status: agreed
    cards: [G2-MCU, G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: split: the unidentified implement moved to REQ-SYS-100; the plug's limitation recorded
        (RID-G1F-05, MCU-10)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: COM added: the implement also reports its type in IMPL_FB on CAN1, and the MCU reports
        it on CAN2 (ELC, section 5)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
