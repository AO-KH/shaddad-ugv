      it again.
    rationale: >-
      SG-08: no motion after a reset without a deliberate command. REQ-SYS-064, -078 and -079 cover the emergency
      stop, a returning link and a controller restart; this covers a fault stop (REQ-SYS-071), a failed self-test
      (REQ-SYS-002) and the wait of every power-up (REQ-SYS-001, D91).
