  - id: REQ-SYS-073
    function: F-15
    text: >-
      If a stop does not slow the robot, its brakes do not confirm, or it moves while it should stand still, then
      the robot shall remove its traction torque within the monitor time: 0.55 s for a stop that does not slow or
      brakes that do not confirm, 0.05 s for a speed that rises 0.1 m/s above its value at the stop's start, and
      0.25 s for motion at standstill.
    rationale: >-
      D71: the stop monitor (STOP_FAIL) is the STO backup of a soft stop (SG-05). The monitor times are the MCU
      firmware engineer's (step 4), provisional under D96 (L-1): safety.stopfail_t0 0.5, stopfail_brake_t 0.5,
      stopfail_dv 0.1 and stopfail_move_t 0.2 [EST], then bit 22 one sample later and STO 15 ms after DO0 drops
      (D71, ICD section 6). Margin: STO with the spring brakes is the backup of a failed soft stop, and in 0.55 s at
      1.40 m/s the robot moves at most 0.77 m further before the relay opens; the brakes then hold it, which STO
      alone would not on a slope (STATUS 27). It is safe for SG-05 because the backup acts within a stop distance of
      the failed stop. It is not a backup of the person stop: a soft stop that does not slow adds up to 0.66 m at
      1.2 m/s before STO, against the protective field's 0.13 m margin (REQ-SYS-029), so card G2-FSC does not count
      it as the person stop's backup, or shortens the time for a stop that does not slow to about 0.3 s (the
      functional safety engineer, step 17). The times are estimates, which the functional safety engineer checks in
      step 17 (L-1).
    source: [N-08, SG-05, D71, D96]
    parent: SG-05
    allocation: [MCU, PWR, DRV, ELC]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL49_StopNotDecelerating, testTEL50_BrakeNeverConfirms, testTEL51_MotionInStandby
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU stop monitor, STOP_FAIL bit 22, class A in maskDO0: DO0 low, and the safety chain opens STO and K3 after
        15 ms (D71; ICD section 6)
      note: >-
        The tests pass. The brake confirmation echoes the command, so a stuck brake reaches standby, and the STO
        alone cannot hold the robot on a slope (STATUS 27); the monitor runs on the same MCU (PL b at most).
    status: agreed
    cards: [G2-FSC, G1-04]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: moved to F-15; the safety chain moved to the record; a monitor time (RID-G1F-04, FSE-27,
        L-8)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the monitor times of 0.55, 0.05 and 0.25 s, provisional (MCU, Table 1; L-1)"
      - >-
        2026-11-18: part 2: ELC added: the torque removal acts through DO0 MCU_SAFETY_OK, an output stage of the
        electronics in the E-stop loop (ELC, section 5)
      - "2026-11-18: part 2, step 19: not a backup of the person stop (FSE step 17, Table 1)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
