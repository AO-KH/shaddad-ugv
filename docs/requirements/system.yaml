  - id: REQ-SYS-040
    function: F-07
    text: >-
      When a static obstacle blocks its lane for longer than 10 s, the robot shall go round it where its plan allows
      a bypass, no person was seen nor scan lost in the hold, and the bypass checks cover its implement's footprint
      (D99).
    rationale: >-
      N-01: an obstacle should not end the mission. The detour keeps to the robot's own lane, the safety bound of
      REQ-SYS-099 (SG-01, HAZ-007). The hold time is 10 s (P.gnc.obs.t_bypass, params/param_gnc.m:103), and D99 adds
      its gates (the GNC engineer, step 5). Not a safety value.
    source: [N-01, N-07, D99]
    parent: none
    allocation: [GNC, PER]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_gnc_mission testT7BypassNoTeb, testT7BypassTeb; t_perception tPER04_LocalMap, tSectorsAndObstacles
        (tPER05_TebVfh fails here only because Windows Code Integrity blocks its MEX, in the baseline)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC H2, the bypass with VFH or TEB (VC_TEB) inside the lane mask (gnc spec 4.1)
      note: >-
        The default bypass method (TEB) fails T7, while VFH passes (R-24); D99 makes VFH the default and TEB a
        development option kept out of system runs until it passes T7, while the parameters still select TEB
        (P.gnc.variant.teb = 1) until card G2-GNC; the bypass speed skips the governor (R-41); the goals do not
        match the lane (R-49). No TEB bypass with an implement that may not reverse (D74, card G2-DSC); the VFH
        bypass, forward only, stays. A bypass starts only from a ROW of a mission and never with a person in the
        field (H2). The perception cannot tell a standing person from a static obstacle, so a person who stands
        still in the lane beyond the protective field is an obstacle to the bypass (HAZ-007, for the safety
        concept). Under D99 no automatic bypass starts with the mower, or after a hold in which a person was seen or
        the scans were lost, until card G2-GNC adds the gates; a blocked lane then holds, pauses and alerts the
        operator (REQ-SYS-041).
    status: agreed
    cards: [G2-GNC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: the bypass as a mission requirement, parent none; its lane bound moved to REQ-SYS-099
        (FSE-11, GNC-13, SNS-19)
