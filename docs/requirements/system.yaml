      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-159
    kind: physical
    function: none
    text: >-
      The robot shall have traction motors each rated at least 1.0 kW and 3.18 N m continuously at 3000 rpm and 48
      V, and 9.55 N m for 30 s.
    rationale: >-
      N-08 and D95: the baseline is the 1 kW unit, the planned upgrade of the robot's four 750 W motors
      (P.drive.motor.T_cont, T_peak, params/param_drive.m:41; param_motor_unit.m:31-40 [EST]; CR-004), two per side:
      6.36 N m continuous and 19.1 N m peak per side (the drive engineer, step 9, TD-6). At 45 deg C the 750 W motor
      gives about 2.15 N m continuous, below the turn on the 20 deg slope (2.85 N m per motor), while the 1 kW unit
      keeps a margin of 1.58 on the wet-loam RMS (as-built record section 3).
    source: [N-08, N-17, D95, CR-004]
    parent: none
    allocation: [DRV]
    safety: false
    tbd: none
    verification:
      method: Analysis
      level: system
      reference: >-
        the sizing of the as-built record section 3, then the motor's data sheet (card G1-04)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the traction drive (P.drive.motor, param_motor_unit; drive spec 2.2)
      note: >-
        In the twin by default (D95); on the robot a recorded deviation until the upgrade (CR-004): its four 750 W
        Movematic motors give 2.39 N m continuous and 7.16 N m peak each (4.78 and 14.32 N m per side). The 1 kW
        unit is still to be chosen, so its values are estimates (D95).
    status: agreed
    cards: [G2-DRV, G1-04]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-135 and merged with the drive engineer's TD-6a (step 9,
        Table 5): the rating per motor
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-160
    kind: physical
    function: none
    text: >-
      The robot shall have ESC channels that each supply at least 27 A rms continuously and 65 A rms for 30 s.
    rationale: >-
      N-08 and D95: the current that the 1 kW unit needs per channel, 55 A DC (the drive engineer, step 9, TD-6 and
      finding 2; param_motor_unit.m:31-40 [EST]).
