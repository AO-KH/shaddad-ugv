      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-109
    function: F-15
    text: >-
      If its speed passes the speed it is commanded by more than 0.2 m/s, or passes 1.70 m/s, for 0.2 s, then the
      robot shall stop and park on its brakes.
    rationale: >-
      SG-01: the robot keeps its speed within what its detection zone can stop. REQ-SYS-029 and -038 set the limit;
      this is the monitor for a limit that fails or a speed that is measured wrong (HAZ-010; hazard log SF-12).
      REQ-SYS-074 keeps the downhill case under SG-05. The overspeed margins are 0.2 m/s above the commanded speed
      for 0.2 s (lim.v_follow_dv, t_persist) and 1.70 m/s (lim.v_overspeed = 1.2 x v_track_max; bit 16 (a) and (c))
      (the MCU firmware engineer, step 4), provisional under D96. Margin: 0.2 m/s is above the drives' normal
      tracking error (S1: at most 5 %, 0.07 m/s at 1.40 m/s), and it catches a runaway (HAZ-025) within 0.2 s; 1.70
      m/s is below the ESC's mechanical overspeed (1.88 m/s), and the 0.18 m/s between them holds a runaway that
      gains speed at up to about 0.67 m/s^2 over the 0.2 s persistence and the 70 ms park; a faster runaway meets
      the ESC's own overspeed stage, the last stage. The firmware has one absolute limit, not one per mode, and
      since the command never exceeds the mode's limit, the follow term bounds every mode at its limit plus 0.2 m/s.
      It is safe because a speed that runs away from its command is stopped within 0.2 s.
    source: [N-07, N-10, SG-01, SG-05, D71, D96]
    parent: SG-01
    allocation: [MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL53_RunawayParksAtOnce, testTEL56_CclZeroManualStop, testTEL57_CclZeroAutoStop (the
        OVERSPEED tests of REQ-SYS-074); planned: card G1-02 (an overspeed on level ground); t_drive
        testT19_noRegen, testT07_regen (the ESC's overspeed trip, the last stage)
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        MCU fault bit 16 OVERSPEED, class B: the 1.70 m/s limit and the speed-follow term (D71; ICD section 6)
      note: >-
        In the twin; one MCU on the encoders (PL b at most, hazard log SF-12). Where the robot's encoders are read
        is open (card G1-04).
    status: agreed
    cards: [G1-02, G2-FSC]
    history:
