  - id: REQ-SYS-081
    function: F-15
    text: >-
      If the two speed measurements of a track (the drive's speed feedback and the encoder-count speed) disagree by
      more than the mismatch limit of 0.3 m/s for 0.2 s, then the robot shall make a controlled stop and park on its
      brakes.
    rationale: >-
      The speed limits, the descent cap and the stop monitor rest on the track speeds (hazard log SF-18, SG-01). The
      mismatch limit is 0.3 m/s for 0.2 s (P.electronics.drv.enc_mismatch_v, enc_mismatch_t,
      params/param_electronics.m:60; bits 12 and 13; the MCU firmware engineer, step 4), provisional under D96
      (L-2); the ESC's FB1 speed has 1 rpm per bit (0.0005 m/s at the track) behind a 2 ms filter, so the drive's
      own error is far below it (the drive engineer, step 9, Table 2). Margin: not shown against the descent cap: a
      disagreement below 0.3 m/s goes unseen and is larger than the cap's 0.10 m/s margin, so REQ-SYS-116 applies
      the speed limits and the cap to the higher of the measurements (L-2). It is safe with REQ-SYS-116, as a
      measurement that reads low within the limit then cannot raise the true speed past the cap. Both speeds come
      from the motor encoder that the ESC reads, so the check catches a frame or computation error, not an encoder
      fault (SF-18, G1-04).
    source: [N-10, SG-01, D96]
    parent: SG-01
    allocation: [MCU, DRV, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL13_FaultBits (bits 12 and 13)
      campaign: simulation
    as_built:
      state: hardware
      where: >-
        MCU fault bits 12 and 13 ENC_L/R_MISMATCH, 0.2 s, class B (electronics spec 2.7.7; ICD section 6)
      note: >-
        The test passes. Whether the robot's encoders are read by the MCU or come over CAN is open (hazard log
        SF-18, card G1-04); the drive's fault detection is idealised (R-42).
    status: agreed
    cards: [G1-04, G2-DRV]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: moved to F-15; a mismatch limit; park on the brakes; SNS added (RID-G1F-02, RID-G1F-12,
        MCU-21, FSE-27, L-8)
