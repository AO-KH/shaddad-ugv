  - id: REQ-SYS-101
    function: F-08
    text: >-
      If its implement reports a fault, its commands stop arriving at the implement for 0.2 s, or its reports stop
      arriving for 0.4 s, then the robot shall stop its implement and keep it stopped until the operator's
      deliberate restart command (D92).
    rationale: >-
      SG-09: the blades stop outside the working modes and do not restart without a deliberate command; a faulty
      implement drive can run its blades or rotor out of control. SG-08: the implement does not start, without a
      deliberate command, when a link returns (D92). The implement ECU stops the blades when IMPL_CMD has stopped
      for P.power.impl.ecu.t_can_timeout 0.2 s (the BMS and power engineer's spec 2.7), and the MCU when IMPL_FB is
      older than P.electronics.safety.impl_timeout 0.2 s for bit 28's own persistence of 0.2 s
      (P.electronics.safety.t_persist), about 0.4 s, then sends the enable off in the next IMPL_CMD frame (the MCU
      firmware engineer, step 4; the register's re-check, step 14b). Margin: 0.2 s is 4 frame periods of 50 ms (20
      Hz); the stop starts within about 0.2 s of a lost IMPL_CMD and 0.45 s of a lost IMPL_FB, small against the
      blades' run-down of REQ-SYS-048. It is safe because the blades start to stop within 0.45 s of a lost link. The
      MCU's latch (bit 28) covers a lost IMPL_FB; a lost IMPL_CMD alone leaves the enable set, so the ECU would
      restart the blades when the frames return, and card G2-PWR adds an ECU latch, or the MCU drops the enable.
    source: [N-07, N-10, N-11, N-12, SG-08, SG-09, D92]
    parent: SG-09
    allocation: [MCU, PWR, COM]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testImplementAuxUnit (the IMPL_FAULT case: the rotor stops), testTEL13_FaultBits (bit 28);
        t_power_plant ecu_can_timeout (the reference 0 at 0.2 s after the last command frame); planned: card G1-02
        for the return of the link
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU fault bit 28 IMPL_FAULT: a fitted implement whose IMPL_FB reports a fault or is older than 0.2 s, set
        after bit 28's 0.2 s persistence, class C (implement off), latched (ICD section 6; electronics spec 2.7.12);
        the implement ECU: the speed reference 0 when the IMPL_CMD frames have stopped for t_can_timeout, then a
        braked stop (impl_ecu; power spec 2.7)
      note: >-
        The tests pass in the twin. The implement ECU has no latch: when the command frames come back with the
        enable still set, it restarts the blades without a new command; whether the MCU withdraws the enable first
        is to be checked (card G2-PWR, with the MCU firmware engineer). The mower, its drive and its frames are not
        in the as-built record (card G1-04).
    status: agreed
    cards: [G2-PWR, G1-04]
    history:
      - >-
        2026-11-17: added in step 9 from the MCU firmware engineer's N2 and the BMS and power engineer's P6-3,
        merged (steps 3 and 6)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the time-outs of 0.2 s (MCU, Table 1)"
      - >-
        2026-11-18: part 2, step 19: the lost reports take about 0.4 s (0.2 s age plus bit 28's 0.2 s persistence),
        and the frame periods corrected (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
