  - id: REQ-SYS-203
    kind: constraint
    function: none
    text: >-
      Where firmware built from the twin goes on the robot, the robot shall run it only with torque limits that
      match its fitted motors: 14.32 N m per side for the 750 W motors and 19.1 N m per side for the 1 kW units.
    rationale: >-
      N-16, N-17, D95 and CR-004: the twin's default is the 1 kW unit, a planned upgrade (D95), and no firmware
      built from the twin goes on the robot until its torque limits match the motors fitted (P.drive.motor.T_peak
      per motor option, params/param_drive.m:41) (the drive engineer's TD-7 and the MCU firmware engineer's T-MCU-4,
      steps 9 and 4). Safety under SG-05, the stricter of the two owners' views (the lead systems engineer's ruling 7; the MCU
      firmware engineer left the rating to step 17): the 1 kW limit on the 750 W robot would exceed its motors' peak
      and drive 344 N m per side through gearboxes rated 280 N m in acceleration (the 750 W option's T2B; the drive
      engineer's finding 7), and a broken gearbox loses the hold of the motors' spring brakes. Margin: none above
      the fitted motors' peak; the limit is the motors' own. It is safe because the firmware then cannot command
      more torque than the fitted drive carries.
    source: [N-16, N-17, SG-05, D95, CR-004]
    parent: SG-05
    allocation: [MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Inspection
      level: system
      reference: >-
        each firmware build record against the fitted motors (cards B-00, B-01, G2-MCU)
      campaign: bench
    as_built:
      state: not implemented
      where: >-
        the MCU's torque limits (P.electronics.drv.T_peak, from P.drive.motor)
      note: >-
        No firmware has been built for the robot (cards B-00 and B-01).
    status: agreed
    cards: [B-00, B-01, G2-MCU]
