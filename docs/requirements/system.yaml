      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-133; the structure engineer's clause on the berms and
        the beds (step 10, section 6) in the rationale and in REQ-SYS-168
      - "2026-11-18: part 2, step 19: the clause made binding in REQ-SYS-207 (the lead systems engineer's ruling 5 of step 19)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-157
    kind: physical
    function: none
    text: >-
      The robot shall exert a mean ground pressure of at most 16 kPa with any implement.
    rationale: >-
      N-01 and N-08: the soils' strength in the twin assumes about 16 kPa (Wong; structure spec 6.6). By m g / (2 b
      L) from P (structure spec 6.1): 11.3 kPa with no implement, 13.3 with the mower on its gauge wheels, 15.6 with
      the tiller and 15.9 with the full-tank sprayer (the structure engineer, step 10, section 6).
