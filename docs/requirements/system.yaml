      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-158
    kind: physical
    function: none
    text: >-
      The robot shall drive each track through two 48 V BLDC traction motors, one at the front and one at the rear
      sprocket, each through a 20:1 planetary gearbox with its own spring-applied holding brake, and through one
      dual-channel ESC per track on CAN1.
    rationale: >-
      N-17: the drive as delivered (as-built record section 3: the count, the layout and the dual ESC per side are
      [DATA], 2026-10-27; the ratio is [EST]), the baseline under D96 (the drive engineer, step 9, TD-5).
    source: [N-17, D96]
    parent: none
    allocation: [DRV]
    safety: false
    tbd: none
