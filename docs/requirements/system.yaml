        (step 4, Table 3): the 0.5 s persistence, safety under SG-04
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-148
    kind: performance
    function: F-15
    text: >-
      If its electronics pass their temperature warning limit of 70 deg C for 5 s, then the robot shall halve its
      speed limit.
    rationale: >-
      N-10 and N-13: the robot works in heat up to 45 to 50 deg C, and before the temperature stop of REQ-SYS-114
