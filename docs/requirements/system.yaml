  - id: REQ-SYS-122
    kind: performance
    function: F-04
    text: >-
      The robot shall come to a stop with every part of it and of its implement at least 0.30 m inside the boundary
      of its permitted operating zone in a greenhouse, and 0.50 m in the open.
    rationale: >-
      SG-03 and N-09: the robot stays inside its permitted zone (the functional safety engineer's FSE-13 of part 1;
      REQ-SYS-025). The margin covers the largest position error that the budget allows, or that the integrity check
      of REQ-SYS-095 can leave undetected with the drift in its detection time, plus a spare: in a greenhouse
      REQ-SYS-020's 0.25 m along the path and at the end of an outage, as a boundary can lie across the path at a
      row end, plus 0.05 m, 0.30 m (the register's re-check, step 14b; the lead systems engineer's point 10 keeps it over the
      functional safety engineer's 0.20 m, the stricter reading); in the open REQ-SYS-095's undetected error with
      the guidance share and its drift, 0.35 + 0.05 + 0.07 = 0.47 m, inside 0.50 m (the functional safety engineer,
      step 17, Table 1; the lead systems engineer's points 10 and 11). With REQ-SYS-095's bounds the drift is covered: 0.24 m in a
      greenhouse and 0.47 m in the open. Margin: 0.05 m in a greenhouse and 0.03 m in the open. It is safe because
      the stop then ends inside the zone at the largest error that the budget and the integrity check allow, with
      the robot's own stop distance inside the check (a predictive check of the footprint over the stop distance,
      card G2-GNC, which takes the kind of site from the plan's mission type).
    source: [N-09, SG-03]
    parent: SG-03
    allocation: [GNC, NAV, MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G1-02 (T16 with the robot moving at its speed toward the boundary, the stop point checked)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        the GNC geofence (gnc spec 4.1): the reference point checked 0.5 m outside the boundary for 0.2 s
      note: >-
        Today the check trips 0.5 m outside the boundary, on the reference point, so the stop can end up to 0.5 m +
        1.33 m (the stop from 1.2 m/s on the stop model of REQ-SYS-029) + 1.31 m (the deck's reach) beyond it. The
        fix, a predictive check of the footprint over the stop distance, is card G2-GNC.
    status: agreed
    cards: [G2-GNC, G1-02]
    history:
      - >-
        2026-11-18: part 2, step 13: added from the GNC engineer's TR-G1 (step 5, Table 6; 0.20 m from step 5b, the
        lead systems engineer's ruling 8)
      - >-
        2026-11-18: part 2, step 19: 0.30 m in a greenhouse and 0.50 m in the open (FSE step 17, Table 1, in the
        open; re-check 14b, the error along the path, in a greenhouse)
      - >-
        2026-11-18: part 2, step 19c: the margin with REQ-SYS-095's bounds, the drift covered (the lead systems engineer's points 10
        and 11); the note's stop on the one stop model (point 9)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-123
    kind: performance
    function: F-04
    text: >-
      When RTK GNSS is lost for 30 s while it drives a palm-grove row at 1.0 m/s, the robot shall hold its heading
      error within 2 deg at the end of the outage.
    rationale: >-
      N-09 and N-10: palm canopy and buildings cut the RTK corrections. The heading bound is S7's (architecture
      section 12, D49); T-NAV-05 (2026-11-14) gives 0.33 deg of yaw drift after 30 s with a 90 deg turn. The
      position error at the end of the outage is REQ-SYS-020's 0.25 m, which part 2's error budget sets, stricter
      than S7's 0.5 m (the sensors and navigation engineer, step 6); the safety bounds on the path are REQ-SYS-022
      and -026, and the stop on a lost position is REQ-SYS-023.
    source: [N-09, N-10, D49]
    parent: none
    allocation: [NAV, SNS]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S7 farm, wet and temp (architecture section 12)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the navigation EKF and its dead reckoning (Shaddad_NavFusion; sensors spec 7.6)
      note: >-
        S7 fails in the baseline run of 2026-11-08 (moving 3.7 m against 20 m, NEES in bound 0.41) until the three
        changes of REQ-SYS-021 (cards G2-GNC and G2-NAV); STATUS item 4 records the pause about 4 s into the outage.
        S7's position criterion is to align with REQ-SYS-020 on card G2-INT.
    status: agreed
    cards: [G2-NAV, G2-GNC, G2-INT]
