  - id: REQ-SYS-054
    function: F-09
    text: >-
      When the pack warns, at least 3 s ahead, that it will be disconnected for a cause that may wait (a low charge,
      a cell near its voltage or temperature limit, or a request to switch the high voltage off) while the robot
      moves, the robot shall stop and park on its brakes before the disconnection.
    rationale: >-
      SG-04: a loss of power on a descent must not tip the robot, so the robot stops first. It covers the
      disconnections the robot can foresee: a shutdown, a low-energy cut-off, a cell nearing its limit. A protective
      disconnection (REQ-SYS-052) does not wait for the stop. The warning time is at least 3 s for a disconnection
      that may wait: a low charge (SOC critical), a cell under-voltage after its warning, an over- or
      under-temperature, a request to switch the high voltage off; an overcurrent, a short circuit, a cell
      over-voltage, a measurement or cell-contact fault, a fuse, a charger OVP and lost MCU commands do not wait
      (the BMS and power engineer, step 7). 3 s covers the MCU's longest controlled stop: its CTRL_STOP time-out at
      the top speed, v_track_max 1.41 m/s / a_ctrlstop 1.0 m/s^2 + ctrlstop_t_extra 1 s = 2.4 s
      (params/param_electronics.m:42, 47, 122; D71). Margin: about 0.4 s (13 %) over the whole chain from the
      warning to the brakes: the warning reaches the MCU in BMS_STATE, sent every 100 ms, plus one 10 ms task
      sample; then the 2.4 s stop; then the park in the next DRV_CMD frame, the brake's 0.06 s and the ESCs' READY
      80 ms after the brake command, about 2.6 s in all; 3 s more at the UV warning (3.00 V) stays far from the 2.50
      V absolute minimum, and a cell at the OT warning (50 deg C) rises well under 0.1 K in 3 s. It is safe because
      the robot is parked before the pack opens; if the cut comes anyway, the stop is brakes-locked, which the
      descent cap keeps within the park criterion (REQ-SYS-075, D74, CR-003). Provisional under D96: the bought
      BMS's warning is unknown (G1-04). The functional safety engineer's floor of about 1.5 s (step 11) is within
      it.
    source: [N-08, N-13, SG-04, D96]
    parent: SG-04
    allocation: [BMS, MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G1-02
      campaign: simulation
    as_built:
      state: partly
      where: >-
        BMS OPENING with HV_Opening_Warn, on which the MCU stops (power spec 4.1; architecture section 10); the
        MCU's fault bit 18 HV_OPENING, class B (ICD section 6)
      note: >-
        The twin's BMS warns before it opens, but opens after at most 0.2 s (t_open_wait), before a stop from speed
        can end; the bought BMS may cut without a warning (R-15). Decided, pending: the twin changes on card G2-PWR
        (OPENING waits at most 0.2 s today, t_open_wait), with the MCU's stop on the warning on card G2-MCU (bit 18
        HV_OPENING, class B).
    status: agreed
