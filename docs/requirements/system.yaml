  - id: REQ-SYS-027
    function: F-05
    text: >-
      While it runs a mission, the robot shall follow its planned rows within 0.05 m RMS of the true path, and
      within 0.15 m at most in a greenhouse (D100) or 0.20 m in a palm grove, row entries included, and within 0.30
      m during a GNSS outage of the outage time, back within these values 5 s after the RTK fix returns.
    rationale: >-
      N-01: the mower covers its rows; N-09: the robot stays near its path. The tolerance is D100's for the
      greenhouse (S4: RMS 0.05 m and maximum 0.15 m over the whole row, its entry included, against the true path)
      and the GNC engineer's for the palm grove (step 5b, section 4: the open navigation maximum of 0.15 m plus the
      0.05 m guidance share, with the trunks about 3.5 m from the path); it is the guidance share (0.02 m RMS, 0.05
      m at most) and the navigation share of REQ-SYS-020 together, by RSS for the RMS and linearly for the maximum.
      Rows on a slope meet the row values: T-NAV-11's horizontal RMS of 0.039 m with the 0.02 m guidance share gives
      0.044 m (the lead systems engineer's ruling 4 of step 19, withdrawing ruling 9). During a GNSS outage of REQ-SYS-021's outage
      time, REQ-SYS-020's 0.25 m at the outage's end and the 0.05 m guidance share give 0.30 m, as S7 judges it, and
      the row values hold again 5 s after the RTK fix returns (the lead systems engineer's point 25). Not a safety value.
