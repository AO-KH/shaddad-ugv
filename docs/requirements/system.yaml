  - id: REQ-SYS-057
    function: F-09
    text: >-
      When it returns to its dock on a low charge, the robot shall arrive at its dock with at least SOC 0.20.
    rationale: >-
      HAZ-040: a low-energy stop on the way back can strand the robot on a slope. The return reserve is an other
      measure of that hazard, not a safety function: the safety rests on REQ-SYS-054 and -075 (SG-04). The reserve
      is SOC 0.20 (D101: at least 10 % above the 0.20 reserve; P.gnc.fsm.soc_reserve, params/param_gnc.m:121; the
      GNC engineer, step 5).
    source: [N-02, SG-04, D101]
    parent: none
    allocation: [GNC, BMS]
    safety: false
    tbd: none
    verification:
      method: Analysis
      level: system
      reference: >-
        planned: card G1-02 (the energy budget against S3); t_pack_bms soc_estimation_T11,
        eol_endurance_T13_T13b_T17 (the BMS's part)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC soc_rth = soc_reserve + E_home / E_nom, the return threshold (gnc spec 2.8)
      note: >-
        The GNC's energy per metre and the row-test energy disagree, and the end SOC at end of life is about 0.19,
        under the 0.20 reserve (R-19); S3 has never run (R-20). The SOC and SOH are the BMS's estimates;
        soc_estimation_T11 and eol_endurance_T13_T13b_T17 fail in the baseline (R-29). T12 does not verify the
        reserve on arrival, as its SOC follows a scripted ramp (DOCKED at 0.184 after a return at 0.202), so S3 must
        (D101); the energy per metre behind soc_rth (0.12 Wh/m) has no source (R-19, card G2-PWR). D97: the dock is
        the twin's in this phase, and the robot is charged by hand from its stand-alone charger under the approved
        charging procedure (D94).
    status: agreed
    cards: [G2-GNC, G2-PWR]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: the result, not the threshold; an other measure, parent none, with SG-04 kept in the
