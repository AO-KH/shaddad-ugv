    function: none
    text: >-
      The robot shall have a ground clearance of at least 0.12 m.
    rationale: >-
      N-01: palm groves have berms, and greenhouse floors are uneven (charter section 6). The value is the
      platform's (as-built record section 1, [EST]; P.structure.geom.groundClearance, params/param_structure.m:31).
      The 0.15 m irrigation berms of the palm basins and the 0.25 m greenhouse beds (D54) are higher than the
      clearance, so the missions keep the robot off them (the structure engineer, step 10, section 6; REQ-SYS-168),
      which REQ-SYS-207 makes binding.
    source: [N-01, N-17, D54]
    parent: none
    allocation: [STR]
    safety: false
    tbd: none
