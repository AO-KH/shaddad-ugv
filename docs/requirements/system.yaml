  - id: REQ-SYS-209
    function: F-08
    text: >-
      When it detects a person within the blades' protective zone while it moves with its blades running, in any
      mode, the robot shall make a controlled stop and hold until the operator's deliberate resume (D84).
    rationale: >-
      SG-09, with SG-01: the zone ahead of REQ-SYS-046 is sized with the robot's own travel until it stands, on the
      stop model of REQ-SYS-029, so the robot makes that stop in every mode while its blades run, as its own
      requirement so that each stays singular (the functional safety engineer, step 19, section 3; the lead systems engineer's point
      7). Margin: REQ-SYS-046's: from 1.2 m/s the robot travels 0.43 m before the 0.90 m AUTO stop, and the zone
      ahead needs 6.29 m against its 6.5 m (0.21 m), with RC driving held at 1.2 m/s while the blades run
      (REQ-SYS-210). It is safe because a person who walks into the zone ahead at 1.6 m/s reaches the deck only
      after the robot stands; the hold ends only on the operator's deliberate resume (D84), whose form in RC driving
      is card G2-FSC's design, for example the arm switch cycled with the sticks at neutral.
    source: [N-07, SG-01, SG-09, D84, D103]
    parent: SG-09
    allocation: [PER, SNS, GNC, MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        planned: card G1-02 with G2-FSC (a person entering the 6.5 m zone ahead while mowing, in autonomous work and
        in RC driving: the controlled stop, the robot standing before the person reaches the deck, and the hold
        until the deliberate resume)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        none: the blade zone is not detected (REQ-SYS-098), and the person stop runs only in the autonomous modes,
        on the protective field (sensors spec 3.7; D72)
      note: >-
        Decided, pending: the motion stop on a person in the blade zone, in every mode, on card G2-FSC, with cards
        G2-MCU and G2-GNC; the form of the resume in RC driving is G2-FSC's design.
    status: agreed
    cards: [G2-FSC, G2-MCU, G2-GNC, G1-02]
    history:
      - >-
        2026-11-18: part 2, step 19c: added by the lead systems engineer's point 7, on the functional safety engineer's text (step
        19, section 3); the motion stop that REQ-SYS-046 held in step 19
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-210
    function: F-08
    text: >-
      While its blades run in RC driving, the robot shall keep its speed within 1.2 m/s.
    rationale: >-
      SG-09: one zone of 6.5 m ahead (REQ-SYS-046) serves both modes only while RC driving is held at 1.2 m/s with
      the blades running; at the 1.40 m/s RC limit the zone ahead would need about 6.65 m (the functional safety
      engineer, step 19, section 3, Table 1; the lead systems engineer's point 6). 1.2 m/s lies above every work
      speed of the plan (0.5 to 1.0 m/s, REQ-SYS-125), so it costs only the RC limit's last 0.2 m/s during mowing;
      REQ-SYS-010's 1.40 m/s and REQ-SYS-119's transit speed stand, with the blades stopped. Margin: at 1.2 m/s the
      zone ahead needs 6.29 m against REQ-SYS-046's 6.5 m (0.21 m). It is safe because the robot then stands inside
      the zone before a person who walks in reaches the deck. The project owner approved this cap with part 2 on
      2026-11-18 (NASL-SHD-REQ-008 v2.0), so the 7.0 m zone ahead in RC driving is not needed.
    source: [N-04, N-07, SG-09, D103]
    parent: SG-09
    allocation: [MCU]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
