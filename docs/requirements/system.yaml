      engineer's MCU-N3 (step 3 of part 1). The 5 s persistence is P.electronics.safety.t_persist (the MCU firmware
      engineer, step 4, T-MCU-2), provisional under D96.
    source: [N-10, N-13, D96]
    parent: none
    allocation: [MCU, ELC]
