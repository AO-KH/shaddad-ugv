  # ---- technical requirements: interface ----
  - id: REQ-SYS-173
    kind: interface
    function: F-02
    text: >-
      The robot shall take the operator's commands from an SBUS receiver at 100000 baud, with 16 channels in frames
      of 14 ms, mapped as ICD section 7 gives.
    rationale: >-
      N-04: the operator drives by RC (TX16S, Mode 2). The MCU reads SBUS on USART2 at 100000 baud (the electronics
      spec's key decisions; P.electronics.sbus.baud, params/param_electronics.m:20): 16 channels in 25-byte frames,
      at the normal 14 ms frame period (P.rc.frame_period, params/param_rc.m:6; 7 ms is the receiver's high-speed
      option), with the channel map of ICD section 7 (CH12 the remote E-stop).
    source: [N-04]
    parent: none
    allocation: [COM, MCU]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        the RC chain tests and the RC row test R1; S1 (the latencies)
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        the RC link from the transmitter to SBUS (RC_Link_Sim) and the MCU's SBUS decoder (electronics spec 2.7.2)
      note: >-
        The twin's RC chain runs from the transmitter to SBUS; on the robot the firmware is not flashed (card B-01).
    status: agreed
    cards: [B-01]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-142"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-174
    kind: interface
    function: F-02
    text: >-
      The robot shall have its RC receiver set to failsafe presets of the sticks at centre, the mode switch at HOLD,
      the arm switch off and the remote stop at RUN, with the remote stop on its own 2-position switch (CH12).
    rationale: >-
      SG-08 and N-11: a receiver in failsafe must not arm or start the robot, nor latch an emergency stop (D34) (the
      electronics and comms engineer, step 8, TR-3): the presets of P.rc.failsafe_raw (params/param_rc.m:24-30) and
      ICD section 7. Margin: with these presets a failsafe output reads as a held robot even where the MCU would
      take it, while the MCU takes the mode, arm, reset and mission commands only from valid frames (REQ-SYS-011).
      It is safe because the presets are the robot's stopped state.
    source: [N-04, N-11, SG-08, D34]
    parent: SG-08
    allocation: [COM]
    safety: true
    tbd: none
    verification:
      method: Inspection
      level: system
      reference: >-
        the receiver's settings on the robot (cards G1-04, G2-COM); t_rc_link failsafe_modes
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the twin's receiver presets (P.rc.failsafe_raw)
      note: >-
        Set in the twin; the robot's receiver and its presets are not in the as-built record (card G1-04). Another
        preset on the mode switch lets the robot re-enter manual by itself after a link loss (R-35, REQ-SYS-011).
    status: agreed
    cards: [G1-04, G2-COM]
    history:
      - >-
        2026-11-18: part 2, step 13: split from the electronics and comms engineer's TR-3 (step 8, section 6): the
        presets
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-175
    kind: interface
    function: F-04
    text: >-
      The robot shall take its RTK corrections from the site's correction source and use for an RTK fixed position
      only corrections no older than 10 s.
    rationale: >-
      N-09: the RTK correction source is outside the system (the register's statement of the system). The GNSS
      receivers hold RTK fixed with corrections up to 10 s old and float up to 30 s (P.sensors.gnss.corrAgeFixLimit,
      corrAgeFloatLimit, params/param_sensors.m:82); the companion's NTRIP client reconnects after 10 s
      (P.electronics.ntrip.reconnect_t).
    source: [N-09]
    parent: none
    allocation: [SNS, CMP, COM]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        the GNSS model's correction-age tests (sensors spec section 9)
      campaign: simulation
    as_built:
      state: hardware
      where: >-
        the GNSS receivers (P.sensors.gnss) and the companion's NTRIP client (P.electronics.ntrip)
      note: >-
        The GNSS receivers and the modem are on the phase-2 mast, which is not fitted yet (as-built record section
        1).
    status: agreed
    cards: [G1-04, G2-NAV]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-147"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-176
    kind: interface
    function: F-08
    text: >-
      The robot shall exchange IMPL_CMD (0x140) and IMPL_FB (0x141, with the implement's type) every 50 ms with its
      implement on CAN1 (classic CAN 2.0B, 500 kbit/s, 11-bit identifiers), and read the implement's type from the
      coding plug on its IMPL_ID inputs.
    rationale: >-
      N-01 and N-12: the maintainer fits and changes implements. D74 reads the implement from the IMPL_ID coding
      plug (DI bits 8 and 9, P.electronics.di.impl_id0, impl_id1, params/param_electronics.m:156), and D9 commands
      the rotor over CAN (IMPL_CMD and IMPL_FB, ICD section 4), with the pump, the nozzles and the lift from the
      MCU's outputs. An unknown implement takes the most restrictive limits (REQ-SYS-100). The frames and the rates
      are ICD sections 4 and 6 (P.electronics.can.can1_bitrate, can.id.impl_cmd, can.id.impl_fb,
      params/param_electronics.m:145-148; ts.comm 0.05 s, :17; di.impl_id0 and impl_id1, :156) (the electronics and
      comms engineer, step 8, TR-8); the time-outs on both sides are REQ-SYS-101's.
    source: [N-01, N-12, D9, D74]
    parent: none
