  - id: REQ-SYS-046
    function: F-08
    text: >-
      When it detects a person within the blades' protective zone, 5.0 m from the outer edge of its deck housing on
      every side, and 6.5 m ahead of it and on the side toward which its deck sweeps while it moves, the robot shall
      stop its blades within the run-down time of REQ-SYS-048.
    rationale: >-
      SG-09: the blades stop for a person near. The stop starts at once, and the blades come to rest within the
      run-down time of REQ-SYS-048; the detection round the deck is REQ-SYS-098, which binds the 0.35 s to the start
      of the blade stop, and the motion stop that the zone ahead assumes is REQ-SYS-209. The protective zone is set
      by risk assessment (D103) by the approach-speed method of ISO 13855:2024: S = K (t_d + t_s) + C on the sides,
      and ahead plus the robot's travel until it stands, on the stop model of REQ-SYS-029 (the lead systems engineer's ruling 5a of
      step 19 and point 9): t_d = 0.35 s from a person entering the zone to the start of the blade stop
      (REQ-SYS-098; the sensors and navigation engineer's bound), K = 1.6 m/s (walking), t_s = 2.0 s (REQ-SYS-048),
      C = 1.2 m (the reach allowance for a detection plane at the ground), and the robot's travel of 0.36 s at 1.2
      m/s (0.43 m) before the 0.90 m AUTO stop. Needed: 4.96 m on the sides and the rear, and 6.29 m ahead at 1.2
      m/s. The deck's outer corner moves at up to about 1.1 m/s in the plan's turns, inside the 1.2 m/s case, so the
      side toward which the deck sweeps takes the 6.5 m (the functional safety engineer, step 19, section 3, Table
      1). In RC driving the speed is held at 1.2 m/s while the blades run (REQ-SYS-210); at 1.40 m/s the zone ahead
      would need about 6.65 m. K and C are the 2010 edition's values; not yet confirmed against ISO 13855:2024, ISO
      13857:2019 or the mower standard. Margin: 0.04 m on the sides and 0.21 m ahead; every 0.1 s of detection
      beyond 0.35 s costs 0.16 m on the sides and about 0.28 m ahead. Today's chain through the GNC and IMPL_CMD
      (0.25 s, a 0.05 s GNC step, 0.05 s to the MCU and up to 0.05 s for the next IMPL_CMD frame, 0.40 s) does not
      meet the 0.35 s (5.04 m would be needed; decided, pending on card G2-FSC). It is safe because a person who
      walks into the zone at 1.6 m/s reaches the deck only after the blades rest, and ahead only after the robot
      stands.
    source: [N-07, SG-09, D72, D103]
    parent: SG-09
    allocation: [GNC, MCU, PER, PWR, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_gnc_mission testPersonHoldMowerOff (the person in the protective field); planned: card G1-02 with G2-FSC
        (a person entering the 5.0 m zone at the side, and the 6.5 m zone ahead and on the sweep side while mowing,
        in autonomous work and in RC driving: the blades at rest within 2.0 s by REQ-SYS-048)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC implement manager, the immediate stop on person_near (gnc spec 2.9; D72); the implement ECU's braked
        stop (power spec 2.7)
      note: >-
        The test passes. As built, the person is the one in the protective field (person_near is the perception's
        protectiveStop, a lost scan included), which does not watch the sides of the deck (REQ-SYS-098); the person
        path of the blade stop is software (PL b at most; hazard log SG-09, E-06). Decided, pending: the zone's
        detection is card G2-FSC's (REQ-SYS-098), with the motion stop of REQ-SYS-209 and the RC speed of
        REQ-SYS-210; today only a person in the protective field stops the blades, and the robot only in the
        autonomous modes. The functional safety engineer confirmed the zone on the one stop model (step 19). Built
        on today's perception, which counts any return as a person, the zone would stop the blades nearly all the
        time in a greenhouse: it needs a detection that tells people from the site's fixed objects, or a blade brake
        (RID-G1-01-SAF-02, card G2-FSC).
    status: agreed
    cards: [G2-FSC, G1-02]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: the blades' reach zone, and the run-down time in place of at once; PWR added (SNS-20,
        RID-G1F-03, BMS-8)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the blades' protective zone of 5.0 m round the deck and 6.0 m ahead (FSE, Table 1)"
      - >-
        2026-11-18: part 2, step 19: the zone ahead on the one stop model, 6.5 m and 7.0 m in RC driving, with the
        motion stop in the text (re-check 14b; the lead systems engineer's ruling 5a); SNS added (the lead systems engineer's ruling 1), DRV for the
        motion stop; the planned test of the zone (re-check 14b)
      - >-
        2026-11-18: part 2, step 19c: the functional safety engineer's text: 6.5 m ahead and on the sweep side, one
        zone for both modes with the RC speed of REQ-SYS-210, and the motion stop moved to REQ-SYS-209 with DRV (the
        lead systems engineer's points 6 to 9; FSE step 19)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-047
    function: F-08
    text: >-
      While it holds, pauses, is in a fault, is in transit, has stopped for its tilt or has its deck raised, the
      robot shall keep its blades stopped.
    rationale: >-
      SG-09: the blades stop on a hold, a tip, a raised deck and outside the working modes.
    source: [N-07, SG-09]
    parent: SG-09
    allocation: [GNC, MCU, PWR]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_gnc_mission testPersonHoldMowerOff (H4); planned: card G1-02 for the tilt stop and the raised deck
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC implement manager: blades off in TRANSIT, PAUSE, FAULT and MANUAL, and after 3 s in a hold (H4; gnc spec
        2.9); the MCU's rotor gate: MANUAL or AUTO only (electronics spec 2.7.12)
      note: >-
        In a hold without a person the blades run on for 3 s (H4). A tilt stop stops the blades through the MCU's
        CTRL_STOP, and in a mission the GNC's tilt fault (G1) turns the implement off; no test shows either yet
        (planned: card G1-02). In RC driving the blades follow the implement switch (REQ-SYS-045). Nothing stops the
        blades on a raised deck (STATUS 37): a rotor interlock on the lift potentiometer is S work for card G2-MCU,
        or for the GNC on card G2-GNC.
    status: agreed
    cards: [G2-GNC, G2-MCU, G1-02]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: the tilt stop and the raised deck in the record; PWR added (MCU-11, GNC-22, BMS-8)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-048
    function: F-08
    text: >-
      When the robot stops its blades, the robot shall bring them to rest within 2.0 s.
    rationale: >-
      SG-09: the blades stop within a run-down time. 2.0 s to rest is set by risk assessment as the stricter of the
      candidates (D103): 2 s for the blade stop of robotic mowers on tilt and lift (EN 50636-2-107, the European
      form of IEC 60335-2-107, from a secondary summary), against 3 s to below 10 % (ISO 5395, which does not cover
      this mower, and the power spec's target); not yet confirmed against the mower standard that card G2-FSC
      chooses (the functional safety engineer, step 11, Table 1). To rest, not to 10 %: a blade at 10 % of its 76
      m/s tip speed still cuts (P.structure.impl.mower.w_nom 293.2 rad/s, R_blade 0.26 m). Margin: the protective
      zone of REQ-SYS-046 is sized with the full 2.0 s, and every faster stop adds margin (0.5 s less saves 0.8 m of
      zone). It is safe because a person walking in from the zone's edge reaches the deck only after the blades
      rest; a person already beside the deck is protected by the guard (ISO 13857) and the information for use, not
      by the run-down.
    source: [N-15, SG-09, D86, D103]
    parent: SG-09
    allocation: [PWR, STR]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_power_plant mower_T14 (after an E-stop); planned: card G1-02 for the run-down after a stop command; the
        unbraked run-down by analysis (the structure engineer, step 10: about 112 s to 10 % without the implement
        drive's braking)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Power_Plant implement loads, the mower drive and its speed PI, braked to a stop by the implement ECU (power
        spec 2.7, which specifies below 10 % of speed within 3 s)
      note: >-
        The twin brakes the blades with its implement drive; mower_T14 passes (below 10 % within 3.0 s after an
        E-stop, braked while K1 stays closed for 1.5 s). Not checked: the run-down after a stop command, and the
        run-down without the 48 V bus. The mower is not in the as-built record (card G1-04); the value is set by
        risk assessment (D103), and the mower standard is chosen on card G2-FSC; D86 leaves the blades' run-down to
        the safety concept (G2-FSC, E-06). Not met today: the twin brakes the blades to below 10 % within 3.0 s,
        then lets them coast once K1 opens at +1.5 s, so it meets neither the 2.0 s nor the rest; without the
        implement drive's braking the blades take about 112 s to reach 10 % (the structure engineer's finding 8.1).
        A blade brake is the likely answer (card G2-FSC, E-06, with G2-PWR), and the power spec's 3 s to below 10 %
        is to align (card G2-PWR).
    status: agreed
    cards: [G1-04, G2-PWR, G2-FSC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: the run-down's owner after D86 (G1-03)"
      - "2026-11-17: step 9: hardware: the twin specifies and checks the run-down after an E-stop (BMS-2)"
