  - id: REQ-SYS-142
    kind: performance
    function: F-12
    text: >-
      The robot shall deliver each operator input to its controller within 18 ms of the transmitter's frame.
    rationale: >-
      N-04: the RC latency is part of REQ-SYS-008's 65 ms and of REQ-SYS-009's stop (the electronics and comms
      engineer, step 8, TR-2): one 14 ms frame (P.rc.frame_period), 3 ms of SBUS bytes (25 x 120 us, sbus.t_byte)
      and the 1 ms poll (ts.base) make 18 ms, within D37's 28 ms link-to-drive budget with the 10 ms control task
      (ICD section 7). The robot's radio adds its own delay, unknown (card G1-04).
    source: [N-04, D37]
    parent: none
    allocation: [COM, MCU]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G2-COM (the decoder's output time against the transmitter's frame in the twin, RC_Link_Sim to
        the MCU's SBUS decoder); t_mcu_control testTEL24_ThrottleAndLatency and S1 (the stick-to-ESC latency and the
        frame to DRV_CMD within 30 ms, which hold the 18 ms inside them)
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        the RC link from the transmitter to SBUS (RC_Link_Sim) and the MCU's SBUS decoder (electronics spec 2.6,
        2.7.2)
      note: >-
        In the twin; the robot's radio delay is unknown (card G1-04).
