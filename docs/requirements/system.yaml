  - id: REQ-SYS-111
    function: F-15
    text: >-
      If its measured pitch or roll is wrong by more than the IMU error bound of its descent table (0.75 deg, D83),
      then the robot shall treat its IMU as failed within the detection time of 1.0 s (D104).
    rationale: >-
      SG-04: the descent table and the tilt stop rest on the measured attitude, and the table allows 0.75 deg of
      error (D83). A frozen IMU raises IMU_FAULT (D73, D85); a wrong but plausible one (a bias, a misalignment, a
      slow drift) removes the tilt stop, the descent cap and the heading together with no fault (R-05; hazard log
      F-03). An IMU treated as failed takes REQ-SYS-024, -077 and -110. The means (a second, independent attitude
      measurement) is the safety concept's (hazard log E-03). The detection time is 1.0 s (D104): the descent cap's
      hold window (lim.descent.t_hold), so that a wrong pitch cannot set the cap for more than one window (the MCU
      firmware engineer, step 4). Margin: before G2 the safety concept must show that its detection method meets 1.0
      s and that 1.0 s keeps the tilt limits (D104). It is safe as far as that showing holds; no detection exists
      today (R-05, E-03).
    source: [N-08, N-10, SG-04, D83, D85, D104]
    parent: SG-04
    allocation: [MCU, SNS, NAV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G1-02 (fault injection: an IMU bias and a slow drift beyond 0.75 deg)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        none: sens_acq_imu catches a frozen or out-of-range IMU only (D73; ICD section 6)
      note: >-
        A wrong but plausible IMU is not seen (R-05, hazard log F-03). Hazard log E-03 (class 1) is answered by the
        safety concept (card G2-FSC); card G2-NAV confirms the 0.75 deg bound with real IMU data (D83). D104 sets
        1.0 s as a RID to G1-05, not a TBD: the safety concept shows the detection method and that 1.0 s keeps the
        tilt limits (card G2-FSC, E-03, with cards G2-MCU and G2-NAV).
    status: agreed
