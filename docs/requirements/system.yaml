  - id: REQ-SYS-116
    function: F-05
    text: >-
      The robot shall apply its speed limits and its descent cap to the higher of the two speed measurements of each
      track (the drive's speed feedback and the encoder-count speed).
    rationale: >-
      SG-01, with SG-04 for the descent cap: a derived safety requirement (the lead systems engineer's ruling 2 of step 13).
      REQ-SYS-081's mismatch limit of 0.3 m/s for 0.2 s leaves a disagreement below 0.3 m/s unseen, and that is
      larger than the descent cap's 0.10 m/s margin (lim.descent.dv; the MCU firmware engineer, step 4, Table 1).
      Margin: with the higher measurement, a measurement that reads low by up to the mismatch limit cannot let the
      true speed pass a limit or the cap, which keeps its 0.10 m/s. It is safe because the limits then bind on the
      measurement that such an error cannot lower. Both measurements come from the motor encoder that the ESC reads,
      so the rule covers a frame or computation error, not an encoder fault (hazard log SF-18, card G1-04).
    source: [N-07, N-08, SG-01, SG-04, D74]
    parent: SG-01
    allocation: [MCU]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G2-MCU (a t_mcu_control case: one speed measurement held 0.25 m/s low on a descent; the speed
        limits, the cap and the trip act on the other)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        none: the MCU's speed limits and descent cap (fw_vehicle_ctrl, fw_safety_supervisor) do not use the higher
        measurement today
      note: >-
        Decided by the lead systems engineer's ruling 2 (step 13), not built: card G2-MCU. Whether the robot's encoders reach the MCU
        over CAN or directly is open (hazard log SF-18, card G1-04).
    status: agreed
    cards: [G2-MCU]
    history:
      - >-
        2026-11-18: part 2: added as a derived safety requirement by the lead systems engineer's ruling 2 (step 13), on the MCU
        firmware engineer's REQ-SYS-081 (step 4, Table 1)
      - "2026-11-18: part 2, step 19: the two speed measurements of each track named (re-check 14b)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  # ---- F-06 Sense the surroundings ----
  - id: REQ-SYS-033
    function: F-06
    text: >-
      While in an autonomous mode or the dock approach, the robot shall detect a person, of the size and posture of
      its test person (an adult standing, walking at up to 1.6 m/s, kneeling, or lying on the ground wherever the
      zone lies beyond 1.1 m from its LiDAR, with a body 0.3 m wide; and a child of about six, with a body 0.2 m
      wide and 1.1 m tall), in the zone that it or its implement is about to occupy.
    rationale: >-
      SG-01, its first part; ISO 18497-2:2024 asks for person detection on autonomous agricultural machines (N-15,
      D103). The greenhouse rule (D79) sets the level at PL d. The test person is the sensors and navigation
      engineer's (step 6, Table 1), set by risk assessment and not yet confirmed against ISO 18497-2:2024 and ISO
      18497-4:2024 (D103): a body 0.3 m wide (a cylinder of 0.3 m diameter) from the ground up to 1.0 m kneeling or
      bending, or 1.8 m standing, from the hazard log's causes (a worker kneeling, bending or with the back turned)
      and D79. The walking speed is the functional safety engineer's 1.6 m/s (ISO 13855's walking speed, step 11,
      section 3), stricter than the 1.0 m/s proposed, by L-7. Margin: 0.3 m is the narrow side of a small adult at
      the scan band, narrower than the twin's 0.5 m person, and at the field's far end (2.3 m from the LiDAR with
      the mower at 1.2 m/s in a greenhouse) it still returns about 7 of the 1 deg beams, and at the far corner of
      D108's field on open ground (about 4.8 m) about 3, against the one kept return that raises the person stop, or
      two adjacent returns within 3 m, where an isolated return is removed as dust (sensors spec 3.7). The
      functional safety engineer adds two postures (step 17, Table 1 and section 3, point 5): a person lying on the
      ground wherever the zone lies beyond 1.1 m from the LiDAR (the lowest beam is 0.54 m above the ground at the
      LiDAR's 0.5 m minimum range, so a body 0.3 m high is seen beyond about 1.1 m), and a child of about six
      (HAZ-044), a body 0.2 m wide and 1.1 m tall, which still returns about 5 of the 1 deg beams at the greenhouse
      field's far corner and 2 at D108's, against the same thresholds; the child is not yet confirmed against ISO
      18497-2 (D103). It is safe for the postures named. The project owner accepts the residual risks, with measures
      (D109): a person lying within 1.1 m of the LiDAR at a start or a resume (D84's near zone, counted as occupied
      until the operator's resume, REQ-SYS-004's warning and D79), and a person hidden in grass taller than the body
      (the operator checks the area before a mission, V-06); both go into the hazard log on card G2-FSC. If the
      child proves infeasible on the delivered LiDAR (card G1-04), it comes back to the owner as a residual risk,
      with a site rule that no child enters the work area.
    source: [N-07, N-15, SG-01, D79, D84, D103, D109]
    parent: SG-01
    allocation: [PER, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S5 (a person crossing aisle 4; its pedestrian aligned with the test person on card G2-INT); t_perception
        tPER02_ProtectiveField, tPER02b_ImplementField; planned: card G1-02 (the 0.3 m test person at the field's
        corners, lying beyond 1.1 m, and the 0.2 m child)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Shaddad_Perception, protectiveStop from the protective field (sensors spec 3.7; D72), read by the GNC as
        person_near
      note: >-
        The zone in front of the body (0.05 to 0.45 m) is not seen; D84 counts it as occupied until the operator's
        resume (REQ-SYS-039). The sides are not covered (R-02, STATUS 21, hazard log F-04); the detection is a LiDAR
        and a companion that are not safety-rated (PL b at most, hazard log E-02); no LiDAR is in the as-built
        record (card G1-04); docking has never met a dock body (R-10). The perception does not classify people: any
        return in the protective field counts as a person, so in S4 the static walls give PERSON holds (STATUS 5.2,
        5.3; R-06), and under D84 each such hold waits for the operator. The twin's FAST2D LiDAR would see a person
        lying down at any range, which is optimistic. D109: the two residual cases of the rationale are accepted
        with their measures and go into the hazard log on card G2-FSC.
    status: agreed
    cards: [G1-04, G2-FSC, G2-INT]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: written to D84, the owner's decision 2 (G1-03)"
      - "2026-11-17: step 9: the test person as a part-2 value; no classification recorded (SNS-14, SNS-15)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the test person (SNS, Table 1), walking at up to 1.6 m/s (FSE, section 3; L-7)"
      - >-
        2026-11-18: part 2, step 19: the person lying beyond 1.1 m and the child added to the test person (FSE step
        17, Table 1); D109's residual cases; GNC removed (the lead systems engineer's ruling 1 of step 19)
      - >-
        2026-11-18: part 2, step 19c: ISO 18497-2:2024 cited (the lead systems engineer's point 34); the detection thresholds and
        D108's far corner in the margin (consistency check 19b, contradiction 7)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
