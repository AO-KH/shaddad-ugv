  - id: REQ-SYS-121
    kind: performance
    function: F-03
    text: >-
      The robot shall mow the S4 greenhouse (9.6 m by 37.5 m), at least 95 % of its floor inside the coverage inset,
      within 22 min (D107).
    rationale: >-
      N-01: the customers need the work done in time (plan Table 1). D107 sets the work rate for the greenhouse, the
      S4 house within 22 min and verified by S4, while the palm grove's work rate comes with its design mission (the
      GNC engineer's TR-G7, step 5, Table 6, and step 5b). The coverage of at least 95 % of the floor inside the
      inset is S4's (architecture section 12, D100), with the 0.50 m inset of D106. The robot took 13.2 min in T8
      (2026-11-16) with the 0.40 m inset; the 0.50 m inset moves the outer lanes 0.10 m inward, and the estimate is
      recomputed when card G2-GNC changes the inset.
    source: [N-01, D100, D106, D107]
    parent: none
