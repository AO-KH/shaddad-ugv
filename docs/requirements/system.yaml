  - id: REQ-SYS-077
    function: F-15
    text: >-
      While its IMU fault is set, the robot shall allow RC driving only at or below the limp speed of D90: the lower
      of a quarter of its top speed and the descent cap's speed target (the cap less 0.10 m/s) at the 20 deg design
      slope for the fitted implement.
    rationale: >-
      SG-04: without a tilt measurement the robot cannot keep its tilt limits, so RC driving limps at a speed that
      is safe anywhere in the envelope. D85 lets the operator drive by RC at a limp speed, and D90 sets it: about
      0.35 m/s with no implement or the mower, 0.15 m/s forward and 0.10 m/s in reverse with the full-tank sprayer.
      The latch is REQ-SYS-110, and the autonomous stop REQ-SYS-024. A quarter of its top speed is the firmware's
      derate of the track speed limit, 1.41 m/s to 0.354 m/s (D90's quarter-speed derate; the MCU firmware engineer,
      step 4, section 5), and the speed target is the cap less 0.10 m/s (lim.descent.dv; structure spec 2.11), which
      gives D90's values.
    source: [N-04, N-10, SG-04, D73, D85, D90]
    parent: SG-04
    allocation: [MCU, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL46_TiltHoldOnInvalidImu, testTEL47_StuckImuFault (their expected values change with the
        latch of D85); planned: card G1-02 for the RC limp at the speeds of D90 with each implement
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        MCU fault bit 24 IMU_FAULT, class C: derate 0.25, the yaw loop off, the tilt bits held (D73; ICD section 6);
        the descent cap on its 20 deg column while the IMU is invalid (lim.descent.theta_imu; D74)
      note: >-
        RC driving limps today at about 0.35 m/s, under the cap of the 20 deg column: the speed that D90 sets. The
        latch until an operator reset with a valid IMU is REQ-SYS-110 (card G2-MCU, D85, size S). A wrong but
        plausible IMU is not caught (R-05; REQ-SYS-111). The firmware derates the track speed limit (1.41 m/s) to
        0.354 m/s, a quarter of its top speed, as the text says (the lead systems engineer's ruling 2 of step 19).
    status: agreed
    cards: [G2-MCU, G2-FSC]
