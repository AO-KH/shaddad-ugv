  - id: REQ-SYS-079
    function: F-11
    text: >-
      If its controller restarts through a watchdog reset or a brown-out, then the robot shall keep its brakes held
      and its E-stop chain not re-armed, and show the cause of the restart, until the operator's deliberate reset
      and a new arm command (D88, D91).
    rationale: >-
      SG-08: no start after a reset without a deliberate command; D88, the owner's reset policy, which D91 applies
      to every power-up, the switch-on included (REQ-SYS-001); hazard log F-01, the manual reset of the safety
      function (ISO 13849-1, IEC 60204-1).
    source: [N-11, N-12, SG-06, SG-08, D88, D91]
    parent: SG-08
    allocation: [MCU, PWR, ELC, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        t_mcu_control testTEL14_Transitions (today's reboot), testTEL34_WatchdogStall (the stall detection);
        planned: card G1-02 (T-EL-34 and S0 with the reset of D88, and a brown-out case)
      campaign: simulation
    as_built:
      state: not implemented
      where: >-
        MCU: after a reset, BOOT to SELFTEST to STANDBY, with the reset pulse DO1 sent once on every SELFTEST entry
        (D30); the reset cause read at boot from IWDG1RSTF only, as the sticky flag wdg_reset_seen in MCU_STATUS;
        the electronics plant's reset emulation (electronics spec 2.9.2)
      note: >-
        Today a restart runs BOOT to SELFTEST to STANDBY, and SELFTEST re-arms the relay with no manual action
        (hazard log F-01, STATUS 32). A watchdog reset is shown only as the information flag wdg_reset_seen in
        MCU_STATUS; a brown-out is not detected (only IWDG1RSTF is read, ICD section 6). On the robot the latches
        are cleared; in the twin they survive the emulated reset (R-36). Motion still needs an arm edge
        (REQ-SYS-003). Card G2-MCU makes it D88 with D91 (size M): the reset cause read from the IWDG, BOR and POR
        flags, no re-arm in the self-test, the cause kept until the operator's reset, and the twin's reboot of the
        companion computer and the 3-D LiDAR; the robot's safety relay must have a manual reset (card G1-04). The
        twin has no brown-out emulation (an LV dip with the BOR flag) in elp_watchdog_reset, so the brown-out case
        cannot be run; card G2-MCU adds it with the reset-cause reading (D88; the electronics and comms engineer's
        finding F5).
    status: agreed
    cards: [G2-MCU, G2-FSC, G1-04]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: written to D88, the owner's decision 15 (G1-03)"
      - >-
