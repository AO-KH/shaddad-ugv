  - id: REQ-SYS-183
    kind: constraint
    function: none
    text: >-
      The robot shall conform to the SASO Technical Regulation for Machinery Safety, Part 2: Mobile Machinery and
      Heavy Duty Equipment (TR 01-08-21-180, published 21/05/2021), with the standards its Annex 1-A adopts at the
      latest editions on SASO's site.
    rationale: >-
      N-15 and D103: the jurisdiction is the Kingdom of Saudi Arabia, and this regulation, applied through SABER, is
      the binding layer for machinery (the safety plan NASL-SHD-SAF-001 v1.4, Table 1, STD-01; the functional safety
      engineer, step 11, Table 3). With C-02 to C-07 it replaces the general constraint on the Kingdom's regulations
      drafted in step 12.
    source: [N-15, D103]
    parent: none
    allocation: [STR, ELC, COM, PWR]
    safety: false
    tbd: >-
      the tariff code, and so the regulation's coverage (HS 8433 or 8479), with card G2-FSC's classification; owner
      the project owner, through a SASO conformity body; by G1-05 (a RID)
    verification:
      method: Inspection
      level: system
      reference: >-
        the technical file against the regulation (card G2-FSC; the product certification)
      campaign: field
    as_built:
      state: unknown
      where: >-
        the technical file (not yet made)
      note: >-
        The machine's classification and its tariff code are open (card G2-FSC); product certification is a risk
        (D103).
    status: agreed
    cards: [G2-FSC]
    history:
      - "2026-11-18: part 2, step 13: added from the functional safety engineer's C-01 (step 11, Table 3)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
