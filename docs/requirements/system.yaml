  - id: REQ-SYS-069
    function: F-14
    text: >-
      If its controller stalls for longer than the watchdog time of 0.08 s (0.35 s for its slowest task), then the
      robot shall stop its motion and park on its brakes.
    rationale: >-
      SG-07: on the loss of the controller the robot stops and parks. The watchdog time is the chain that T-EL-34
      shows: a stalled task's age passes its limit after the limit plus one task period (the alive counter's rate
      transition to 1 kHz), when DO0 drops and the kick stops, and the IWDG resets the controller 0.05 s later
      (wdg.age_lim [0.02 0.06 0.2] s for Task_10, Task_50 and Task_100, wdg.timeout 0.05 s; electronics spec
      2.7.11). For the control task DO0 drops 0.03 s and the reset follows 0.08 s after a stall; for Task_50, 0.11 s
      and 0.16 s (T-EL-34: the kick stops 110 ms after a Task_50 stall, the reset 50 ms later); for the slowest task
      (Task_100, period 0.1 s), 0.30 s and 0.35 s (the register's re-check, step 14b, in place of step 4's 0.07 s
      and 0.25 s, which left out the task period). Provisional (D96). Margin: DO0 low opens the safety relay, so STO
      and the spring brakes act (category 0, D86) within 0.03 s + 15 ms of a control-task stall, before the reset;
      if the outputs freeze instead, each ESC quick-stops 0.1 s after its last command (P.drive.esc.t_can_timeout,
      10 frames of 10 ms; QUICK_STOP at 2.0 m/s^2; the drive engineer, step 9, Table 2). No test covers a Task_100
      stall: card G2-MCU adds one to T-EL-34, or lowers Task_100's age limit. It is safe because the robot stops
      either way, from the watchdog or from the ESCs' own time-out.
    source: [N-10, SG-07, D96]
    parent: SG-07
    allocation: [MCU, ELC, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL34_WatchdogStall; t_elec_plant testWatchdogResetAndDoGating; t_drive
        testT10_canTimeout; planned: card G2-MCU (a Task_100 stall case in T-EL-34)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        MCU independent watchdog (50 ms), all outputs low during a reset; the ESC command time-out into
        QUICK_STOP, then the brake (electronics spec 2.7.11, 2.9.2; drive spec 2.9)
      note: >-
        The tests pass. After the reset the robot is to wait for the operator's reset (REQ-SYS-079, D88, D91). The
        task-overrun fault cannot fire on the real controller (R-08); the robot's reset behaviour differs from the
        simulation (R-36); the controller board is still to be confirmed (R-59, card G1-04).
    status: agreed
