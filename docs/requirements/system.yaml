  - id: REQ-SYS-004
    function: F-01
    text: >-
      When the operator arms the robot for an autonomous mission, the robot shall warn the people around it by sound
      and light for the start-warning time of 3 s before it moves.
    rationale: >-
      SG-08 asks for a warning before a start; people near the robot need the time to step away. The start-warning
      time is 3 s (P.electronics.safety.auto_start_warn_t, params/param_electronics.m; the MCU firmware engineer,
      step 4). Margin: a person beside the robot needs about 1 s to notice and react and about 1.5 s to step 1.5 m
      clear at 1 m/s, which clears the deck's 1.2 m reach ahead of the body centre (D72, D81): 2.5 s, 0.5 s inside
      the 3 s. While the robot moves in AUTO the warning goes on as a beep every 2 s. It is safe because a person
      beside the robot is clear before it moves. Set by risk assessment and not yet confirmed against ISO 18497
      (D103).
