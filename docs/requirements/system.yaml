  - id: REQ-SYS-075
    function: F-15
    text: >-
      The robot shall not tip over in a brakes-locked stop, an E-stop or a loss of power anywhere in its envelope:
      the 20 deg design slope, and 18.5 deg for the full-tank sprayer (CR-001); with the tiller, the design slope
