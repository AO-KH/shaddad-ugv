  - id: REQ-SYS-140
    kind: performance
    function: F-11
    text: >-
      When the operator throws the remote E-stop switch while the robot drives at 1.2 m/s, the robot shall
      decelerate at 2.0 +/- 0.1 m/s^2 and come to rest within 0.70 m of the switch.
    rationale: >-
      SG-06 and N-06: the remote E-stop stops the robot from a distance. The values are S8b's (architecture section
      12, D33): the mean deceleration over the constant phase 2.0 +/- 0.1 m/s^2 with its 100 ms peak at most 2.4
      m/s^2, and 0.70 m from the switch (D33's replay: 0.62 m with the 92 ms worst-case latency). Margin: S8b stops
      in 0.589 m (2026-11-15), 0.11 m within the bound. It is safe because the bound includes the worst-case radio
      latency, and 2.0 m/s^2 is well within the traction of farm soil (peak traction 0.66, 6.5 m/s^2).
    source: [N-06, SG-06, D33]
    parent: SG-06
    allocation: [COM, MCU, DRV]
    safety: true
    tbd: none
