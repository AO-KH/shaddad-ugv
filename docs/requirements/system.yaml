  - id: REQ-SYS-182
    kind: interface
    function: F-14
    text: >-
      The robot shall have its RC receiver signal a lost link within 1.0 s, by its failsafe flag or by stopping its
      frames, and never hold its last channels without the frame-lost flag.
    rationale: >-
      SG-07 and N-10: the MCU detects a lost link itself 0.10 s after the last valid frame (REQ-SYS-067), as long as
      lost frames carry the flag or stop (the electronics and comms engineer, step 8, TR-3): 1.0 s is
      P.rc.rx_failsafe_time (params/param_rc.m:12), D34, ICD section 7. Margin: the MCU's own detection does not
      wait for the receiver's 1.0 s. It is safe because a receiver that held its last channels silently would defeat
      that detection, which the text forbids.
    source: [N-10, SG-07, D34]
    parent: SG-07
    allocation: [COM]
    safety: true
    tbd: none
    verification:
      method: Inspection
      level: system
      reference: >-
        the receiver's settings and data on the robot (cards G1-04, G2-COM); t_rc_link failsafe_modes;
        t_mcu_platform testTEL05_LinkLost
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the twin's receiver model (subsystems/rc; P.rc)
      note: >-
        In the twin; the robot's receiver is not in the as-built record (card G1-04).
    status: agreed
    cards: [G1-04, G2-COM]
    history:
      - >-
        2026-11-18: part 2, step 13: split from the electronics and comms engineer's TR-3 (step 8, section 6): the
        lost link
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
