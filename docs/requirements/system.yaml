      - "2026-11-18: part 2: t_drive testT19b_parkOnDescent in the verification (DRV, Table 4)"
      - >-
        2026-11-18: part 2, step 19: 0.09 s, with t_pred 0.09 s pending on card G2-MCU, provisional under D96 (FSE
        step 17, Table 1; re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
