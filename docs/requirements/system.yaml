      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-204
    kind: constraint
    function: none
    text: >-
      The robot shall keep its traction bus below 60 V DC in every state, charging included.
    rationale: >-
      SG-10 and N-13: live parts stay in the 48 V class (the BMS and power engineer, step 7, T7-4): the pack's
      maximum is 55.25 V and the charger's OVP 55.9 V (P.power.pack.V_abs_max, P.power.charger.V_ovp). Set by risk
      assessment and not yet confirmed against the standards (D103). Margin: 4.1 V between the charger's OVP and 60
      V while charging. Not met for a regen-pumped bus cut off from the pack: the 60 V DC-link clamp on each 48 V
      implement drive conducts only above 55.25 V and holds such a bus at 60 V plus Rz x I (P.power.impl.dc_clamp.BV
      60 V, Rz 0.05 Ohm), the ESCs cut regen only from 57 to 60 V and trip at 62 V (P.drive.esc.V_ov_derate,
      V_ov_fault), no brake chopper is fitted, and after an E-stop K1 opens 1.5 s after the stop while the blades
      may run down on regenerative braking for up to 3.0 s (power spec 2.5, 2.7 and section 9, O7; drive spec 2.9).
      It is safe while charging and with the pack connected. With K1 open the twin does not meet it, about 0.7 V
      over 60 V: decided, pending on card G2-PWR, with the drive engineer: a clamp that holds below 60 V at its
      rated current and above the charger's 55.9 V, or no regeneration once K1 can open (the lead systems engineer's point 12).
    source: [N-13, SG-10, D103]
    parent: SG-10
    allocation: [PWR, BMS, DRV]
    safety: true
    tbd: none
    verification:
      method: Analysis
      level: system
      reference: >-
        the pack's and the charger's maximum voltages; the inspection of the charger's OVP (card G1-04)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the pack and the charger's OVP (P.power.pack, P.power.charger; power spec 2.8)
      note: >-
        Implemented in the twin; the charger's OVP on the robot is [EST] (card G1-04). With K1 open the twin's
        regen-pumped bus reaches about 0.7 V over 60 V: decided, pending on card G2-PWR (the lead systems engineer's point 12).
    status: agreed
    cards: [G1-04, G2-PWR]
    history:
      - "2026-11-18: part 2, step 13: added from the BMS and power engineer's T7-4 (step 7, section 6)"
      - >-
        2026-11-18: part 2, step 19: the regen case with the pack cut off, not shown, an open safety value; DRV for
        the regen; the state partly (re-check 14b)
      - >-
        2026-11-18: part 2, step 19c: the twin 0.7 V over with K1 open, the fix pending on card G2-PWR in place of
        the open safety value (the lead systems engineer's point 12)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-205
    kind: constraint
    function: none
    text: >-
      The robot shall keep every safety component of its electronics (the safety relay, the controller's safety
      inputs and outputs, the STO inputs) within its rated ambient temperature in the hot case of REQ-SYS-164, with
      its enclosure temperature stop (REQ-SYS-114) below the lowest such rating.
    rationale: >-
      SG-06 and N-13: the parts of the E-stop chain must work in the heat of the sites (the electronics and comms
      engineer, step 8, TR-7 and finding F3, proposed as safety for the functional safety engineer to judge; parent
      SG-06 by the integration engineer, as every part named is in the E-stop chain). The twin's box air is 55.3 deg
      C at 50 deg C ambient with the fans (electronics spec 2.9.4), against a typical 55 deg C rating of compact
      safety relays (to be confirmed for the delivered relay, card G1-04). Margin: not met with the assumed relay:
      about -0.3 K against a 55 deg C relay on the twin's box air, and about -1.5 K on the stricter plain-box
      reading of 56.5 deg C (electronics spec 2.9.4; the box's area is settled on card G2-VAL), and the stop of
      REQ-SYS-114 at 80 deg C lies 25 K above that rating, while REQ-SYS-165 asks for no thermal stop at 50 deg C
      ambient, where the box air is 55.3 deg C; so REQ-SYS-205, -114 and -165 cannot all hold with such a relay (the
      register's re-check, step 14b; the functional safety engineer, step 17, section 3, point 8). The ways out are
      parts rated for at least the 80 deg C stop, the relay and the STO interface placed outside the box in shaded
      air, cooling, or the stop below the lowest rating with REQ-SYS-165 relaxed: an open safety value for the
      owner, decided on card G1-04 once the delivered relay's rating and place are known; the lead systems engineer recommends parts
      rated for the 80 deg C stop or the relay and the STO interface placed outside the box, as both keep the
      mission in the heat (the lead systems engineer's point 1). It is safe only once the delivered relay's rating and place are
      known and one of these holds.
    source: [N-06, N-13, SG-06]
    parent: SG-06
    allocation: [ELC, PWR, DRV]
    safety: true
    tbd: none
    verification:
      method: Inspection
      level: system
      reference: >-
        the delivered safety relay's and STO inputs' ratings and places against the enclosure's temperature (cards
        G1-04, G2-FSC)
      campaign: field
    as_built:
      state: unknown
      where: >-
        the electronics enclosure and the safety relay (not in the as-built record)
      note: >-
        The delivered relay's rating and place are unknown (card G1-04).
    status: agreed
    cards: [G1-04, G2-FSC]
    history:
      - "2026-11-18: part 2, step 13: added from the electronics and comms engineer's TR-7 (step 8, section 6)"
      - >-
        2026-11-18: part 2, step 19: the margin recorded as not met, an open safety value for the lead systems engineer and the owner
        (re-check 14b; FSE step 17); DRV added for the STO inputs (review RID-G1T-08)
      - >-
        2026-11-18: part 2, step 19c: the plain-box figure of -1.5 K (the lead systems engineer's point 13) and the open mark for the
        owner on card G1-04 (point 1)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
