  - id: REQ-SYS-097
    function: F-05
    text: >-
      The robot shall be able to climb and descend the slopes of its envelope on farm soil at a mean ground speed of
      no less than 0.30 m/s on the 20 deg design slope with no implement or the mower (deck down), and, with the
      full-tank sprayer on 18.5 deg (CR-001), no less than 0.40 m/s climbing and 0.05 m/s descending.
    rationale: >-
      N-08: work on slopes within the envelope (charter section 3, CR-001). S2 checks the climb and the descent of
      the 20 deg ramp; on a descent the speed stays within the descent cap (REQ-SYS-030). The values come from the
      design's own limits, as no stakeholder figure exists (the structure engineer, step 10, section 3; L-4, which
      takes option a for the sprayer's descent): the GNC slope governor allows 0.5 m/s at 20 deg (P.gnc.spd.pitch_v,
      params/param_gnc.m), and a 20 deg climb on farm soil slips about 9 % (T7: 9.31 %), so the ground speed is
      about 0.455 m/s; the drive does not limit it (3.43 N m per side, within 6.36 N m continuous; the drive
      engineer, step 9, Table 2). The descent cap gives no implement and the mower at least 1.10 m/s on the 20 deg
      ramp, and the full-tank sprayer 0.15 m/s on 18.5 deg in the twin (S2d), which falls to 0.05 m/s when the IMU
      reads 0.75 deg high within D83's bound: option a holds at that bound. The value is 0.30 m/s with no implement
      or the mower (the lead systems engineer's point 17, on the structure engineer's evidence), so that it holds where the governor
      reads the ramp high: at D83's 0.75 deg IMU bound its pitch table gives 0.425 m/s, about 0.385 m/s on farm
      soil, and descending, the braked settle of +0.78 deg takes it to 0.42 m/s, 0.35 m/s with the IMU bound, 0.05
      m/s above the value. Moving the governor's 0.5 m/s breakpoint above the ramp's measured pitch, to reach 0.40
      m/s, stays an option for card G2-GNC. Not a safety value.
    source: [N-08, CR-001, D83]
    parent: none
    allocation: [DRV, STR, MCU, GNC]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
