  - id: REQ-SYS-155
    kind: physical
    function: none
    text: >-
      The robot shall have a mass and a centre of gravity of at most 226 kg and 0.267 m above the track bottom with
      no implement, 291 kg and 0.241 m with the mower, 311 kg and 0.276 m with the tiller, and 316 kg and 0.375 m
      with the sprayer and a full 40 L tank.
    rationale: >-
      SG-04 and N-08: the descent table (D74, D83), the tip-over checks (REQ-SYS-075) and the sprayer's 18.5 deg
      limit (CR-001) were derived for these masses (P.structure.mp.m0 per configuration, params/param_structure.m):
      220 kg as delivered [DATA] plus 6 kg for the 1 kW motor units of D95, the mower 65 kg [EST], and the sprayer
      50 kg dry with its 40 L tank [EST]. Margin: the margins are in the analyses that use the masses (the full-tank
      sprayer keeps about 0.06 m/s within the park criterion at 0.75 deg, D83). It is safe because a heavier robot
      needs the descent table derived again, so the masses are its bound. The heights of the centre of gravity and
      the tiller's mass are the structure engineer's (step 10, section 6; P.structure.mp,
      params/param_structure.m:35-99).
    source: [N-08, N-17, SG-04, D95, CR-001]
    parent: SG-04
    allocation: [STR]
    safety: true
    tbd: none
    verification:
      method: Inspection
      level: system
      reference: >-
        the robot weighed with each implement (card G1-04); the twin's mass table (structure spec 6.2)
      campaign: field
    as_built:
      state: hardware
      where: >-
        the mass table (P.structure.mass.components, P.structure.mp; structure spec 6.2)
      note: >-
        The robot's 220 kg is the spec sheet's, and the implements' masses are estimates (card G1-04). With the
        as-built 750 W motors the robot is 220 kg, below the bound, but its centre of gravity with no implement is
        0.268 m, 1.3 mm above the 0.267 m bound (P.structure.mp.rcg0, motor_movematic750; structure spec 6.3), about
        0.1 deg off the static tip angles, inside every margin. The bound stays, as D95 makes the 1 kW robot the
        baseline; the descent table and the t_drive runs for the 750 W robot are pending on cards G2-STR and G2-DRV,
        to be done before the robot moves on its 750 W motors with firmware built from the twin (D95's flashing
        condition) (the lead systems engineer's point 24).
    status: agreed
    cards: [G1-04, G2-STR, G2-DRV]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-132 and merged with the structure engineer's mass and
        centre of gravity (step 10, section 6)
      - >-
        2026-11-18: part 2, step 19: the 750 W robot's centre of gravity, 1.3 mm above the bound, in the note
        (re-check 14b)
      - >-
        2026-11-18: part 2, step 19c: the 750 W robot's 1.3 mm recorded, its runs pending on cards G2-STR and G2-DRV
        (the lead systems engineer's point 24)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-156
