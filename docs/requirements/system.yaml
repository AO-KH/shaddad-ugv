      where: >-
        the RC chain and CH12, the MCU's ESTOP decel (electronics spec 2.7.4)
      note: >-
        S8b passes in the twin (mean 2.069 m/s^2, peak 2.189 m/s^2, 0.589 m; 2026-11-15). Not on the robot yet: the
        firmware generated from the twin is not flashed (card B-01). The values change if a certified wireless
