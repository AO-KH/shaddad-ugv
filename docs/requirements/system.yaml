      - >-
        2026-11-17: step 9: a clearance kept by the body and the implement, as a part-2 value; 0.40 m on today's
        geometry; the compiler's test named; SG-01 in the source (RID-G1F-08, RID-G1F-13, GNC-4, GNC-19, FSE-28)
