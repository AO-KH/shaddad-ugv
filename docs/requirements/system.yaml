  - id: REQ-SYS-070
    function: F-14
    text: >-
      If a drive stops reporting to the controller for longer than the feedback time-out of 50 ms, then the robot
      shall stop its motion and park on its brakes.
    rationale: >-
      SG-07: the robot stops and parks when it loses control of a drive. The feedback time-out is 50 ms
      (P.electronics.safety.drv_timeout 0.05, params/param_electronics.m:95: the FB1 or FB3 age; ICD section 6;
