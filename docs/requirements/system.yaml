# The system functional requirements, REQ-SYS-001 onward (card G1-01 part 1, steps 2 and 9; part 2, step 13:
# REQ-SYS-115 to -117 added; steps 19 and 19c: REQ-SYS-207 to -210 added). A functional requirement added after
# the technical ones were numbered takes the next free number above them, so that the technical IDs are not
# renumbered again (part 2, step 19; check_register.py, rule 2).
requirements:
  # ---- F-01 Manage the modes and the arm state ----
  - id: REQ-SYS-001
    function: F-01
    text: >-
      When the robot is switched on, the robot shall complete its self-test and then wait with its drives disabled,
      its brakes engaged and its implement off until the operator's deliberate reset and a new arm command (D91).
    rationale: >-
      SG-08 and N-11: no motion, no brake release and no implement start at power-up without a deliberate command.
      D91 applies the reset policy of D88 to every power-up, since the controller cannot tell a deep brown-out from
      a switch-on; it replaces the automatic re-arm at the self-test of D30.
    source: [N-11, SG-08, D88, D91]
    parent: SG-08
    allocation: [MCU, PWR, DRV, BMS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
