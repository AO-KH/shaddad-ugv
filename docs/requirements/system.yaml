  - id: REQ-SYS-207
    function: F-13
    text: >-
      When it plans a mission, the robot shall keep its footprint off every step higher than its ground clearance
      (REQ-SYS-156, 0.12 m), such as the 0.15 m irrigation berms of the palm basins and the 0.25 m greenhouse beds
      (REQ-SYS-168), on every segment, turn and transit.
    rationale: >-
      N-01: a step higher than the ground clearance grounds the body. REQ-SYS-156 and -168 record the clause, and
      this requirement makes it binding (the lead systems engineer's ruling 5 of step 19). Today the compiler keeps the footprint
      cov.clear_min (0.15 m) from the world's boxes and cylinders, and the raised beds are boxes of class 5; it
