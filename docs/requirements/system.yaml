  # ---- F-10 Dock and charge ----
  - id: REQ-SYS-058
    function: F-10
    text: >-
      When it returns to its dock, the robot shall approach the dock contacts along its dock segment at no more than
      0.2 m/s.
    rationale: >-
      N-03: dock without help; HAZ-013: a slow approach limits a crush between the robot and the dock (SG-01). The
      docking speed is 0.2 m/s (P.gnc.spd.v_dock, params/param_gnc.m:32; the GNC engineer, step 5). Margin, on the
      stop model of REQ-SYS-029: at 0.2 m/s the stop takes 0.2 x 0.36 + 0.07 = 0.14 m, and the protective field
      reaches 0.5 + 0.8 x 0.2 = 0.66 m, so 0.52 m is spare; the energy is 0.5 x 291 kg x 0.2^2 = 5.8 J with the
      mower, which limits a crush against the dock (HAZ-013). It is safe because the robot stops well inside the
      zone that it sees. The docked check is REQ-SYS-117, and the contact speed of 0.05 m/s REQ-SYS-177: 0.2 m/s is
      the approach speed.
    source: [N-03, SG-01, D97]
    parent: SG-01
    allocation: [GNC, CMP, PWR, NAV, PER]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        planned: card G1-02 (no scenario docks against a dock body, R-10)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC R3 and R4: the dock approach at 0.2 m/s, DOCKED at the end of the segment (gnc spec 4.1)
      note: >-
        Docking is unsupervised and has never met a dock body; on the robot it will stop short of the dock or push
        against it (R-10), as the dock body enters the protective field. The stuck check needs a 0.3 m/s command,
        above the 0.2 m/s docking speed, so it never fires at the dock; the obstacle stop is off in the approach
        (REQ-SYS-036); the approach ends with an in-place trim that has no time-out (R-10). The dock is not in the
        as-built record (card G1-04). D97: the dock is the twin's in this phase, F-10 is verified in the twin, and
        the robot is charged by hand from its stand-alone charger under the approved charging procedure (D94). The
        dock mask for the protective field is card G2-GNC, with the sensors and navigation engineer.
    status: agreed
    cards: [G2-GNC, G1-04]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: NAV and PER added; the gaps at the dock recorded (SNS-O2, GNC-24)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the docking speed of 0.2 m/s; the docked check split to REQ-SYS-117 (GNC, Table 1); the
        twin's dock in the note (D97)
      - >-
        2026-11-18: part 2, step 19: the approach speed, with the contact speed in REQ-SYS-177 (review RID-G1T-07;
        re-check 14b); the margin on the one stop model (the lead systems engineer's ruling 5a)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-059
    function: F-10
    text: >-
      While it stands on its dock, the robot shall charge its pack to its full level, the charger's 54.6 V with the
      current below 2 A (an SOC of 0.97 or more), within the charge window of REQ-SYS-060.
    rationale: >-
      N-02 and N-03: charge without help, and start the next day full. The full level is the CC-CV end at 54.6 V
      (4.20 V per cell) with the current below 2 A for 60 s, an SOC of 0.97 or more (P.power.bms.charge_done,
      params/param_power.m:200; the CV P.power.charger.cccv_V, 174-176; T-PWR-09's end criterion) (the BMS and power
      engineer, step 7). The top-up is REQ-SYS-208, split so that each stays singular (re-check 14b). Under D97 the
      dock is the twin's; on the robot the charge is a step of the approved charging procedure (D94, D97). Not a
      safety value.
    source: [N-02, N-03, D94, D97, D101]
    parent: none
    allocation: [BMS, PWR, MCU]
    safety: false
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_pack_bms cccv_T09, hot_charge_T10b_dock_air (passes: 0.10 to 0.95 within 3.6 h at 50 deg C with dock air),
        mode_manager_table
      campaign: simulation
    as_built:
      state: partly
      where: >-
        BMS CHARGING and CHARGE_DONE with the dock contactor K4; the Dock_Charger (power spec 2.8, 4.1); the charge
        starts only on the MCU's request (Charge_Enable_Req: key on, dock present and STANDBY; mcu_mode_manager.m)
      note: >-
        After charging the BMS never tops up on the dock (R-46; REQ-SYS-208); cccv_T09 fails on stale expectations
        of the former pack (R-29); the robot's charger is a stand-alone 54.6 V, 20 A unit, not a dock (the as-built
        record, section 2). D97: the dock is the twin's in this phase; the robot is charged by hand.
    status: agreed
    cards: [G2-PWR, G1-04]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: the full level as a part-2 value; MCU added; the passing charge test named (RID-G1F-02,
        BMS-11)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the full level and the top-up band (BMS, section 3); the twin's dock in the note (D97)"
      - "2026-11-18: part 2, step 19: the top-up split to REQ-SYS-208 so that each stays singular (re-check 14b)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-060
    function: F-10
    text: >-
      While it charges, the robot shall keep the charge current within the limit of its cell temperature: none with
      the hottest cell above 45 deg C or the coldest below 10 deg C, at most 20 A in between, and a charge started
      only with the hottest cell at 40 deg C or less (D94).
    rationale: >-
      SG-10: the pack shall not overheat or overcharge when it charges at 45 to 50 deg C. D94 sets the window: a
      charge starts at 40 deg C or less and stops above 45 deg C, 10 K below the supplier's 55 deg C label; the cold
      end of 10 deg C is the twin's [EST] table, which allows 20 A only from 10 deg C (P.power.bms.chg.I_cool,
      params/param_power.m:191), and the fixed 20 A charger can only be cut (D94, D96) (the BMS and power engineer,
      step 7). Margin: the 10 K covers the gap between the hottest measured cell and the hottest real cell in the
      sealed box, the NTC's error (+/-0.5 K offset and 0.3 K noise in the twin) and the charge's own heat (about 6 W
      at 20 A, a slow rise); 20 A is 0.32C, a third of the cells' standard charge (63 A per pack), and the cold end
      keeps it out of the [EST] plating range. It is safe because the cells are charged only inside their
      temperature window; on the robot the window is the approved charging procedure, which earns no PL credit, so
      the BMS cut-off stays the safety function (SF-17). Provisional (D96).
    source: [N-13, SG-10, D94, D96]
    parent: SG-10
    allocation: [BMS, PWR]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_pack_bms hot_charge_T10, hot_charge_T10b_dock_air, hot_charge_T10c_no_dock_air
      campaign: simulation
    as_built:
      state: partly
      where: >-
        BMS hot-charge table and charge current management (D45; power spec 2.9)
      note: >-
        T-PWR-10 and 10c fail in the baseline; the twin cools the pack with a fan path and dock air that the sealed
        real pack does not have (R-04); the bought BMS's charge limits are unknown (R-15). Today's limit is the NMC
        table: 30 A up to 40 deg C, 15 A at 45 deg C and 0 from 50 deg C; D45's table is the former LFP pack's. The
        robot's charger gives a fixed 20 A, and the BMS cannot lower it, so above about 43 deg C (hottest cell) the
        charge can only be cut, not reduced (the as-built record, R-15). D94 sets the window; the twin's table and
        mode manager change on card G2-PWR (decided, pending), and today it charges up to 50 deg C, with no start
        condition. D97: the robot is charged by hand from its stand-alone charger.
    status: agreed
