  - id: REQ-SYS-055
    function: F-09
    text: >-
      When the robot switches on its high voltage, the robot shall bring the bus up with a precharge current of at
      most 10 A and at most 2 A^2s through its main contactor at closing, and report HV ready within 1.0 s of the
      request (D98).
    rationale: >-
      SG-10: no short or overheating in the power path; R-09 names the inrush and the precharge energy. D98 sets
      limits that fit any hardware: at most 10 A of precharge current (D98: 10 A for the twin's K2, with the
      component's data under card G1-04), at most 2 A^2s through the main contactor when it closes, and HV ready
      within 1.0 s (the BMS and power engineer, step 7). Margin: the twin's D98 design (7.5 Ohm) peaks at 7.3 A at
      the pack's 54.6 V, 27 % below the 10 A; 2 A^2s is about 5 times the 0.4 A^2s of a close at 97 % (C dV^2/2R
      with 5.5 mF and about 18 mOhm), and it holds a close at about 93.4 % of the pack voltage or above (a step of
      up to 6.7 %, power spec 2.4), which the settled-bus test of D98 keeps; HV is ready in 0.60 s today (T-PWR-03)
      and 0.5 s (S0). It is safe because the current and the I^2t limits keep K2 and K1 within their ratings, so
      neither welds, and a welded contactor could not disconnect the pack (SG-10). Provisional until the ESC data
      arrive (G1-04, D96).
    source: [N-12, N-13, SG-10, D96, D98]
    parent: SG-10
    allocation: [BMS, PWR, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_power_plant precharge_T03, precharge_fail_T03b; t_pack_bms precharge_bench (T-PWR-03.g, K2 latency within
        30 ms); tests/requirements/power/T-PWR-03.feature; S0 (HV ready within 1.0 s)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        BMS PRECHARGE and CLOSE_MAIN (power spec 4.1); the PDU precharge resistor
      note: >-
        With the ESC's standby load, precharge cannot complete at 22 Ohm, and every scenario hides it with a 4.7 Ohm
        override (R-09, STATUS 10); with 4.7 Ohm a shorted bus puts 850 J into the resistor. precharge_T03 runs on
        the 5.5 mF bench without the ESC's standby load, which is why it passes. D98 sets the limits; the twin moves
        to about 7 to 8 Ohm with a settled-bus test and an early short check, and the 4.7 Ohm override goes
        (decided; the twin changes on card G2-PWR).
    status: agreed
    cards: [G2-PWR, H-07]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: step 9: the bench test added; review decision 8 named in the note (BMS-16, RID-G1F-10, FSE-25)"
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the precharge limits of D98 (BMS, section 3)"
      - "2026-11-18: part 2, step 19: the 10 A sourced to D98, and the close at 93.4 % or above (re-check 14b)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-056
    function: F-09
    text: >-
      When its charge falls to its return threshold during a mission that the operator has not paused, the robot
