  - id: REQ-SYS-141
    kind: performance
    function: F-12
    text: >-
      The robot shall keep its RC link, with no gap between valid frames longer than its link time-out, anywhere
      within 100 m of the operator in line of sight.
    rationale: >-
      N-04 and N-10: the operator drives and supervises from the field's edge (the electronics and comms engineer,
      step 8, TR-1). 100 m is a design target from the R1 row field (6 rows of 50 m at 3 m spacing with 6 m
      headlands, params/param_rowtest.m:11; its farthest point about 70 m from the field's edge), a margin of 1.4;
      the link time-out is 0.10 s (P.electronics.sbus.link_timeout, params/param_electronics.m:21). Not a safety
      value: the reaction to a lost link is REQ-SYS-067.
    source: [N-04, N-10]
    parent: none
    allocation: [COM]
    safety: false
    tbd: >-
      the RC link's range inside a greenhouse, by a range test with the robot's own RC equipment; owner the
