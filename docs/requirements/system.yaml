      where: >-
        GNC mission manager, G1: outside the site boundary grown by fsm.geofence_margin 0.5 m for fsm.t_geofence 0.2
        s, into FAULT, in a mission, a hold and a return (gnc spec 4.1); the MCU's CTRL_STOP and park on the GNC's
