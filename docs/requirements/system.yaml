  - id: REQ-SYS-066
    function: F-11
    text: >-
      When the operator gives the remote emergency stop, the robot shall stop its motion and its implement
      independently of its software.
    rationale: >-
      SG-06 and N-06: an emergency stop from a distance acts independently of the software, as the stop on the robot
