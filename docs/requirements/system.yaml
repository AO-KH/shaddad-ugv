        600 s corrected (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-146
    kind: performance
    function: F-15
    text: >-
      When it parks after a stop, the robot shall have both spring brakes engaged within 0.5 s of the park request,
      with its torque limits held until both brakes confirm.
    rationale: >-
      SG-05 and N-08, N-11: every stop ends held on the brakes, with no roll while it parks. D71 parks with the
      torque limits held until both brakes confirm, and the stop monitor trips STOP_FAIL (bit 22, the STO backup)
      when the brakes do not confirm within 0.5 s of the park request (P.electronics.safety.stopfail_brake_t,
      params/param_electronics.m:126, [EST]). Margin: in S6a the brakes held 0.04 to 0.07 s after the park request
      (2026-11-15), 0.43 s within the bound. It is safe because the drive holds zero speed with its limits until the
      brakes confirm, so the robot does not roll in the interval (D71).
    source: [N-08, N-11, SG-05, D71]
    parent: SG-05
    allocation: [MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S2b (parked within 1.1 s of CTRL_STOP, both brakes engaged); S6a and S6b (the park); the STOP_FAIL tests of
        t_mcu_control
      campaign: simulation
    as_built:
      state: hardware
      where: >-
        the MCU's parking phase and stop monitor (fw_safety_supervisor; electronics spec 2.7.10) and the ESCs' park
        (drive spec 2.9)
      note: >-
        The twin parks as D71 says: S2b passes, and in S6a the brakes held at 21.72 to 21.75 s after the park
        request at 21.68 s (2026-11-15). On the robot the ESCs' park and brake confirmation are unknown (R-14, card
        G1-04). The brake confirmation echoes the command today (F-02), so 'until both brakes confirm' rests on no
        real confirmation yet (the functional safety engineer, step 17; STATUS 27).
    status: agreed
    cards: [G1-04, G2-MCU]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-120"
      - "2026-11-18: part 2, step 19: the echoed brake confirmation in the note (FSE step 17)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-147
    kind: performance
    function: F-15
    text: >-
      If its tilt passes its warning limit of 25 deg for 0.5 s, then the robot shall halve its speed limit.
    rationale: >-
      SG-04 and N-08: the robot slows before its tilt stop at 28 deg (REQ-SYS-076), so that the operator can turn
      away from a steep face. The values are the MCU's TILT_WARN (bit 14, class C): 25 deg for 0.5 s and half speed
      (P.electronics.safety.tilt_warn, t_tilt, derate_tilt, params/param_electronics.m:94-100), 25 deg being the 20
      deg design slope plus about 1 deg of body pitch and the residual estimate error (D47) (the MCU firmware
      engineer, step 4, T-MCU-1). Margin: 3 deg below the 28 deg stop and 4 deg above the design envelope. It is
      safe because the derate halves the speed, and with it the energy of a stop, before the tilt reaches the stop
      limit.
    source: [N-08, SG-04, D47]
    parent: SG-04
    allocation: [MCU, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_mcu_control testTEL33_Tilt, testTiltGateAndDerate, testTEL13_FaultBits (bit 14); T-EL-33 (TILT_WARN at 25
        +/- 1 deg)
      campaign: simulation
    as_built:
      state: implemented
      where: >-
        the MCU safety supervisor, bit 14 TILT_WARN class C (ICD section 6)
      note: >-
        Implemented in the twin, with the IMU level calibration of 2026-10-27. Not on the robot yet (card B-01). One
        IMU and one MCU (PL b at most, card G2-FSC).
    status: agreed
    cards: [B-01, G2-FSC]
    history:
