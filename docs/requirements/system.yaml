  # ---- F-11 Stop in an emergency and reset ----
  - id: REQ-SYS-063
    function: F-11
    text: >-
      When an E-stop button on the robot is pressed, the robot shall remove its traction torque within the STO time
      of 50 ms and engage its spring brakes (stop category 0, D86), and stop its implement, independently of its
      software.
    rationale: >-
      SG-06: an emergency stop stops the motion and the implement independently of the software (ISO 13850, N-15).
      D86: stop category 0 for traction, as built; the descent cap keeps every such stop within the park criterion
      (CR-003). The STO time is at most 50 ms, provisional under D96 until the delivered relay's and ESCs' times
      come with card G1-04 (the functional safety engineer, step 17, Table 1, in place of the 20 ms of step 13): the
      BMS and power engineer's 50 ms leaves 30 ms for the delivered relay's release and the ESCs' STO reaction (step
      7), while 20 ms left only 3 ms over the twin's own chain and bought 3.6 cm. Margin: the twin removes the
      torque within about 17 ms of the edge (P.power.safety.t_relay_off 0.015 s, the 1 ms logic and the ESC's 1 ms;
      params/param_power.m:177), 33 ms inside the limit; 50 ms is 0.06 m of travel at 1.2 m/s, and against 20 ms it
      adds 0.036 m to S8a's 0.20 m stop, inside the 0.6 m of REQ-SYS-139, the criterion that matters: the delivered
      chain may take up to about 0.3 s before 0.6 m is reached. It is safe because the stop stays within the bound
      of REQ-SYS-139.
    source: [N-06, N-15, SG-06, D8, D80, D86, D96]
    parent: SG-06
    allocation: [PWR, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S8a (STO within 50 ms of the edge, the twin checked at 20 ms; the stop within 0.6 m from 1.2 m/s);
        t_power_plant estop_T04; t_drive testT09_sto; the implement stop judged against REQ-SYS-048 (at rest within
        2.0 s), with t_power_plant mower_T14 as today's check (the blades below 10 % within 3.0 s after the E-stop),
        pending on cards G2-FSC and G2-PWR
      campaign: simulation
    as_built:
      state: hardware
      where: >-
        Power_Plant Safety_Chain (the SR latch, its immediate contacts to STO and K3; power spec 2.5; architecture
        section 10), which the electronics only monitor through their inputs (electronics spec 2.9.1); the implement
        ECU's reference 0 on Safety_OK; K3 on the 24 V implement rail; the delayed contacts open K1 and K2 after
        t_cat1 1.5 s (power spec 2.5, 2.7)
      note: >-
        S8a passes, and the twin stops traction as category 0, as D86 requires. The owner confirms E-stop buttons
        and a safety relay with STO wiring (D80), but their parts, category and wiring are not recorded (card
        G1-04); the power spec's category-1 claim is corrected in its revision C (D86; power spec 2.5 and 9, O4).
        The blades are braked under power: the 48 V implement feed stays on until the delayed contacts open K1 at
        +1.5 s, and K3 cuts only the 24 V implement rail at once; cutting the 48 V at once would leave the blades to
        coast. estop_T04 checks the chain's timing, not the stop; D86 adds the stopping check in part 2. The value
        is provisional (D96): the delivered relay's and ESCs' times come with card G1-04.
    status: agreed
    cards: [G1-04, G2-FSC, G2-PWR]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: written to D86, the owner's decision 9 (G1-03)"
      - >-
        2026-11-17: step 9: stop the implement, not cut its power; the STO time as a part-2 value (BMS-1,
        RID-G1F-03)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - >-
        2026-11-18: part 2: the STO time of 20 ms, the stricter of the co-owners' values (BMS, section 3; DRV, Table
        2; L-7)
      - >-
        2026-11-18: part 2: ELC removed and the place corrected: Safety_Chain_HW is not built, the chain is the
        power domain's (ELC, section 5); the note on the power spec's revision C (BMS, section 3)
      - >-
        2026-11-18: part 2, step 19: the STO time of at most 50 ms, bounded by REQ-SYS-139's 0.6 m, provisional (FSE
        step 17, Table 1); the implement stop judged against REQ-SYS-048 (re-check 14b)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-064
    function: F-11
    text: >-
      When an emergency stop has acted, the robot shall stay stopped until the E-stop is released, a deliberate
      reset is made from a place where the operator can see the zone round the robot, and a new arm command is
      given.
    rationale: >-
      SG-06: keep the motion and the implement stopped until a deliberate reset and a new arm command (ISO 13850,
      N-15). Every emergency stop ends this way: the buttons and the bumper on the robot and the operator's remote
      stop (REQ-SYS-063, -065, -066). The manual reset of ISO 13849-1 is made where the operator can see that nobody
      is in the danger zone.
    source: [N-06, N-11, N-15, SG-06, D30, D88, D91]
    parent: SG-06
    allocation: [PWR, MCU, ELC, COM]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S8a (no restart before the release, the reset and the re-arm); t_power_plant rearm_powerup,
        rearm_button_before_do0, rearm_blocked_by_estop; t_power_plant estop_T04 (the release does not re-close K1;
        a reset and a new HV request restore HV); t_pack_bms mode_manager_table
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Safety_Chain SR latch with the reset pulse; the MCU's ESTOP reset guard (D30; electronics spec 2.7.3)
      note: >-
        The relay is re-armed by the MCU's reset pulse, on RC CH9 over the radio and once on every SELFTEST entry,
        so the reset is not a manual one (hazard log F-01, STATUS 32). D88 and D91 remove the re-arm at every
        power-up (card G2-MCU, size M); whether a reset over the radio, from wherever the transmitter is, meets the
        place of the reset is for the safety concept (G2-FSC). The BMS adds a second latch: after a Safety_OK drop,
        the high voltage returns only on a new HV request edge. After a release and a reset the MCU may go to FAULT
        on the ESC undervoltage (STATUS 9, to re-check). The reset that re-arms the relay is the DI RESET_BTN or RC
        CH9, with the DO1 pulse on every reset_req edge (ICD section 6): the button and the pulse are the
        electronics', CH9 the link's (the electronics and comms engineer's finding F2, for card G2-FSC with G2-MCU).
    status: agreed
    cards: [G2-FSC, G2-MCU]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - "2026-11-17: decision 15 settled by D88 (G1-03)"
      - >-
        2026-11-17: step 9: the place of the reset; the end condition of every emergency stop (FSE-18, BMS-18, L-1,
        D91)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: ELC and COM added: the reset button, the DO1 pulse and RC CH9 (ELC, section 5)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
