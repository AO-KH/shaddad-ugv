      When it is switched on, the robot shall finish its self-test and show its state within 2 s.
    rationale: >-
      N-05 and N-11: after a switch-on the operator sees at once whether the robot came up, before the reset of D91.
      The value is the self-test time-out (P.electronics.safety.selftest_timeout 2.0 s, params/param_electronics.m;
      STANDBY at selftest_t 1.0 s today, FAULT under D91) and S0's 1.5 s (architecture section 12, which changes
      with D91) (the MCU firmware engineer, step 4, T-MCU-5). Not a safety value: the wait for the operator's reset
      is REQ-SYS-001.
