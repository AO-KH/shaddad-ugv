  - id: REQ-SYS-108
    function: F-14
    text: >-
      If the pack's reports stop arriving for longer than the report time-out of 0.5 s, then the robot shall make a
      controlled stop and park on its brakes.
    rationale: >-
      SG-04 and SG-10: the stop before a disconnection (REQ-SYS-054) and the pack current limits (REQ-SYS-053) rest
      on the pack's reports; without them the robot can neither keep the pack's limits nor see a disconnection
      coming, and the pack can open under a moving robot (HAZ-040). It stops as it does for its other lost links
      (SG-07). The report time-out is 0.5 s (P.electronics.safety.bms_timeout 0.5, bit 9; the MCU firmware engineer,
      step 4), 5 frame periods at 10 Hz, provisional under D96: the bought BMS's frames and rates are unknown
      (R-15). Margin: from 1.40 m/s the robot moves 0.7 m before the controlled stop starts, with the last DCL and
      CCL held, and the BMS protects its cells itself (REQ-SYS-052) and opens when the MCU's commands stop
      (t_pack_bms mcu_cmd_timeout). It is safe because the pack keeps its own protections while the robot stops.
    source: [N-08, N-10, N-13, SG-04, SG-10, D65, D96]
    parent: SG-04
    allocation: [MCU, BMS, COM, DRV]
