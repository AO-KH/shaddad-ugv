# Shaddad UGV: the system requirements register (NASL-EMS-HBK-001 section 7.2; template
# framework/templates/requirements_register.yaml).
# Card G1-01, part 1: the functional requirements of the system. Part 2 (2026-11-18) added the technical
# requirements and closed the values of part 1.
# The specification NASL-SHD-REQ-008 is generated from this file. IDs are never reused: a deleted requirement
# keeps its ID with the status "deleted".
domain: SYS
owner: the lead systems engineer
updated: 2026-11-18
# 2026-11-18, after the step-20 build: the role named in full ("the lead systems engineer") in the
# rationale, notes and history of 34 requirements; two folder paths as work/team/; the TBD form of REQ-SYS-164
# and -172 ([TBD], owner and date in tbd). No value or meaning changed (the technical writer's step-20 points).
# 2026-11-18, step 22: the project owner approved part 2 (NASL-SHD-REQ-008 v2.0 and the baseline). Every
# requirement is agreed, with the approval in its history; REQ-SYS-075 and -089 are narrowed (D111), and the
# full-sun operating rule is in the notes of REQ-SYS-162 and -164 (D112).
document: NASL-SHD-REQ-008
system: >-
  The Shaddad UGV as built (2026-10-27 onward), as the twin represents it: the XMachines tracked platform with its
  pack, motors, ESCs, spring brakes, controller and electronics; the MCU and BMS firmware and the companion
  software; the sensors; the implements of this phase; the operator's RC transmitter and console; and its
  stand-alone charger, with the twin's dock (D97: the robot has no dock in this phase). Outside the system: the
  people and the site, the RTK correction source, and the twin's own tools.
phase: >-
  This phase: mowing in greenhouses and palm groves; transit, docking and charging; RC driving, autonomous
  missions, the E-stop chain and every safety function (charter NASL-SHD-CHR-001 v1.3, Table 2). The functions of
  tillage and spraying missions come in a later phase (cards G2-TIL, G2-SPR). The functions that serve every
  implement (knowing which one is fitted, keeping its limits) are in.

# The stakeholder needs: plan NASL-SHD-PMP-001 Table 1 and charter NASL-SHD-CHR-001 v1.3, itemised.
# traced_in: "part 1" (functional requirements trace to it) or "part 2" (technical requirements and the plan do).
needs:
  - id: N-01
    stakeholder: farm, greenhouse and palm-grove customers
    need: >-
      Mow the rows of a greenhouse aisle or a palm grove with no operator at the controls, the deck lowered,
      turning at the row ends.
    source: >-
      charter section 6 (normal use); plan Table 1 (customers); the operations table of NASL-SHD-ANR-003
      chapter 1
    traced_in: part 1
  - id: N-02
    stakeholder: farm, greenhouse and palm-grove customers
    need: >-
      Finish a mowing mission on one charge, and go back to the dock to charge when the energy runs low.
    source: charter goal 4 and section 6 (abnormal use, low energy); plan Table 1 (customers)
    traced_in: part 1
  - id: N-03
    stakeholder: farm, greenhouse and palm-grove customers
    need: >-
      Move between the work areas and the dock on planned paths, and dock and charge without help.
    source: charter Table 2 (transit, docking and charging) and section 6 (normal use)
    traced_in: part 1
  - id: N-04
    stakeholder: operators in the field
    need: >-
      Drive the robot by remote control: it moves only as commanded, stops when the sticks are let go, and keeps
      the speed limit of RC driving.
    source: plan Table 1 (operators); SG-11; NASL-SHD-TP-001, TP-002
    traced_in: part 1
  - id: N-05
    stakeholder: operators in the field; the supervisor
    need: >-
      Start, hold, resume and stop a mission, and see the robot's mode, its progress, its holds and its faults
      with their causes.
    source: charter section 5; plan Table 1 (operators, clear holds, stops and recovery)
    traced_in: part 1
  - id: N-06
    stakeholder: operators in the field
    need: >-
      Stop the robot at once, from the robot or from a distance, independently of its software, and start it again
      only by a deliberate reset and re-arm.
    source: SG-06; charter section 6 (abnormal use, the E-stop with reset and re-arm); scenario S8
    traced_in: part 1
  - id: N-07
    stakeholder: people nearby (workers in the greenhouse or grove)
    need: >-
      Not be struck, run over or cut: the robot stops for a person in its way and holds until the way is seen
      clear.
    source: charter section 5 (people nearby); SG-01, SG-02, SG-09; D79 (the greenhouse rule)
    traced_in: part 1
  - id: N-08
    stakeholder: operators in the field; the project owner
    need: >-
      Work on slopes within the envelope without tipping over, stop and hold on the brakes anywhere in it, and
      never run away downhill.
    source: charter goal 3; SG-04, SG-05; CR-001, CR-003
    traced_in: part 1
  - id: N-09
    stakeholder: operators in the field; people nearby; the project owner
    need: >-
      The robot stays in its permitted area and near its planned path, and stops when it cannot tell where it
      is.
    source: SG-03
    traced_in: part 1
  - id: N-10
    stakeholder: operators in the field; people nearby
    need: >-
      React safely to lost links and faults: a lost RC link, lost GNSS, a lost companion or controller, a sensor
      fault.
    source: charter section 6 (abnormal use); SG-07; scenarios S6, S7
    traced_in: part 1
  - id: N-11
    stakeholder: operators in the field; maintainers
    need: >-
      The robot never moves, releases its brakes or starts its implement unexpectedly: not at power-up, after a
      reset, when a link returns or during maintenance.
    source: SG-08
    traced_in: part 1
  - id: N-12
    stakeholder: maintainers
    need: >-
      Charge the pack, fit and change implements, and inspect the brakes, tracks and sensors safely, with the
      energy isolated, and get faults that name their cause.
    source: plan Table 1 (maintainers); charter section 5; SG-08; NASL-SHD-MAN-001; NASL-SHD-TP-003
    traced_in: part 1
  - id: N-13
    stakeholder: the project owner; regulators
    need: >-
      The pack stays safe in operation, charging and storage, in heat up to 45 to 50 deg C, and live parts stay
      out of reach.
    source: SG-10; plan Table 1 (regulators)
    traced_in: part 1
  - id: N-14
    stakeholder: the supervisor (the project owner on the project)
    need: >-
      Plan the missions of a site, and check their results afterwards.
    source: charter section 5 (the supervisor plans the missions and checks the results); plan Table 1
    traced_in: part 1
  - id: N-15
    stakeholder: regulators and standards
    need: >-
      Meet the safety standards for highly automated agricultural machines, safety-related control parts and
      mowers.
    source: plan Table 1; the safety plan NASL-SHD-SAF-001 v1.4, Table 1, and the standards below (D103); SG-12
    traced_in: part 1 (through the safety goals) and part 2 (the standards with their editions)
  - id: N-16
    stakeholder: the project owner
    need: >-
      A twin of the robot as built, with the owner's decided upgrade (D95), verified against its requirements,
      whose generated firmware runs on the robot's controller.
    source: charter goals 1, 2 and 5 (v1.4, CR-004); plan Table 1 (the project owner)
    traced_in: part 2 (and the plan; a project need, not a function of the robot)
  - id: N-17
    stakeholder: the supplier (XMachines)
    need: >-
      The robot's platform, ESC, BMS and controller are used as delivered.
    source: plan Table 1 (the supplier); docs/hardware/real_robot_components.md
    traced_in: part 2 (a constraint)

# The system functions (the functional architecture, top level), from the operating concept (charter section 6),
# the architecture (NASL-SHD-CON-001) and the safety goals.
functions:
  - id: F-01
    name: Manage the modes and the arm state
    scope: >-
      Power-up, standby, armed, RC, autonomous, hold, fault and E-stop, and the charging and maintenance states;
      the transitions and what each mode allows.
  - id: F-02
    name: Drive by remote control
    scope: >-
      The RC commands to motion, the RC speed limit, the stop when the sticks are let go, the RC switches.
  - id: F-03
    name: Run missions
    scope: >-
      Take a mission from the companion and run its rows, turns, transit and docking; start, hold, resume, abort
      and finish; report the progress.
  - id: F-04
    name: Know where the robot is
    scope: >-
      Localisation from GNSS, IMU, odometry and scan matching; the validity of the estimate; the permitted
      zone; the stop when the position cannot be shown.
  - id: F-05
    name: Move along the path
    scope: >-
      Follow the path, turn at the row ends, govern the speed (by mode, implement, slope and the descent cap),
      control the tracks.
  - id: F-06
    name: Sense the surroundings
    scope: >-
      Obstacles, and people: in the zone that the robot or its implement is about to occupy, the near zone of the
      body included, and round the blades.
  - id: F-07
    name: Hold and avoid
    scope: >-
      Stop and hold for a person, go round a static obstacle, resume when the zone has been seen free.
  - id: F-08
    name: Work the implement
    scope: >-
      Know which implement is fitted and its limits; raise and lower the deck; start and stop the blades with
      their interlocks; the implement in a hold.
  - id: F-09
    name: Manage the energy
    scope: >-
      Monitor and protect the pack; switch the high voltage on and off (precharge); feed the low-voltage rails;
      derate on warnings; return to the dock on low energy.
  - id: F-10
    name: Dock and charge
    scope: Approach the dock, dock, charge, undock.
  - id: F-11
    name: Stop in an emergency and reset
    scope: >-
      The emergency stops on the robot and from the operator, the bumper and the E-stop chain; staying stopped
      until a deliberate reset and a new arm command; no unexpected start after a fault reset, a returning link
      or a restart of the controller.
  - id: F-12
    name: Communicate and record
    scope: >-
      The CAN networks, the RC link and the companion link; the operator's console and telemetry; the event and
      fault records; the mission logs.
  # F-13 added by the integration engineer in step 2 (G1-01 part 1): N-14 (the supervisor plans the missions)
  # and the planning limits (D53, D54, CR-001) had no function; F-03 runs a plan but does not make one.
  - id: F-13
    name: Plan the missions
    scope: >-
      Compile a site's mission from its boundary, rows and dock: the lanes, the turns at the lane ends, the
      transits and the dock approach, within the permitted zone and the slope limits of the fitted implement.
  # F-14 and F-15 split from F-11 by the integration engineer in step 9 (G1-01 part 1): F-11 keeps the emergency
  # stops and the reset, F-14 takes the lost links, and F-15 the other stops and the stability on slopes.
  - id: F-14
    name: Respond to lost links
    scope: >-
      The stop and the park on the brakes when the operator's RC link, the companion's commands, the controller,
      a drive's reports or the pack's reports are lost.
  - id: F-15
    name: Stop and hold, and stay stable on slopes
    scope: >-
      The stops on faults and their park on the brakes; the stop monitor; the overspeed and runaway monitors; the
      tilt stop; the IMU's faults and the RC limp; no tip-over in the envelope; the roll-back at a hill start;
      the stuck stop and the electronics' temperature stop.

# Allocation: the components of Shaddad_System and the plant domains (docs/architecture.md sections 4 and 5).
allocation_codes:
  MCU: "the MCU firmware, Shaddad_MCU: modes, safety supervisor, vehicle control, IO, CAN codecs, telemetry"
  BMS: "the BMS firmware, Shaddad_BMS"
  PWR: "the power hardware: pack, PDU and contactors, precharge, LV rails, the safety chain (E-stop, safety relay, STO wiring), implement power, the dock charger"
  DRV: "the drive: motors, ESCs, gearboxes, spring brakes"
  STR: "the structure: body, tracks, the implements' mechanics"
  ELC: "the electronics hardware: the front end, the actuators, the watchdog reset"
  COM: "communications: CAN1, CAN2, the RC link from the transmitter to SBUS, the operator console"
  SNS: "the sensors: IMU, RTK GNSS, 2-D and 3-D LiDAR, odometry"
  NAV: "the navigation fusion, Shaddad_NavFusion"
  PER: "the perception, Shaddad_Perception"
  GNC: "guidance and the mission, Shaddad_GNC: mission manager, path, trackers, speed governor, avoidance, implement manager"
  CMP: "the companion, Shaddad_Companion: mission planning and the companion's side of its links"

# The safety goals: the top-level safety requirements (hazard log NASL-SHD-HAZ-001 v1.2, accepted by the owner
# on 2026-11-16, D80). Copied word for word, the safe states included (step 9); the hazard log is their source
# and owner.
safety_goals:
  - id: SG-01
    text: >-
      The robot shall detect a person in the zone that it or its implement is about to occupy, in every
      autonomous mode and in the dock approach, and stop before contact; it shall keep its speed within what that
      detection zone can stop.
    safe_state: standstill on the brakes, implement off, holding while the person is in the zone
    pl: d
    hazards: [HAZ-001, HAZ-002, HAZ-003, HAZ-004, HAZ-007, HAZ-010, HAZ-013, HAZ-045]
    status_in_hazard_log: not met
  - id: SG-02
    text: >-
      After a person stop the robot shall move off, or restart its implement, only when the zone it will occupy,
      the near zone of the body included, has been seen free.
    safe_state: hold on the brakes, implement off
    pl: d
    hazards: [HAZ-005]
    status_in_hazard_log: not met
  - id: SG-03
    text: >-
      The robot shall stay inside its permitted operating zone and within a bounded distance of its planned path,
      and stop when it cannot show where it is.
    safe_state: standstill on the brakes, mission paused
    pl: d
    hazards: [HAZ-008, HAZ-009]
    status_in_hazard_log: not met
  - id: SG-04
    text: >-
      No brakes-locked stop, E-stop or loss of power shall tip the robot over within its envelope (the 20 deg
      design slope; the full-tank sprayer to about 18.5 deg, CR-001), and the robot shall not pass its tilt
      limits.
    safe_state: standstill on the brakes below the tip speed; at the tilt limit, a stop
    pl: d
    hazards: [HAZ-017, HAZ-018, HAZ-019, HAZ-023, HAZ-038, HAZ-039, HAZ-040]
    status_in_hazard_log: not met
  - id: SG-05
    text: >-
      Every stop shall end with the robot held on its brakes on any slope of the envelope, and the robot shall
      not gain speed downhill beyond the speed of its mode.
    safe_state: standstill on the brakes, torque off
    pl: d
    hazards: [HAZ-024, HAZ-025, HAZ-027, HAZ-040]
    status_in_hazard_log: not met
  - id: SG-06
    text: >-
      An emergency stop, from the robot or from the operator's remote stop, shall stop the motion and the
      implement independently of the software, and keep them stopped until a deliberate reset and a new arm
      command.
    safe_state: STO, spring brakes engaged, implement power off, latched
    pl: d
    hazards: [HAZ-021, HAZ-022]
    status_in_hazard_log: partly met
  - id: SG-07
    text: >-
      On the loss of the operator's link, of the companion's commands or of the controller, the robot shall stop
      and park.
    safe_state: standstill on the brakes, torque off
    pl: d
    hazards: [HAZ-012, HAZ-016, HAZ-043]
    status_in_hazard_log: not met
  - id: SG-08
    text: >-
      The robot shall not move, release its brakes or start its implement at power-up, after a reset, when a link
      returns or during maintenance, without a deliberate command and a warning; maintenance shall be done with
      the energy isolated.
    safe_state: standstill on the brakes, torque off, implement off
    pl: d
    hazards: [HAZ-011, HAZ-026, HAZ-032, HAZ-034, HAZ-037]
    status_in_hazard_log: not met
  - id: SG-09
    text: >-
      The blades shall not run where a person can reach them: they shall stop on an E-stop, a person near, a
      hold, a tip, a raised deck and outside the working modes, within a run-down time that the mower standard
      sets, and shall not restart without a deliberate command.
    safe_state: blades stopped, implement power off
    pl: d
    hazards: [HAZ-006, HAZ-020, HAZ-033]
    status_in_hazard_log: not met
  - id: SG-10
    text: >-
      The pack shall not overheat, overcharge or short in operation, charging or storage at 45 to 50 deg C, and
      live parts shall be protected against contact and short circuit.
    safe_state: contactors open, charging stopped
    pl: d
    hazards: [HAZ-028, HAZ-029, HAZ-030]
    status_in_hazard_log: unknown
  - id: SG-11
    text: >-
      In RC driving the robot shall move only as the operator commands, stop when the operator lets go of the
      sticks, and keep the speed limit of RC driving.
    safe_state: standstill on the brakes
    pl: d
    hazards: [HAZ-014, HAZ-015]
    status_in_hazard_log: not met
  - id: SG-12
    text: >-
      Hot surfaces, noise, the charger's mains, manual handling and recovery, thrown objects and foreseeable
      misuse shall be reduced by the design, guards and the information for use, to the standards that G1-01
      names.
    safe_state: not applicable
    pl: n/a
    hazards: [HAZ-031, HAZ-035, HAZ-036, HAZ-041, HAZ-042, HAZ-044]
    status_in_hazard_log: open

