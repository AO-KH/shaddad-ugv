  - id: REQ-SYS-170
    kind: environment
    function: none
    text: >-
      The robot shall work greenhouse rows whose ends leave a headland of 3.0 m or more, with the mower fitted.
    rationale: >-
      N-01: the lane-end turns need room (the GNC engineer, step 5, TR-G6): the turn radius of 0.81 m, the deck's
      1.20 m reach ahead of the reference point and the turn clearance of REQ-SYS-088, 1.1 m at 0.5 m/s, make 3.11
      m, so a 3.0 m headland needs the turn at about 0.37 m/s or less (a 1.0 m clearance), which the lead systems engineer's ruling 3
      leaves to card G2-GNC's design (pending; the lead systems engineer's point 29). The S4 house is to be checked against it, as
      the end-wall holds of STATUS 18 suggest that it is shorter (the GNC engineer's finding 9.8).
    source: [N-01]
    parent: none
    allocation: [CMP, GNC, STR]
    safety: false
