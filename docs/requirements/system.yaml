  - id: REQ-SYS-149
    kind: performance
    function: F-15
    text: >-
      The robot shall have, in every configuration that may move, a static tip-over angle at least 20 deg above the
      slope of its envelope, forward, rearward and laterally.
    rationale: >-
      SG-04 and N-08 (the structure engineer, step 10, section 6, and step 19). The tip angles are judged on the
      sharp-edge track end, the floor that structure spec 2.11 takes (the stricter reading; the lead systems engineer's point 2). The
      tightest cases that may move are the full-tank sprayer facing uphill (38.2 deg at 18.5 deg: a margin of 19.7
      deg, climbing as REQ-SYS-129 allows; 40.4 deg on the model geometry), the sprayer forward (38.7 deg: 20.2
      deg), the sprayer laterally to the contact line (38.7 deg at 15 deg: 23.7 deg) and no implement forward (47.4
      deg at 20 deg: 27.4 deg) (structure spec 6.3). Two exclusions: the raised tiller, outside this phase (D76,
      card G2-TIL; facing uphill it tips backward at 16.4 deg static and 11.8 deg with the sharp-edge track end (the
      climbing torque lowers it further, not yet quantified)), and the raised mower deck (D81). The mower's
      deck-down value of 75.7 deg needs both gauge wheels on the ground; with a wheel lifted it is 25.4 deg (20.7
      deg with the sharp edge), which is not shown to stay out of the envelope: evidence that both wheels stay down
      over the basins and berms, or a measure, is pending on card G2-STR (the lead systems engineer's point 23), and the descent
      table's mower rows rest on the same assumption. Margin: not met by 0.3 deg for the full-tank sprayer facing
      uphill (19.7 deg against the 20 deg bound), an open mark for the owner: it is re-checked with the weighed
      masses on card G1-04, and if it still falls short, the owner chooses on card G2-SPR, on the functional safety
      engineer's advice, between an 18.0 deg cap in CR-001 and accepting 19.7 deg (the lead systems engineer's point 2). Every other
      configuration that may move keeps at least 20.2 deg. For those it is safe because the 20 deg covers the pitch
      that a brakes-locked stop adds, whose own criterion, the peak pitch within half the rotation to the static tip
      (D82 (b)), is REQ-SYS-075's.
    source: [N-08, SG-04, D76, D81, D82, CR-001]
    parent: SG-04
    allocation: [STR]
    safety: true
    tbd: none
    verification:
      method: Analysis
      level: system
      reference: >-
        the static tip-over table of structure spec 6.3; t_structure T3_static_pitch_implements
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the mass properties and the geometry (P.structure.mp, P.structure.geom; structure spec 6.2, 6.3)
      note: >-
        The values rest on the estimated masses and centres of gravity of the implements and of the 1 kW units (D95)
        until the robot is weighed (card G1-04). Not met on the sharp-edge floor by 0.3 deg for the full-tank
        sprayer facing uphill, a RID for G1-05, re-checked on card G1-04 (the lead systems engineer's point 2); the deck-down mower
        with a lifted gauge wheel is not shown (card G2-STR), and the functional safety engineer adds the cause to
        the tip-over hazard on card G2-FSC.
    status: agreed
