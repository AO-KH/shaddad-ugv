  - id: REQ-SYS-150
    kind: performance
    function: none
    text: >-
      The robot shall run its MCU firmware with every task within its period and at most 50 % of the controller's
      CPU time and 50 % of its flash (1 MB on the STM32H743 development target).
    rationale: >-
      N-16 and charter goal 5: the firmware generated from the twin runs on the robot's controller. The build plan's
      acceptance of T17 sets the CPU load below 50 % at 480 MHz and the flash below 1 MB
      (P.electronics.target.cpu_load_max, flash_max, params/param_electronics.m:324-325), which leaves room for the
      tasks' worst cases and for later functions. Provisional under D96 until card G1-04 names the controller board:
      the supplier's board is the baseline, and the H743 the development target (as-built record section 4, open
      item 5).
    source: [N-16, D96]
