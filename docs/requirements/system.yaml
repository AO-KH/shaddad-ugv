        the S2 family (S2, S2b, S2c, S2d; the criteria of D100); t_structure T7 and T8_parking; the slope brake test
        on the robot (card T-04)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the track-soil contact and the speed governor on slopes (structure spec 2.11; gnc spec 2.5)
      note: >-
        The twin climbs the 20 deg ramp on farm soil (S2, with the speed shortfall of REQ-SYS-097); the other soils
        are not run on the ramp, and the contact data are estimates until the slope brake test (T-04).
    status: agreed
    cards: [T-04, G2-TIL]
    history:
