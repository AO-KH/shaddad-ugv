  - id: REQ-SYS-131
    kind: performance
    function: F-06
    text: >-
      The robot shall detect its test person (REQ-SYS-033) anywhere in its protective field at every speed up to its
      autonomous limit of 1.2 m/s: from the front of its body or fitted implement to 0.5 m + 0.8 s x |v| beyond it,
      and on open ground (palm groves and transits) ahead of it to at least 3.4 m at 1.0 m/s and 4.0 m at 1.2 m/s
      (D108), over a width of 1.08 m, ahead of it and, below 0.1 m/s, behind it; the near zone of D84 aside.
    rationale: >-
      SG-01 and N-07 (the sensors and navigation engineer, step 6, TR-SN2). The field's far corner lies 2.3 m from
      the LiDAR with the mower at 1.2 m/s in a greenhouse, and about 4.8 m on open ground with D108's 4.0 m (1.20 +
      4.0 - 0.45 m), so the detection needs a range of at least 4.8 m on the test person (card G1-04's LiDAR), a
      horizontal field of view of +/-80 deg ahead and 360 deg at standstill, and the body seen between 0.5 m and 1.0
      m above the ground (P.sensors.per.protL0, protKv, protW, protXF, protXR; P.electronics.lim.v_max_auto 1.2
      m/s). Margin: the 0.3 m body returns about 7 of the 1 deg beams at 2.3 m and about 3 at 4.8 m, and the 0.2 m
      child 5 and 2, against the one kept return that raises the person stop, or two adjacent returns within 3 m,
      where an isolated return is removed as dust (sensors spec 3.7). It is safe because the person stop then starts
      for a person anywhere in the field that the stop analysis of REQ-SYS-038 sizes. D108 (the project owner, on
      the functional safety engineer's step 17, section 3, point 5): for a person walking head-on, the field ahead
      on open ground grows to about 3.0 to 3.4 m at 1.0 m/s and 3.6 to 4.0 m at 1.2 m/s, of which the text takes the
      upper ends, the stricter reading; in a greenhouse the residual risk is accepted under D79. D108's ranges rest
      on an ideal stop of 1.2 s from 1.2 m/s (0.42 + 0.72 + 1.6 x (0.35 + 1.2) = 3.62 m); the AUTO stop of the stop
      model of REQ-SYS-029 takes 1.9 s to rest, which card G2-FSC counts when it designs the field. The width covers
      the mower's 1.05 m with 0.015 m a side, which is thin (the functional safety engineer, step 17).
    source: [N-07, SG-01, D72, D84, D108]
    parent: SG-01
    allocation: [PER, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_perception tPER02_ProtectiveField, tPER02b_ImplementField; planned: card G1-02 (the 0.3 m test person at
        the field's corners, ahead and behind); planned: S5's head-on case (D108, card G2-INT)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Shaddad_Perception's protective field (sensors spec 3.7, 7.8); the LiDAR model (3.4, 7.5)
      note: >-
        In the twin the FAST2D LiDAR sees its band at every range from 0.5 m to 40 m, all round. No LiDAR is in the
        as-built record, so its mount, its view past the body and its range on a 0.3 m body wait for card G1-04.
        Decided, pending: the field ahead on open ground of D108 on cards G2-FSC and G2-GNC; today the field is 0.5
        m + 0.8 s x |v| on every site (P.sensors.per.protL0 0.5, protKv 0.8), which covers a standing or crossing
        person, not one walking toward the robot: about 3.6 m would be needed for a walker at 1.6 m/s against the
        robot at 1.2 m/s (0.35 s chain, 1.0 m/s^2; REQ-SYS-038's analysis on card G1-02, with G2-FSC). Card G2-FSC
        sizes the field on the one stop model with a stated contact-speed criterion; if that needs more than D108's
        range, it goes back to the owner as an amendment of D108 (the lead systems engineer's point 14).
    status: agreed
    cards: [G1-04, G2-NAV, G1-02, G2-FSC, G2-GNC, G2-INT]
    history:
      - "2026-11-18: part 2, step 13: added from the sensors and navigation engineer's TR-SN2 (step 6, section 7)"
      - >-
        2026-11-18: part 2, step 19: the field ahead on open ground of D108, decided and pending on cards G2-FSC and
        G2-GNC; the walker's 1.6 m/s in the note (re-check 14b); the thin width (FSE step 17)
      - >-
        2026-11-18: part 2, step 19c: the range of about 4.8 m on open ground and the detection thresholds
        (consistency check 19b, contradiction 7); G2-FSC's sizing in the note (the lead systems engineer's point 14)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-132
    kind: performance
    function: F-06
    text: >-
      When its test person enters its protective field, the robot shall raise its person stop within 0.25 s, the
      LiDAR's own scan time included.
    rationale: >-
      SG-01: the perception's share of the stop of REQ-SYS-038 (the sensors and navigation engineer, step 6,
      TR-SN3): one scan period (0.1 s, P.sensors.lidar.Ts), the LiDAR's own scan time on the robot (up to 0.1 s) and
      the processing (at most 40 ms, tCompiledTiming's limit) make 0.24 s. Margin: 0.01 s over that sum; T-PER-02
      stops within one scan (at most 0.15 s). It is safe because the stop model of REQ-SYS-029 counts this 0.25 s,
      then one GNC step and the link to the ESC, 0.36 s from a person entering the field to the start of the stop.
    source: [N-07, SG-01, D72]
    parent: SG-01
    allocation: [PER, SNS]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        t_perception tPER02_ProtectiveField, tCompiledTiming
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Shaddad_Perception at 10 Hz
      note: >-
        tPER02 passes. tCompiledTiming fails on a loaded PC (44.3 ms against 40 ms; 26.2 ms on 2026-11-14). The
        robot's LiDAR and companion are not in the as-built record (card G1-04).
    status: agreed
    cards: [G1-04, G1-02]
    history:
      - "2026-11-18: part 2, step 13: added from the sensors and navigation engineer's TR-SN3 (step 6, section 7)"
      - "2026-11-18: part 2, step 19: the margin cites the one stop model of REQ-SYS-029 (the lead systems engineer's ruling 5a)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-133
    kind: performance
    function: F-07
    text: >-
      When a pedestrian walking at up to 0.8 m/s crosses its path while it works at 1.0 m/s, the robot shall stop
      and keep at least 1.0 m between itself or its implement and the pedestrian.
    rationale: >-
      SG-01 (PL d) and N-07: the robot stops before a person and holds. D100 sets S5's person criterion: at least
      1.0 m to a pedestrian who meets the robot, with D84's operator resume. Margin: the guidance holds when an
      obstacle comes within 1.5 m of the body's front bumper (P.gnc.obs.d_stop, x_f 0.50 m, params/param_gnc.m:103),
      and the perception's protective field stops the robot on a kept point in its path (D72): with no implement the
      robot stops 1.5 m from a person standing in its path, 0.5 m beyond the bound, but with the mower deck 0.70 m
      ahead of the bumper only about 0.8 m from the deck, below the bound, as the obstacle corridor leaves out the
      implement's reach (R-06): not met with the mower today, and measuring the hold from the fitted implement's
      front is card G2-GNC (R-06). For a pedestrian crossing from the side the margin is not yet measured, and one
      walking head-on (D108) needs its own analysis (cards G2-INT, G1-02). It is safe, with the hold measured from
      the implement's front, because the bound keeps the person outside the robot's stopping distance, and SG-01's
      own measures (REQ-SYS-033, -037) do not rest on it.
    source: [N-07, SG-01, D100, D84, D108]
    parent: SG-01
    allocation: [PER, SNS, GNC, MCU]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S5 (architecture section 12; the pedestrian retimed to cross the robot's path and the scripted resume on
        card G2-INT); planned: S5 with the mower and S5's head-on case (D108), card G2-INT
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the perception's protective field (P.sensors.per; D72) and the GNC's person hold (P.gnc.obs)
      note: >-
        S5 last ran on 2026-10-23 on the former robot, and its pedestrian came no closer than 32.7 m, so the
        criterion passed with no person near. D84's resume is on card G2-GNC. S5's pedestrian (0.8 m/s, D100) is the
        scenario's meeting case, and REQ-SYS-033's 1.6 m/s the speed at which a person crossing the field must be
        detected; they do not conflict (the functional safety engineer, step 17).
    status: agreed
    cards: [G2-INT, G2-GNC, G2-FSC]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-124; the note on the test person's speed"
      - >-
        2026-11-18: part 2, step 19: 'crosses its path' (FSE step 17, Table 1); the margin with the mower, not met
        today (re-check 14b); S5's head-on case (D108)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-134
    kind: performance
    function: F-07
    text: >-
      While it goes round a static obstacle in its lane, the robot shall keep at least 0.5 m from the obstacle and
      be back on its path within 5 m after it.
    rationale: >-
      N-01 and N-07: a palm-grove lane can be blocked by a box or a branch. D100 sets S5's criteria: at least 0.5 m
      to the box until G2-FSC rules on detours round a person, T7's lane bound (2.5 m), and the rejoin (abs(XTE) <
      0.1 m) within 5 m. D99 allows no automatic bypass after a person hold or lost scans, nor with the mower, until
      G2-GNC; a blocked lane then holds, pauses and alerts. The person case is REQ-SYS-133, and the bypass speed
      REQ-SYS-135.
    source: [N-01, N-07, D100, D99]
    parent: none
    allocation: [GNC, PER]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S5 (architecture section 12); the GNC test T7
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the local avoidance (VFH, TEB) and the bypass gates of the GNC (gnc spec)
      note: >-
        S5 on 2026-10-23 (the former robot): 0.40 m to the box and back on the path after 6.2 m, both failing; the
        current robot has not run S5. VFH is the default bypass by D99, while the parameters still select TEB
        (P.gnc.variant.teb = 1) until card G2-GNC.
    status: agreed
    cards: [G2-GNC, G2-INT]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - "2026-11-18: part 2, step 13: renumbered from REQ-SYS-125"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-135
    kind: performance
    function: F-07
    text: >-
      While it goes round an obstacle, the robot shall keep its speed at or below 0.6 m/s.
    rationale: >-
      N-07: a detour is slow, so that a person beside the lane is met at a low speed. The value is the bypass speed
