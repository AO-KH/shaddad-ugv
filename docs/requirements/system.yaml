      - >-
        2026-11-17: step 9: stop before the boundary, the body and the implement; MCU and DRV added (FSE-13, GNC-8,
        MCU-9)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2, step 19: the note cites REQ-SYS-122's stopping margin (re-check 14b)"
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-026
    function: F-04
    text: >-
      If the robot moves away from its planned path by more than the path bound of its kind of path for 1.0 s, then
      the robot shall stop and hold on its brakes: 0.35 m on greenhouse rows, 0.40 m in greenhouse turns, 0.50 m on
      palm-grove rows, 0.55 m in palm-grove turns, 0.75 m on transits and 0.25 m on the dock approach.
    rationale: >-
      SG-03: the robot stays within a bounded distance of its planned path. The path bounds are the GNC engineer's
      combined budget (step 5b, Table 1 and section 4; L-8): each is the guidance share plus 3 sigma at the gate of
      REQ-SYS-022. Margin against false stops: the bound less today's largest tracking error is 0.12 m (greenhouse
      rows), 0.175 m (greenhouse turns), 0.42 m (palm rows), 0.26 m (house transits) and 0.06 m (the dock approach).
      It is safe because normal running stays within the bound at 3 sigma and a divergence stops after 1.0 s: on
      palm rows at 1.0 m/s with a 10 deg divergence the true deviation at the stop is at most 0.50 + 0.45 + 0.17 +
      0.15 = 1.27 m, inside the 2.5 m half-width of the lane. On greenhouse rows it is up to 0.79 m, beyond the
      deck's 0.475 m to the wall line (D106); there the inset (REQ-SYS-087), the obstacle and person stops and D79's
      rule, which keeps people out of the aisle being mowed, protect. Rows on a slope take the row bounds (the
      lead systems engineer's ruling 4 of step 19).
    source: [N-09, SG-03, D89]
    parent: SG-03
    allocation: [GNC, NAV, MCU, DRV]
    safety: true
    tbd: none
    verification:
      method: Test
      level: subsystem
      reference: >-
        planned: card G1-02 (no test of the cross-track fault was found)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        GNC mission manager, G1: abs(e_y) above 0.5 m for 3 s into FAULT (gnc spec 4.1)
      note: >-
        No test of this fault was found. The check runs on the estimated position, so it cannot see a localisation
        error (hazard log E-08); the detection of a wrong but confident position is REQ-SYS-095. Decided, pending:
        the twin changes on card G2-GNC, with the kind of path from the plan's mission type; today 0.5 m for 3 s on
        every path (gnc spec 4.1, G1). On greenhouse rows a divergence of 10 deg carries the deck from the 0.35 m
        bound to the 0.475 m wall line in about 0.7 s, before the 1.0 s stop; there the protective field, which
        holds on the posts, is the guard (the functional safety engineer, step 17).
    status: agreed
    cards: [G1-02, G2-FSC]
    history:
      - "2026-11-17: drafted (G1-01 part 1, step 2)"
      - >-
        2026-11-17: step 9: partly, as the check judges the estimated position; MCU and DRV added; one error budget
        (SNS-12, MCU-9, SNS-1)
      - "2026-11-17: agreed, the project owner's approval of G1-01 part 1 (NASL-SHD-REQ-008 v1.0)"
      - "2026-11-18: part 2: the path bounds per kind of path for 1.0 s (GNC step 5b, section 4; L-8)"
      - >-
        2026-11-18: part 2, step 19: the protective field as the guard on greenhouse rows in the note (FSE step 17);
        rows on a slope (the lead systems engineer's ruling 4)
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-095
    function: F-04
    text: >-
      If its position is wrong by more than 0.15 m in a greenhouse aisle or on the dock approach, or 0.35 m in the
      open, then the robot shall start a controlled stop within 0.5 s in a greenhouse aisle or on the dock approach,
      or 0.7 s in the open, and hold on its brakes.
    rationale: >-
      SG-03: the robot stops when it cannot show where it is. REQ-SYS-022 and -023 rest on the robot's own position
      uncertainty, which a false RTK fix, a multipath jump or a scan-match error does not raise (R-43; HAZ-008,
      HAZ-009), and the geofence and the path bound judge the estimated position (REQ-SYS-025, -026; hazard log
      E-08). How the error is detected (an honest uncertainty, a second, independent position source or an integrity
      monitor) is the safety concept's. The integrity bounds and the detection times are the sensors and navigation
      engineer's (step 19, section 4), on the stricter drift model, the trackers' lateral acceleration
      P.gnc.spd.a_lat 0.3 m/s^2 from rest, which drifts 0.04 m in 0.5 s and 0.07 m in 0.7 s (the lead systems engineer's point 11):
      0.15 m and 0.5 s in a greenhouse aisle and on the dock approach, 0.35 m and 0.7 s in the open (palm-grove rows
      and turns, transits). Each bound sits above REQ-SYS-020's normal maximum, so that the monitor does not trip on
      normal errors: 0.05 m above the 0.10 m in a greenhouse, 0.10 m above the 0.25 m after an outage in the open,
      and 0.07 m above the 0.08 m on the dock approach. Margin: the bound, the 0.05 m guidance share and the drift
