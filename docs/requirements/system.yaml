      engineer, step 4; the drive engineer, step 9, Table 2). Provisional (D96). Margin: 50 ms is 5 FB1 periods of
      10 ms (100 Hz) and 0.07 m of travel at 1.40 m/s, and T18 shows no false time-out at a 10 % drop rate. It is
      safe because the class-A reaction drops DO0, so STO and the spring brakes act.
