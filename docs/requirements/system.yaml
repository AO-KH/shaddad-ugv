        REQ-SYS-020's 0.25 m, stricter than S7's 0.5 m
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-124
    kind: performance
    function: F-04
    text: >-
      While it runs a mission, the robot shall keep its position uncertainty consistent with its actual position
      error: in every mission at least 90 % of the samples with a 3-DOF pose NEES within the 95 % chi-square bound
      (7.81), and a mean NEES within [1.5, 4.5].
    rationale: >-
      SG-03 and N-09: both layers of D89 and the integrity requirement REQ-SYS-095 judge the robot's own uncertainty
      (REQ-SYS-022, -023), and they stop the robot in time only while that uncertainty is honest (the sensors and
      navigation engineer, step 6, TR-SN1; SNS-N1 of part 1). Margin: a consistent filter keeps 95 % of the samples
      within the bound, and 90 % leaves 5 points for correlated errors; the mean NEES of a consistent 3-DOF filter
      is 3, inside [1.5, 4.5]. It is safe because the gates of REQ-SYS-022 and -023 then act on an uncertainty that
      the true error does not exceed for long. T-NAV-02 gives a mean NEES of 3.69 (2026-11-08); S7's criterion is
      the NEES in bound at least 0.9 of the time.
    source: [N-09, SG-03, D69, D89]
    parent: SG-03
    allocation: [NAV, SNS, PER]
    safety: true
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S4; S7 (the NEES in bound); t_nav tNAV02_LawnMower, tNAV07_GreenhouseLidar; t_perception
        tSM01_AlongAisleHonesty
      campaign: simulation
    as_built:
      state: partly
      where: >-
        Shaddad_NavFusion's EKF covariance (posStd, covPose); Shaddad_Perception's scan-match covariance (D68)
      note: >-
        T-NAV-02 passes (mean NEES 3.69); S4 along 1.66 and across 0.55 (2026-11-14). S7 fails: NEES in bound 0.41
        (wet), 0.41 (temp), 0.44 (farm), 2026-11-08. No false RTK fix is modelled (R-43). Card G2-NAV.
    status: agreed
    cards: [G2-NAV]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-127 and merged with the sensors and navigation
        engineer's TR-SN1 (step 6, section 7): the mean NEES bound, and safety under SG-03
      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-125
    kind: performance
    function: F-05
    text: >-
      While it works a row with no condition that its speed governor limits (dense vegetation, a slope, a tracking
      error, a low charge or an obstacle), the robot shall hold its speed within 0.05 m/s of its plan's work speed:
      0.5 m/s in a greenhouse and 1.0 m/s in a palm grove.
    rationale: >-
      N-01 and N-02: the rows are mown at the plan's work speed, which the work rate (REQ-SYS-121) and the mission
      energy (REQ-SYS-104) rest on (the GNC engineer, step 5, TR-G2): 0.5 m/s in a greenhouse (the first design's 22
      min benchmark) and 1.0 m/s in a palm grove (D46's speed, while D101 supersedes its shift) (P.gnc.spd.v_work_*,
      params/param_gnc.m:31), within T5's +/-0.05 m/s. The solar park of TR-G2 is not a site of this phase, and the
      palm grove's route time comes with its design mission (D107), so neither is in the text. The governor's
      designed slow-downs (D46's vegetation limit and the pitch, cross-track, heading, low-charge and obstacle
      limits of P.gnc.spd) lie outside the text; T5 judges the speed against the commanded speed (the register's
      re-check, step 14b).
    source: [N-01, N-02, D107]
    parent: none
    allocation: [GNC, MCU, DRV]
    safety: false
    tbd: none
    verification:
      method: Test
      level: system
      reference: >-
        S4 and S5 (the rows); t_gnc_tracking testT5SpeedStep once its bench starts the mission (R-30, card T-03)
      campaign: simulation
    as_built:
      state: partly
      where: >-
        the speed governor (P.gnc.spd) and the MCU's speed loops (electronics spec 2.7.5)
      note: >-
        S5 last ran on 2026-10-23, on the former robot (1.06 times nominal), and has not run on the current robot
        (card G2-INT, with the bypass of D99). T5 fails with the other tracking tests, whose bench never starts its
        mission (R-30, card T-03).
    status: agreed
    cards: [G2-INT, T-03]
    history:
      - "2026-11-18: drafted (G1-01 part 2, step 12, the integration engineer)"
      - >-
        2026-11-18: part 2, step 13: renumbered from REQ-SYS-117 and merged with the GNC engineer's TR-G2 (step 5,
        Table 6): the work speed within 0.05 m/s; the route time left to the palm grove's design mission (D107),
