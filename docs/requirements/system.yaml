        the gearbox datasheet (card G1-04); t_drive T23 (the torques)
      campaign: field
    as_built:
      state: hardware
      where: >-
        the planetary gearboxes (P.drive.gear; drive spec 2.8)
      note: >-
        The gearboxes' ratings are estimates (T2N 240 and T2B 360 N m per side; the 750 W option 240 and 280 N m)
        until the supplier's data (card G1-04).
    status: agreed
