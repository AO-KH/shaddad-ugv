      - "2026-11-18: agreed, the project owner's approval of G1-01 part 2 (NASL-SHD-REQ-008 v2.0)"
  - id: REQ-SYS-127
    kind: performance
    function: F-05
    text: >-
      The robot shall follow lane-end turns of 0.81 m radius or more within 0.10 m of the planned turn.
